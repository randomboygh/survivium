# Recipe of the "Leather" bundle: hide rubbed with fat ("Animals", the "Game animals" bundle) dries on the drying rack
# ("Tools"); the recipe lies here so that the drying rack does not depend on leather.
- id: leather
  title: "[materials.recipes.leather]"
  makes: leather
  needs: {animals:hide: 1, animals:fat: 1}
  at: tools:drying_rack
  process: refine
  time: 12
