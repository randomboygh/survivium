# Platinum ore: rare veins in stone (role: ore, veins — the share of veins against other ores), a bronze pickaxe
# and better takes it (hardness 4); a platinum block — a block of ingots, placed like brick. Fields as for the
# core's materials (content/core/data/materials.yaml); sounds by name, from the "Sounds" mod.
- id: platinum_ore
  title: "[materials.materials.platinum_ore]"
  role: ore
  veins: 0.12
  priority: 2
  item: platinum_ore
  hardness: 4
  toughness: 8
  step: step_stone
  hit: hit_stone
- id: platinum_block
  title: "[materials.materials.platinum_block]"
  item: platinum_block
  hardness: 3
  toughness: 6
  step: step_stone
  hit: hit_stone
