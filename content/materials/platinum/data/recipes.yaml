# Рецепты бандла «Платина»: руду плавят с углём в горне «Инструментов», блок складывают из слитков на
# наковальне; лежат здесь, чтобы станки не зависели от этого металла.
- id: platinum_bar
  title: "[materials.recipes.platinum_bar]"
  makes: platinum_bar
  needs: {platinum_ore: 3, charcoal: 2}
  at: tools:forge
  process: smelt
  time: 12
- id: platinum_block
  title: "[materials.recipes.platinum_block]"
  makes: platinum_block
  needs: {platinum_bar: 3}
  at: tools:anvil
  time: 5
