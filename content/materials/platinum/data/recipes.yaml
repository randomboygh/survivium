# Recipes of the "Platinum" bundle: ore is smelted with coal in the "Tools" forge, a block is assembled from ingots on the
# anvil; they lie here so that the stations do not depend on this metal.
- id: platinum_bar
  title: "[materials.recipes.platinum_bar]"
  makes: platinum_bar
  needs: {platinum_ore: 3, charcoal: 2}
  at: tools:forge
  process: smelt
  time: 12
- id: platinum_block
  title: "[materials.recipes.platinum_block]"
  makes: platinum_block
  needs: {platinum_bar: 3}
  at: tools:anvil
  time: 5
