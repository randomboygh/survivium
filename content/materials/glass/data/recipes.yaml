# Recipe of the "Glass" bundle: sand ("Resources") is smelted with coal in a forge ("Tools", the "Forge" bundle);
# the recipe lies here so that the forge does not depend on glass.
- id: glass
  title: "[materials.recipes.glass]"
  makes: glass
  needs: {resources:sand: 2, charcoal: 1}
  at: tools:forge
  process: smelt
  time: 6
