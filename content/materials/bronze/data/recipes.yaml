# Recipes of the "Bronze" bundle: the crucible — on the potter's wheel and in the kiln, the alloy — in the forge
# ("Tools"); copper, tin and coal — the "Copper", "Tin" and "Charcoal" bundles.
- id: raw_crucible
  title: "[materials.recipes.raw_crucible]"
  makes: raw_crucible
  needs: {resources:clay: 3, resources:sand: 1}
  at: tools:potters_wheel
  time: 5
- id: crucible
  title: "[materials.recipes.crucible]"
  makes: crucible
  needs: {raw_crucible: 1}
  at: tools:kiln
  process: smelt
  time: 8
- id: bronze_bar
  title: "[materials.recipes.bronze_bar]"
  makes: bronze_bar
  count: 3
  needs: {copper_bar: 3, tin_bar: 1, charcoal: 1}
  keeps: {crucible: 1}
  at: tools:forge
  process: smelt
  time: 8
