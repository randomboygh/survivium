# Recipe of the "Tar" bundle: tar is driven out of logs in a kiln, in a clay pot (it must be
# in the bag and is not used up); charcoal is left as well. The kiln and the pot — of "Tools" (the "Kiln" and
# "Potter's wheel" bundles): the recipe lies here so that the kiln does not depend on the wheel.
- id: tar
  title: "[materials.recipes.tar]"
  makes: tar
  needs: {resources:log: 2}
  keeps: {tools:pot: 1}
  also: [{item: charcoal, count: 1, chance: 0.5}]
  at: tools:kiln
  process: smelt
  time: 8
