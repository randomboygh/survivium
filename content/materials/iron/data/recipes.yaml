# Recipes of the "Iron" bundle: the bloom — in the bloomery, the ingot — in the forge (both stations in
# "Tools"); they lie here so that the stations do not depend on iron.
- id: iron_bloom
  title: "[materials.recipes.iron_bloom]"
  makes: iron_bloom
  needs: {iron_ore: 2, charcoal: 1}
  at: tools:bloomery
  process: smelt
  time: 10
- id: iron_bar
  title: "[materials.recipes.iron_bar]"
  makes: iron_bar
  count: 2
  needs: {iron_bloom: 1, charcoal: 1}
  at: tools:forge
  process: smelt
  time: 6
