# Recipes of the "Gold" bundle: ore is smelted with coal in the "Tools" forge, a block is assembled from ingots on the
# anvil; they lie here so that the stations do not depend on this metal.
- id: gold_bar
  title: "[materials.recipes.gold_bar]"
  makes: gold_bar
  needs: {gold_ore: 2, charcoal: 1}
  at: tools:forge
  process: smelt
  time: 8
- id: gold_block
  title: "[materials.recipes.gold_block]"
  makes: gold_block
  needs: {gold_bar: 3}
  at: tools:anvil
  time: 5
