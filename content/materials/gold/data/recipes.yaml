# Рецепты бандла «Золото»: руду плавят с углём в горне «Инструментов», блок складывают из слитков на
# наковальне; лежат здесь, чтобы станки не зависели от этого металла.
- id: gold_bar
  title: Золотой слиток
  makes: gold_bar
  needs: {gold_ore: 2, charcoal: 1}
  at: tools:forge
  process: smelt
  time: 8
- id: gold_block
  title: Золотой блок
  makes: gold_block
  needs: {gold_bar: 3}
  at: tools:anvil
  time: 5
