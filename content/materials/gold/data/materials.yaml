# and better takes it (hardness 4); a gold block — a block of ingots, placed like brick. Fields as for the
# core's materials (content/core/data/materials.yaml); sounds by name, from the "Sounds" mod.
- id: gold_ore
  title: "[materials.materials.gold_ore]"
  role: ore
  veins: 0.2
  priority: 2
  side_fray: 5
  item: gold_ore
  hardness: 4
  toughness: 8
  step: step_stone
  hit: hit_stone
- id: gold_block
  title: "[materials.materials.gold_block]"
  item: gold_block
  hardness: 3
  toughness: 6
  step: step_stone
  hit: hit_stone
