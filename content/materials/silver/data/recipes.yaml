# Recipes of the "Silver" bundle: ore is smelted with coal in the "Tools" forge, a block is assembled from ingots on the
# anvil; they lie here so that the stations do not depend on this metal.
- id: silver_bar
  title: "[materials.recipes.silver_bar]"
  makes: silver_bar
  needs: {silver_ore: 2, charcoal: 1}
  at: tools:forge
  process: smelt
  time: 7
- id: silver_block
  title: "[materials.recipes.silver_block]"
  makes: silver_block
  needs: {silver_bar: 3}
  at: tools:anvil
  time: 5
