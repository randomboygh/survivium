# content/materials/finds/data/items.yaml
"[materials.items.ammonite]": "Аммонит"
"[materials.items.ammonite.about]": "Раковина, давным-давно ставшая камнем. Изредка попадается в скале."
"[materials.items.geode]": "Жеода"
"[materials.items.geode.about]": "Простой с виду камень, а внутри полость с фиолетовыми кристаллами."
"[materials.items.amber]": "Янтарь"
"[materials.items.amber.about]": "Древняя смола, тёплая на ощупь, с застывшей внутри мошкой."
"[materials.items.seashell]": "Ракушка"
"[materials.items.seashell.about]": "Маленькая раковина, найденная в песке. Нанизанные на верёвку, ракушки становятся бусами."
"[materials.items.feather]": "Перо"
"[materials.items.feather.about]": "Птичье перо, найденное в траве. Привязанное к шнурку, его носят в волосах."
"[materials.items.chalk]": "Мел"
"[materials.items.chalk.about]": "Мягкий белый камень, изредка попадается при копании камня на плато, в скалах и на побережье. Из него варят белую краску."
"[materials.items.ochre]": "Охра"
"[materials.items.ochre.about]": "Жёлто-бурая земля, изредка попадается при копании глины и песка в красных скалах, саванне и пустыне. Из неё варят охристую краску."
"[materials.items.murex]": "Иглянка"
"[materials.items.murex.about]": "Редкая колючая морская улитка, попадается в песке тропического пляжа. Из неё варят пурпурную краску."
