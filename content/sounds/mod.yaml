# Звуки, у которых хозяин — сама игра: природа и погода, игрок (шаги, работа), интерфейс; бандл на
# каждое, выключаются по одному. Звуки вещей лежат у вещей (удар по стволу — у древесины, взмах —
# у меча, голоса — у зверей), ноты музыки — в моде «Музыка».
