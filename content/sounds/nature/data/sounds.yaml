# Sounds of nature and weather: wind, rain, hail, blizzard, water, fire, crickets, thunder, owl. Files
# sounds/<id>.wav, or <id>_1.wav ... - as many as variants; volume - loudness, loop - on
# repeat. Built by tools/make_sounds.gd; the code asks for a sound by name (rain) - a recording with that
# name from any loaded bundle will do, if there is none - silence.
- id: wind
  title: "[sounds.sounds.wind]"
  loop: true
- id: rain
  title: "[sounds.sounds.rain]"
  loop: true
- id: hail
  title: "[sounds.sounds.hail]"
  loop: true
- id: blizzard
  title: "[sounds.sounds.blizzard]"
  loop: true
- id: water
  title: "[sounds.sounds.water]"
  loop: true
  volume: 0.8
- id: fire
  title: "[sounds.sounds.fire]"
  loop: true
- id: crickets
  title: "[sounds.sounds.crickets]"
  loop: true
  volume: 0.4
- id: thunder
  title: "[sounds.sounds.thunder]"
  variants: 2
