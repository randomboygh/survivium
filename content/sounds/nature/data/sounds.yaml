# Звуки природы и погоды: ветер, дождь, град, метель, вода, огонь, сверчки, гром, сова. Файлы
# sounds/<id>.wav, или <id>_1.wav ... — столько, сколько variants; volume — громкость, loop — по
# кругу. Собраны tools/make_sounds.gd; код просит звук по имени (rain) — подойдёт запись с таким
# именем из любого загруженного бандла, нет её — тишина.
- id: wind
  title: "[sounds.sounds.wind]"
  loop: true
- id: rain
  title: "[sounds.sounds.rain]"
  loop: true
- id: hail
  title: "[sounds.sounds.hail]"
  loop: true
- id: blizzard
  title: "[sounds.sounds.blizzard]"
  loop: true
- id: water
  title: "[sounds.sounds.water]"
  loop: true
  volume: 0.8
- id: fire
  title: "[sounds.sounds.fire]"
  loop: true
- id: crickets
  title: "[sounds.sounds.crickets]"
  loop: true
  volume: 0.4
- id: thunder
  title: "[sounds.sounds.thunder]"
  variants: 2
