# Звуки материалов основы: шаг по ячейке (step) и удар по ней инструментом (hit), патчами
# к записям основы (patch: true меняет только названные поля). Звук называется по имени;
# материалы других модов называют свои звуки сами.
- id: core:grass
  patch: true
  step: step_grass
  hit: dig
- id: core:dirt
  patch: true
  step: step_dirt
  hit: dig
- id: core:stone
  patch: true
  step: step_stone
  hit: hit_stone
- id: core:water
  patch: true
  step: step_water
