# Recipes of the "Scythe" bundle: at - the station where it is made (a reference to an item: the workbench bundle
# is needed by whoever has recipes made at it), tools - the tool classes in the bag; branch, log,
# flint, stone and clay are "Resources", rope, planks and brick are "Materials". All the recipe fields are in
# docs/DATA_MODEL.md.
- id: stone_scythe
  title: "[tools.recipes.stone_scythe]"
  makes: stone_scythe
  needs: {resources:flint: 2, resources:branch: 2, materials:cord: 2}
  at: workbench
  time: 6
- id: wooden_scythe
  title: "[tools.recipes.wooden_scythe]"
  makes: wooden_scythe
  needs: {materials:planks: 1, resources:branch: 2, materials:cord: 1}
  at: workbench
  time: 4
  quality_cap: 30
- id: copper_scythe
  title: "[tools.recipes.copper_scythe]"
  makes: copper_scythe
  needs: {materials:copper_bar: 2, materials:planks: 2}
  at: workbench
  time: 7
- id: bronze_scythe
  title: "[tools.recipes.bronze_scythe]"
  makes: bronze_scythe
  needs: {materials:bronze_bar: 2, materials:planks: 2}
  at: workbench
  time: 7
- id: iron_scythe
  title: "[tools.recipes.iron_scythe]"
  makes: iron_scythe
  needs: {materials:iron_bar: 2, materials:planks: 2}
  at: anvil
  time: 7
- id: steel_scythe
  title: "[tools.recipes.steel_scythe]"
  makes: steel_scythe
  needs: {materials:steel_bar: 2, materials:planks: 2}
  at: anvil
  time: 7
