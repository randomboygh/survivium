# Предметы бандла «Верстак» мода «Инструменты и крафт». Поля — как у предметов основы
# (content/core/data/items.yaml): tool — класс инструмента (axe, pickaxe, shovel, sword, scythe
# работают в мире; новое слово — класс для рецептов, в мире он как руки), power, swing, reach,
# durability, repair — чем чинят («Ресурсы»: кремень, «Материалы»: верёвка, доски); sprite и anim —
