# Предметы бандла «Копьё» мода «Инструменты и крафт»: оружие, которое бросают или из которого стреляют.
# range — как далеко (в клетках), ammo — чем стреляют (по одному из сумки на выстрел; без него бросают само
# оружие); удар по зверю — power. Кнопка действия стреляет туда, куда смотрит персонаж, касание земли — туда,
# где коснулись; выстрел попадает в первого зверя на пути, а выпущенное ложится там, где упало.
- id: flint_spear
  title: Кремнёвое копьё
  description: Длинное копьё с кремнёвым наконечником. Его метают в зверя и подбирают снова.
  weight: 1.5
  stack: 1
  model: flint_spear
  icon: flint_spear
  tool: spear
  sprite: flint_spear
