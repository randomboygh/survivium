# Items of the "Spear" bundle of the "Tools and crafting" mod: a weapon that is thrown or shot.
# range - how far (in cells), ammo - what it shoots (one from the bag per shot; without it the weapon
# itself is thrown); the hit on an animal is power. The action button shoots where the character is looking, a touch on the ground - where
# it was touched; the shot hits the first animal in its path, and what was fired lies where it fell.
- id: flint_spear
  title: "[tools.items.flint_spear]"
  description: "[tools.items.flint_spear.about]"
  weight: 1.5
  stack: 1
  model: flint_spear
  icon: flint_spear
  tool: spear
  sprite: flint_spear
  anim: slash
  power: 4
  swing: 0.7
  reach: 4
  range: 14
  durability: 120
  repair: {resources:flint: 1}
