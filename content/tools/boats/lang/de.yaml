"Плот": "Floß"
"Брёвна, связанные верёвкой. Возьми в руку и нажми действие у воды, чтобы спустить его и сесть.": "Mit Schnur gebundene Stämme. Nimm es in die Hand und drück am Wasser die Aktion, um es zu Wasser zu lassen und aufzusteigen."
"Лодка": "Boot"
"Лёгкая лодка из досок, просмолённая. Быстрее плота, но грести ею можно только с вёслами в сумке.": "Ein leichtes geteertes Boot aus Brettern. Schneller als ein Floß, aber man rudert es nur mit Rudern in der Tasche."
"Вёсла": "Ruder"
"Пара вёсел. Пока они в сумке, лодка идёт быстро.": "Ein Paar Ruder. Solange sie in der Tasche sind, fährt das Boot schnell."
