"Плот": "Radeau"
"Брёвна, связанные верёвкой. Возьми в руку и нажми действие у воды, чтобы спустить его и сесть.": "Des rondins liés par une corde. Prenez-le en main et faites l'action au bord de l'eau pour le mettre à l'eau et monter dessus."
"Лодка": "Barque"
"Лёгкая лодка из досок, просмолённая. Быстрее плота, но грести ею можно только с вёслами в сумке.": "Une barque légère en planches goudronnées. Plus rapide que le radeau, mais on ne rame qu'avec des rames dans le sac."
"Вёсла": "Rames"
"Пара вёсел. Пока они в сумке, лодка идёт быстро.": "Une paire de rames. Tant qu'elles sont dans le sac, la barque va vite."
