"Плот": "Balsa"
"Брёвна, связанные верёвкой. Возьми в руку и нажми действие у воды, чтобы спустить его и сесть.": "Troncos atados con cuerda. Tómala en la mano y pulsa la acción junto al agua para botarla y subir."
"Лодка": "Barca"
"Лёгкая лодка из досок, просмолённая. Быстрее плота, но грести ею можно только с вёслами в сумке.": "Una barca ligera de tablas embreada. Más rápida que la balsa, pero solo se rema con remos en la bolsa."
"Вёсла": "Remos"
"Пара вёсел. Пока они в сумке, лодка идёт быстро.": "Un par de remos. Mientras estén en la bolsa, la barca va rápido."
