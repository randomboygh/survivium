# Предметы бандла «Плот и лодка» мода «Инструменты и крафт»: на чём ходят по воде. Плот или лодку в
# руке спускают на воду кнопкой действия, лицом к воде, и садятся в них; у берега той же кнопкой
# выходят, и плот или лодка снова в сумке (src/shared/game/actions_boat.gd). `vessel` — во сколько
# раз быстрее ходьбы на нём плывут (навык плавания ускоряет и их), `oars` — что нужно в сумке, чтобы
# грести: без вёсел лодка едва движется.
- id: raft
  title: Плот
  description: Брёвна, связанные верёвкой. Возьми в руку и нажми действие у воды, чтобы спустить его и сесть.
  era: core:primitive
  weight: 12.0
  stack: 1
  icon: raft
  model: raft
  vessel: 0.7
- id: boat
  title: Лодка
  description: Лёгкая лодка из досок, просмолённая. Быстрее плота, но грести ею можно только с вёслами в сумке.
  era: core:bronze
  weight: 10.0
  stack: 1
  icon: boat
  model: boat
  vessel: 1.4
  oars: oars
- id: oars
  title: Вёсла
  description: Пара вёсел. Пока они в сумке, лодка идёт быстро.
  era: core:primitive
  weight: 1.5
  stack: 1
  icon: oars
  model: oars
