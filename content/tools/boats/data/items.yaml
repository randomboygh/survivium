# Items of the "Raft and boat" bundle of the "Tools and crafting" mod: what people travel on water in. A raft or boat in
# the hand is launched onto the water with the action button, facing the water, and you board it; at the shore the same button
# gets you out, and the raft or boat is back in the bag (src/shared/game/actions_boat.gd). `vessel` - how many
# times faster than walking you sail in it (the swimming skill speeds these up too), `oars` - what is needed in the bag to
# row: without oars the boat barely moves. `windage` - how strongly the wind pushes the vessel (the raft is tall and
# flat - 1, the boat less).
- id: raft
  title: "[tools.items.raft]"
  description: "[tools.items.raft.about]"
  era: core:primitive
  weight: 12.0
  stack: 1
  icon: raft
  model: raft
  vessel: 0.4
  windage: 1.0
- id: boat
  title: "[tools.items.boat]"
  description: "[tools.items.boat.about]"
  era: core:bronze
  weight: 10.0
  stack: 1
  icon: boat
  model: boat
  vessel: 0.8
  windage: 0.4
  oars: oars
- id: oars
  title: "[tools.items.oars]"
  description: "[tools.items.oars.about]"
  era: core:primitive
  weight: 1.5
  stack: 1
  icon: oars
  model: oars
