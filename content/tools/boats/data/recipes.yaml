# Recipes of the "Raft and boat" bundle: the raft is tied by hand from "Resources" logs and "Materials" rope;
# the boat and oars are made at the workbench (the "Workbench" bundle) from planks, and the boat is also tarred with "Materials" tar.
# All the recipe fields are in docs/DATA_MODEL.md.
- id: raft
  title: "[tools.recipes.raft]"
  makes: raft
  needs: {resources:log: 6, materials:cord: 4}
  time: 10
- id: boat
  title: "[tools.recipes.boat]"
  makes: boat
  needs: {materials:planks: 12, materials:tar: 2}
  at: workbench
  time: 20
- id: oars
  title: "[tools.recipes.oars]"
  makes: oars
  needs: {materials:planks: 3}
  at: workbench
  time: 6
