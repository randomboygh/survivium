# Recipes of the "Pickaxe" bundle: at - the station where it is made (a reference to an item: the workbench bundle
# is needed by whoever has recipes made at it), tools - the tool classes in the bag; branch, log,
# flint, stone and clay are "Resources", rope, planks and brick are "Materials". All the recipe fields are in
# docs/DATA_MODEL.md.
- id: stone_pickaxe
  title: "[tools.recipes.stone_pickaxe]"
  makes: stone_pickaxe
  needs: {resources:flint: 2, resources:branch: 2, materials:cord: 1}
  at: workbench
  time: 6
# Before flint is found: by hand from branches and cord, no planks or workbench; weaker than stone.
- id: wooden_pickaxe
  title: "[tools.recipes.wooden_pickaxe]"
  makes: wooden_pickaxe
  needs: {resources:branch: 3, materials:cord: 1}
  time: 4
  quality_cap: 30
- id: copper_pickaxe
  title: "[tools.recipes.copper_pickaxe]"
  makes: copper_pickaxe
  needs: {materials:copper_bar: 3, materials:planks: 1}
  at: workbench
  time: 7
- id: bronze_pickaxe
  title: "[tools.recipes.bronze_pickaxe]"
  makes: bronze_pickaxe
  needs: {materials:bronze_bar: 3, materials:planks: 1}
  at: workbench
  time: 7
- id: iron_pickaxe
  title: "[tools.recipes.iron_pickaxe]"
  makes: iron_pickaxe
  needs: {materials:iron_bar: 3, materials:planks: 1}
  at: anvil
  time: 7
- id: steel_pickaxe
  title: "[tools.recipes.steel_pickaxe]"
  makes: steel_pickaxe
  needs: {materials:steel_bar: 3, materials:planks: 1}
  at: anvil
  time: 7
