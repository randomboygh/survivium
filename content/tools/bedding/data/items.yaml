# Предметы бандла «Постель» мода «Инструменты и крафт»: то, на чём спят. Ставится на землю, как
# станок (prop — свой класс у каждой постели: по нему ищется модель models/<model>.png); касание ложит в неё спать (Protocol.LIE_IN), и
# бодрость возвращается в `bedding` раз быстрее (src/shared/game/character.gd, sleep_rate); под
# крышей — ещё в полтора раза.
