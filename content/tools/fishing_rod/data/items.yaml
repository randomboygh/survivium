# Fishing rod of the "Fishing rod" bundle of the "Tools and crafting" mod: class rod. The action button casts the float into open
# water in front of the character (a touch on water - to where it was touched) no farther than range cells and stays pressed: a
# real fish from the nearby water (the creature's catch field) swims up to the float, the float dips, and the second press
# pulls it into the bag (before a bite - it reels in the line). ammo - bait: one per hook from the bag, with it
# fish bite often, without it rarely; a fish that bites eats it. Frozen water cannot be fished.
