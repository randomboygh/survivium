# Удочка бандла «Удочка» мода «Инструменты и крафт»: класс rod. Кнопка действия закидывает поплавок в открытую
# воду перед персонажем (касание воды — туда, где коснулись) не дальше range клеток и остаётся нажатой: к
# поплавку подплывает настоящая рыба из воды рядом (поле catch существа), поплавок ныряет, и второе нажатие
# вытаскивает её в сумку (до поклёвки — сматывает леску). ammo — наживка: по одной на крючок из сумки, с ней
# клюёт часто, без неё редко; клюнувшая рыба её съедает. Замёрзшая вода не ловится.
