  model: fishing_rod
  icon: fishing_rod
  tool: rod
  sprite: fishing_rod
  anim: slash
  swing: 0.9
  reach: 4
  range: 6
  ammo: bait
  durability: 240
  repair: {materials:cord: 1}
- id: bait
