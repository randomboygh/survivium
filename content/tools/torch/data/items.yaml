# Предметы бандла «Факел» мода «Инструменты и крафт». light — вещь в руке светит: на
# сколько мировых единиц достаёт её свет; без неё в темноте вокруг
# игрока лишь слабый отсвет. Светящая вещь расходуется, как еда или топливо: в стопке лежат целые,
# взятая в руку зажигается и горит burns секунд, догорев, пропадает из стопки, и загорается
# следующая; убранная из руки ждёт, сколько ей осталось. sprite — лист в руках
# (sprites/held/<sprite>.png): самая яркая точка кадра — где горит огонь. scares — горящая вещь в руке
# или поставленная держит зверей, которые боятся огня, на столько мировых единиц.
