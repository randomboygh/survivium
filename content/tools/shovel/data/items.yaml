# Items of the "Shovel" bundle of the "Tools and crafting" mod. Fields are as for the core items
# (content/core/data/items.yaml): tool - the tool class (axe, pickaxe, shovel, sword, scythe
# work in the world; a new word is a class for recipes, in the world it acts like hands), power, swing, reach,
# durability, repair - what mends it ("Resources": flint, "Materials": rope, planks); sprite and anim -
# the sheet in the hands (sprites/held/<sprite>.png) and the character's work; prop - the class of a thing placed on
# 2x2 cells (workbench, kiln, chest), and its flags: storage, fire, repairs, serves, place_tool;
# model - its voxel model (models/<model>.png).
- id: wooden_shovel
  title: "[tools.items.wooden_shovel]"
  weight: 1.2
  stack: 1
  model: shovel
  icon: shovel
  tool: shovel
  sprite: shovel
  anim: dig
  power: 1
  swing: 0.25
  reach: 10
  durability: 300
  repair: {materials:planks: 1}
