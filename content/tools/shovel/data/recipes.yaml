# Recipes of the "Shovel" bundle: at - the station where it is made (a reference to an item: the workbench bundle
# is needed by whoever has recipes made at it), tools - the tool classes in the bag; branch, log,
# flint, stone and clay are "Resources", rope, planks and brick are "Materials". All the recipe fields are in
# docs/DATA_MODEL.md.
- id: wooden_shovel
  title: "[tools.recipes.wooden_shovel]"
  makes: wooden_shovel
  needs: {materials:planks: 2, resources:branch: 1}
  at: workbench
  time: 5
- id: copper_shovel
  title: "[tools.recipes.copper_shovel]"
  makes: copper_shovel
  needs: {materials:copper_bar: 2, materials:planks: 1}
  at: workbench
  time: 6
- id: bronze_shovel
  title: "[tools.recipes.bronze_shovel]"
  makes: bronze_shovel
  needs: {materials:bronze_bar: 2, materials:planks: 1}
  at: workbench
  time: 6
- id: iron_shovel
  title: "[tools.recipes.iron_shovel]"
  makes: iron_shovel
  needs: {materials:iron_bar: 2, materials:planks: 1}
  at: anvil
  time: 6
- id: steel_shovel
  title: "[tools.recipes.steel_shovel]"
  makes: steel_shovel
  needs: {materials:steel_bar: 2, materials:planks: 1}
  at: anvil
  time: 6
