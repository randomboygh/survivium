# Recipes of the "Sword" bundle: at - the station where it is made (a reference to an item: the workbench bundle
# is needed by whoever has recipes made at it), tools - the tool classes in the bag; branch, log,
# flint, stone and clay are "Resources", rope, planks and brick are "Materials". All the recipe fields are in
# docs/DATA_MODEL.md.
- id: wooden_sword
  title: "[tools.recipes.wooden_sword]"
  makes: wooden_sword
  needs: {materials:planks: 2, materials:cord: 1}
  at: workbench
  time: 5
- id: stone_sword
  title: "[tools.recipes.stone_sword]"
  makes: stone_sword
  needs: {resources:flint: 2, resources:branch: 1, materials:cord: 1}
  at: workbench
  time: 5
- id: copper_sword
