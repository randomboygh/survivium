# Предметы бандла «Живоловка» мода «Инструменты и крафт»: клетка из веток, в которую кладут приманку.
# Ставят её как сундук; зверь, который ест с руки то, что в ней лежит (поле tame_food существа),
# приходит на запах издалека (`trap` — на сколько клеток), съедает приманку и остаётся в клетке
# пойманным: живым предметом, которого существо называет в поле `trapped`. Его забирают из клетки
# в сумку и выпускают кнопкой действия — выпущенный уже ручной и ходит за хозяином
# (src/shared/game/actions_tame.gd).
- id: trap
  title: Живоловка
  description: Клетка из веток с дверцей на сторожке. Положи внутрь морковь или репу, и заяц сам придёт в неё.
  era: core:primitive
  weight: 3.0
  stack: 1
  icon: trap
  model: trap
  prop: trap
  storage: 2
  trap: 8.0
- id: live_rabbit
  title: Пойманный заяц
  description: Живой заяц из живоловки. Возьми его в руку и нажми действие, чтобы выпустить: он уже ручной и пойдёт за тобой.
  era: core:primitive
  weight: 2.0
