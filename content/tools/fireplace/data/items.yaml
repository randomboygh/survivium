# Камин: огонь в кирпичном очаге на две клетки в ширину и одну в высоту, глубиной в клетку;
# ставится лицом к игроку, спиной к стене. Горит как костёр (fire): греет вокруг, горит на
# топливе (fuel_max — сколько секунд в нём помещается), разжигается и подкладывается тем же
# топливом, у него готовят то же, что у костра (serves). Ставится холодным (fuel_start 0), огонь
# внутри не обжигает, потушенный забирается в сумку целиком (у огня есть своя модель). Под крышей
# дождь его не тушит. Поля — как у предметов основы (content/core/data/items.yaml).
- id: fireplace
  title: Камин
  description: Кирпичный очаг для дома. Греет как костёр, горит на топливе, на нём можно готовить.
  weight: 30.0
  stack: 1
  icon: fireplace
  model: fireplace
  prop: fireplace
  fire: true
  fuel_max: 2400
  fuel_start: 0
  serves: [core:campfire]
