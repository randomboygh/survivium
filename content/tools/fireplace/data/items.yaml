# Fireplace: a fire in a brick hearth two cells wide and one high, one cell deep;
# placed facing the player, back to a wall. Burns like a campfire (fire): warms around it, burns on
# fuel (fuel_max - how many seconds fit in it), is lit and fed with the same fuel,
# and cooks the same things as a campfire (serves). Placed cold (fuel_start 0), the fire
# inside does not burn, and once put out it is picked up into the bag whole (the fire has its own model). Under a roof
# rain does not put it out. Fields are as for the core items (content/core/data/items.yaml).
- id: fireplace
  title: "[tools.items.fireplace]"
  description: "[tools.items.fireplace.about]"
  weight: 30.0
  stack: 1
  icon: fireplace
  model: fireplace
  prop: fireplace
  fire: true
  quality_cap: 90
  scares: 3.0
  fuel_max: 2400
  fuel_start: 0
  serves: [core:campfire]
