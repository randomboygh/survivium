# Items of the "Watering can" bundle of the "Tools and crafting" mod. An empty can taken in the hand is filled at
# fresh water (fills_to), like the waterskin; with a full one (tool: can) beds are watered: a watered bed stays
# wet for a day, and what is sown on it grows (src/shared/game/actions_farm.gd). durability - how many
# cells one fill of water waters; once emptied, the can is empty again (empties_to).
- id: watering_can
  title: "[tools.items.watering_can]"
  description: "[tools.items.watering_can.about]"
  weight: 0.8
  stack: 1
  icon: watering_can
  fills_to: watering_can_full
- id: watering_can_full
  title: "[tools.items.watering_can_full]"
  description: "[tools.items.watering_can_full.about]"
  weight: 2.8
  stack: 1
  icon: watering_can_full
  tool: can
  anim: dig
  area: 1
  swing: 0.6
  reach: 8
  durability: 10
  empties_to: watering_can
