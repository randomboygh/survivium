# Recipes of the "Kiln" bundle: at - the station where it is made (a reference to an item: the workbench bundle
# is needed by whoever has recipes made at it), tools - the tool classes in the bag; branch, log,
# flint, stone and clay are "Resources", rope, planks and brick are "Materials". All the recipe fields are in
# docs/DATA_MODEL.md.
- id: kiln
  title: "[tools.recipes.kiln]"
  makes: kiln
  needs: {resources:stone: 8, resources:clay: 4}
  at: workbench
  time: 10
- id: brick
  title: "[tools.recipes.brick]"
  makes: materials:brick
  needs: {resources:clay: 1}
  at: kiln
  process: smelt
  time: 4
- id: charcoal
  title: "[tools.recipes.charcoal]"
  makes: materials:charcoal
  count: 2
  needs: {resources:log: 1}
  at: kiln
  process: smelt
  time: 6
