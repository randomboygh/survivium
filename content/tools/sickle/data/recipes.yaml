# Recipes of the "Sickle" bundle: the stone one is tied by hand, the copper one is made at the workbench, the iron one - at
# the anvil. Flint and branch are "Resources", rope, planks and ingots are "Materials".
- id: stone_sickle
  title: "[tools.recipes.stone_sickle]"
  makes: stone_sickle
  needs: {resources:flint: 2, resources:branch: 1, materials:cord: 1}
  time: 4
- id: copper_sickle
  title: "[tools.recipes.copper_sickle]"
  makes: copper_sickle
  needs: {materials:copper_bar: 1, resources:branch: 1}
  at: workbench
  time: 5
- id: iron_sickle
  title: "[tools.recipes.iron_sickle]"
  makes: iron_sickle
  needs: {materials:iron_bar: 1, resources:branch: 1}
  at: anvil
  time: 5
