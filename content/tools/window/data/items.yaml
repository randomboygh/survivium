# игроку, твёрдое; касание забирает его (prop: window, window). Поля — как у предметов основы.
- id: window
  title: Окно
  description: Рама со стеклом для проёма в стене.
  weight: 1.5
  stack: 10
  icon: window
  model: window
  prop: window
  window: true
