# Предметы бандла «Мебель» мода «Инструменты и крафт» (решение 163, 7А): ставятся лицом к игроку,
# как станки (prop — класс модели, models/<model>.png; клетки — по срезу модели, кратно 8 px), но
# станком не считаются (furniture). Касание забирает то, что ничего не хранит. Табурет: стоящий на нём
# или рядом без движения восстанавливает выносливость в `seat` раз быстрее. Кровать — постель
# (bedding). Шкаф и бочка хранят (storage), в бочке еда портится в `keeps` раза медленнее.
# Поля — как у предметов основы (content/core/data/items.yaml).
