# Items of the "Furniture" bundle of the "Tools and crafting" mod (decision 163, 7A): placed facing the player,
# like stations (prop - the model class, models/<model>.png; cells - by the model's slice, a multiple of 8 px), but
# not counted as a station (furniture). A touch picks up what stores nothing. Stool: whoever stands on it
# or beside it without moving restores stamina `seat` times faster. The bed is bedding
# (bedding). The wardrobe and barrel store things (storage), and food spoils `keeps` times slower in the barrel.
# Fields are as for the core items (content/core/data/items.yaml).
- id: table
  title: "[tools.items.table]"
  description: "[tools.items.table.about]"
  weight: 8.0
  stack: 1
  icon: table
  model: table
  prop: table
  furniture: true
