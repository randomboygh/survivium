# content/tools/furniture/data/items.yaml
"[tools.items.table]": "Стол"
"[tools.items.table.about]": "Дощатый стол на четырёх ножках, на две клетки."
"[tools.items.stool]": "Табурет"
"[tools.items.stool.about]": "Посиди рядом — силы возвращаются вдвое быстрее."
"[tools.items.wooden_bed]": "Кровать"
"[tools.items.wooden_bed.about]": "Деревянная кровать с холщовым тюфяком. Сон на ней восстанавливает лучше любой подстилки."
"[tools.items.cupboard]": "Шкаф"
"[tools.items.cupboard.about]": "Высокий шкаф из досок, хранит больше сундука."
"[tools.items.wide_cupboard]": "Широкий шкаф"
"[tools.items.wide_cupboard.about]": "Шкаф на две клетки в ширину и две в высоту, с четырьмя дверцами. Хранит больше большого сундука."
"[tools.items.barrel]": "Бочка"
"[tools.items.barrel.about]": "Бочка в обручах. Еда в ней портится вдвое медленнее."
"[tools.items.rug]": "Половик"
"[tools.items.rug.about]": "Тканый половик для пола, на две клетки."
"[tools.items.wooden_chair]": "Стул"
"[tools.items.wooden_chair.about]": "Дощатый стул со спинкой. Посиди рядом — силы возвращаются быстрее."
"[tools.items.iron_chair]": "Железный стул"
"[tools.items.iron_chair.about]": "Кованый стул с подушкой. Посиди рядом — силы возвращаются быстрее, и он не горит."
"[tools.items.wooden_bench]": "Лавка"
"[tools.items.wooden_bench.about]": "Дощатая лавка на две клетки. Посиди рядом — силы возвращаются быстрее."
"[tools.items.stone_bench]": "Каменная лавка"
"[tools.items.stone_bench.about]": "Плита тёсаного камня на двух опорах. Холодная, зато вечная."
"[tools.items.stone_table]": "Каменный стол"
"[tools.items.stone_table.about]": "Стол из тёсаного камня на двух тумбах, на две клетки."
"[tools.items.stone_bed]": "Каменная кровать"
"[tools.items.stone_bed.about]": "Кровать на каменном основании с холщовым тюфяком. Спать на ней чуть холоднее, чем на деревянной."
"[tools.items.iron_bed]": "Железная кровать"
"[tools.items.iron_bed.about]": "Кованая кровать со спинками и холщовым тюфяком. Спится как на деревянной, и она не горит."
"[tools.items.iron_safe]": "Сейф"
"[tools.items.iron_safe.about]": "Клёпаный железный шкаф с тяжёлой дверцей. Хранит столько же, сколько шкаф."
"[tools.items.hide_rug]": "Шкура на пол"
"[tools.items.hide_rug.about]": "Целая шкура на полу, на две клетки."
"[tools.items.wall_hide]": "Шкура на стену"
"[tools.items.wall_hide.about]": "Шкура, растянутая на палках. Поставь у стены — она висит на ней."
"[tools.items.brine_tub]": "Кадка для солений"
"[tools.items.brine_tub.about]": "Низкая кадка с рассолом под камнем-гнётом. Еда в ней хранится в пять раз дольше."
"[tools.items.brick_stove]": "Печка-голландка"
"[tools.items.brick_stove.about]": "Высокая кирпичная печь с железной дверцей. Греет комнату как очаг, огонь спрятан внутри."
"[tools.items.door_wreath]": "Венок на дверь"
"[tools.items.door_wreath.about]": "Венок из веток с ягодами и бантом. Возьми в руку и нажми на дверь, чтобы повесить."

