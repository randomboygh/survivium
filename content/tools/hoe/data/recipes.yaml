# Recipes of the "Hoe" bundle: the stone one is tied by hand, the copper one is made at the workbench, the iron one - at
# the anvil. Flint and branch are "Resources", rope, planks and ingots are "Materials".
- id: stone_hoe
  title: "[tools.recipes.stone_hoe]"
  makes: stone_hoe
  needs: {resources:flint: 1, resources:branch: 1, materials:cord: 1}
  time: 4
- id: copper_hoe
  title: "[tools.recipes.copper_hoe]"
  makes: copper_hoe
  needs: {materials:copper_bar: 1, materials:planks: 1}
  at: workbench
  time: 5
- id: iron_hoe
  title: "[tools.recipes.iron_hoe]"
  makes: iron_hoe
  needs: {materials:iron_bar: 1, materials:planks: 1}
  at: anvil
  time: 5
