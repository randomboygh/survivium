# Рецепты бандла «Тяпка»: каменную вяжут руками, медную делают на верстаке, железную — на
# наковальне. Кремень и ветка — «Ресурсы», верёвка, доски и слитки — «Материалы».
- id: stone_hoe
  title: Каменная тяпка
  makes: stone_hoe
  needs: {resources:flint: 1, resources:branch: 1, materials:cord: 1}
  time: 4
- id: copper_hoe
  title: Медная тяпка
  makes: copper_hoe
  needs: {materials:copper_bar: 1, materials:planks: 1}
  at: workbench
  time: 5
- id: iron_hoe
  title: Железная тяпка
  makes: iron_hoe
  needs: {materials:iron_bar: 1, materials:planks: 1}
  at: anvil
  time: 5
