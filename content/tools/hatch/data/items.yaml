# Item of the "Hatch" bundle of the "Tools and crafting" mod: a plank cover one cell big, set into a floor or
# ceiling (`hatch` together with `door`). A closed hatch is solid like a floor, you walk on it; a touch flips
# the cover up on a hinge at the north edge, and you climb down the hole - by a ladder under it. In
# build mode a touch on a floor of built blocks removes the block and puts a hatch there (the block
# drops as if dug). Fields are as for the core items (content/core/data/items.yaml).
- id: hatch
  title: "[tools.items.hatch]"
  description: "[tools.items.hatch.about]"
  weight: 3.0
  stack: 4
  icon: hatch
  model: hatch
  prop: hatch
  door: true
  hatch: true
# A wide hatch of 2x2 cells: the plank cover flips up whole.
- id: hatch_2x2
  title: "[tools.items.hatch_2x2]"
  description: "[tools.items.hatch_2x2.about]"
  weight: 10.0
  stack: 2
  icon: hatch_2x2
  model: hatch_2x2
  prop: hatch_2x2
  door: true
  hatch: true
