# Recipes of the "Axe" bundle: at - the station where it is made (a reference to an item: the workbench bundle
# is needed by whoever has recipes made at it), tools - the tool classes in the bag; branch, log,
# flint, stone and clay are "Resources", rope, planks and brick are "Materials". All the recipe fields are in
# docs/DATA_MODEL.md.
- id: stone_axe
  title: "[tools.recipes.stone_axe]"
  makes: stone_axe
  needs: {resources:flint: 1, resources:branch: 2, materials:cord: 1}
  at: workbench
  time: 5
- id: planks
  title: "[tools.recipes.planks]"
  makes: materials:planks
  count: 2
  needs: {resources:log: 1}
  at: workbench
  tools: [axe]
  process: refine
  time: 3
- id: copper_axe
  title: "[tools.recipes.copper_axe]"
  makes: copper_axe
  needs: {materials:copper_bar: 2, materials:planks: 1}
  at: workbench
  time: 6
- id: bronze_axe
  title: "[tools.recipes.bronze_axe]"
  makes: bronze_axe
  needs: {materials:bronze_bar: 2, materials:planks: 1}
  at: workbench
  time: 6
- id: iron_axe
  title: "[tools.recipes.iron_axe]"
  makes: iron_axe
  needs: {materials:iron_bar: 2, materials:planks: 1}
  at: anvil
  time: 6
- id: steel_axe
  title: "[tools.recipes.steel_axe]"
  makes: steel_axe
  needs: {materials:steel_bar: 2, materials:planks: 1}
  at: anvil
  time: 6
