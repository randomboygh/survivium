# Items of the "Fence" bundle of the "Tools and crafting" mod (stage 1, item 5 of building): a fence of poles
# in the middle of the cell, a wicket and a gate in its line. A fence link (`fence`) joins itself with poles to
# neighboring links, wickets and gates on its level (Placed.joins); solid above a jump
# (Placed.FENCE_TOP), so neither a person nor an animal can jump over a fence, and tame rabbits
# stay in the pen. A fence is built in build mode as a line or a square, like a wall: the ghost
# of the blueprint, the action button places link after link from the bag. The wicket and gate are doors with `fence`:
# a leaf of poles in the middle of the cell, a touch opens it (the plot right "Open doors").
# Fields are as for the core items (content/core/data/items.yaml).
- id: fence
  title: "[tools.items.fence]"
  description: "[tools.items.fence.about]"
  era: core:primitive
  weight: 1.5
  stack: 20
  icon: fence
  model: fence
  prop: fence
  fence: true
- id: wicket
