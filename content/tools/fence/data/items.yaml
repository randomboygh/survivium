# Предметы бандла «Забор» мода «Инструменты и крафт» (этап 1, пункт 5 стройки): изгородь из жердей
# посередине клетки, калитка и ворота в её линии. Звено забора (`fence`) само соединяется жердями с
# соседними звеньями, калитками и воротами на своём уровне (Placed.joins); твёрдо выше прыжка
# (Placed.FENCE_TOP), так что через забор не перепрыгнуть ни человеку, ни зверю, и ручные кролики
# остаются в загоне. Забор строят в режиме строительства линией или квадратом, как стену: призрак
# чертежа, кнопка действия ставит звено за звеном из сумки. Калитка и ворота — двери с `fence`:
# створка из жердей посередине клетки, касание открывает (право участка «Открывать двери»).
# Поля — как у предметов основы (content/core/data/items.yaml).
