# Recipes of the "Hide clothes" bundle: hides, leather ("Animals", the "Game animals" bundle; "Materials", the
# "Leather" bundle) and rope are sewn with a needle (class needle, the "Needle" bundle) at the workbench.
- id: fur_hat
  title: "[tools.recipes.fur_hat]"
  makes: fur_hat
  needs: {animals:hide: 1, materials:cord: 1}
  at: tools:workbench
  tools: [needle]
  wear: 1
  time: 6
- id: fur_coat
  title: "[tools.recipes.fur_coat]"
  makes: fur_coat
  needs: {animals:hide: 3, materials:leather: 1, materials:cord: 2}
  at: tools:workbench
  tools: [needle]
  wear: 3
  time: 16
- id: leather_trousers
  title: "[tools.recipes.leather_trousers]"
  makes: leather_trousers
  needs: {materials:leather: 2, materials:cord: 1}
  at: tools:workbench
  tools: [needle]
  wear: 2
  time: 10
- id: fur_boots
  title: "[tools.recipes.fur_boots]"
  makes: fur_boots
  needs: {animals:hide: 1, materials:leather: 1, materials:cord: 1}
  at: tools:workbench
  tools: [needle]
  wear: 2
  time: 8
