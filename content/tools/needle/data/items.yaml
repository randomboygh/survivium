# Items of the "Needle" bundle of the "Tools and crafting" mod: class needle. The needle does nothing in the world, but in the
# bag it sews leather (recipes ask for `tools: [needle]` and wear it down by `wear`). Fields are as for knives
# (content/tools/knife/data/items.yaml).
- id: bone_needle
  title: "[tools.items.bone_needle]"
  description: "[tools.items.bone_needle.about]"
  weight: 0.02
  stack: 1
  model: bone_needle
  icon: bone_needle
  tool: needle
  durability: 120
# Metal needles: the same work as the bone one, only they last longer and are mended with
