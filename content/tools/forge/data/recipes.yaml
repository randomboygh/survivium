# Рецепты бандла «Горн»: сам горн на верстаке из кирпича «Материалов», камня и глины «Ресурсов»;
# медный слиток в горне из руды «Материалов» и угля (бандл «Уголь»): так руда → слиток →
# медные инструменты (их рецепты у каждого инструмента).
- id: forge
