# Recipes of the "Forge" bundle: the forge itself at the workbench from "Materials" brick, "Resources" stone and clay;
# a copper ingot in the forge from "Materials" ore and coal (the "Coal" bundle): so ore -> ingot ->
# copper tools (their recipes are with each tool).
- id: forge
  title: "[tools.recipes.forge]"
  makes: forge
  needs: {materials:brick: 12, resources:stone: 8, resources:clay: 4}
  at: workbench
  time: 12
- id: copper_bar
  title: "[tools.recipes.copper_bar]"
  makes: materials:copper_bar
  needs: {materials:copper_ore: 2, materials:charcoal: 1}
  at: forge
  process: smelt
  time: 6
