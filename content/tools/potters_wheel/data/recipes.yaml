# Recipes of the "Potter's wheel" bundle: the wheel - at the workbench; on the wheel a raw pot from clay
# ("Resources"), fired in the kiln. Recipe fields are in docs/DATA_MODEL.md.
- id: potters_wheel
  title: "[tools.recipes.potters_wheel]"
  makes: potters_wheel
  needs: {materials:planks: 4, resources:stone: 4, resources:branch: 2}
  at: workbench
  time: 8
- id: raw_pot
  title: "[tools.recipes.raw_pot]"
  makes: raw_pot
  needs: {resources:clay: 3}
  at: potters_wheel
  time: 5
- id: pot
  title: "[tools.recipes.pot]"
  makes: pot
  needs: {raw_pot: 1}
  at: kiln
  process: smelt
  time: 6
