# Items of the "Signs" bundle of the "Tools and crafting" mod (decision 183): text is written on a sign
# (`sign_lines` lines of `sign_width` characters), it is seen large above it within 3 cells, a touch opens
# a window with the text. Whoever may build on that land can write and turn it. The sign and
# the signpost stand on the ground and are turned by a touch in the window; the board hangs on a wall (`wall`): with its back
# to a solid cell nearby. Fields are as for the core items (content/core/data/items.yaml).
- id: sign
  title: "[tools.items.sign]"
  description: "[tools.items.sign.about]"
  weight: 1.0
  stack: 10
  icon: sign
  model: sign
  prop: sign
  furniture: true
  sign_lines: 3
  sign_width: 20
- id: signpost
  title: "[tools.items.signpost]"
  description: "[tools.items.signpost.about]"
  weight: 1.5
  stack: 10
  icon: signpost
  model: signpost
  prop: signpost
  furniture: true
  sign_lines: 2
  sign_width: 16
- id: notice_board
  title: "[tools.items.notice_board]"
  description: "[tools.items.notice_board.about]"
  weight: 3.0
  stack: 5
  icon: notice_board
  model: notice_board
  prop: notice_board
  furniture: true
  wall: true
  sign_lines: 6
  sign_width: 24
