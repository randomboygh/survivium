# Recipes of the "Loom" bundle: the loom itself - at the workbench from planks, branches and rope; on it
# coarse cloth from rope ("Materials"). Recipe fields are in docs/DATA_MODEL.md.
- id: loom
  title: "[tools.recipes.loom]"
  makes: loom
  needs: {materials:planks: 6, resources:branch: 4, materials:cord: 4}
  at: workbench
  time: 10
- id: cloth_from_cord
  title: "[tools.recipes.cloth_from_cord]"
  makes: materials:cloth
  needs: {materials:cord: 4}
  at: loom
  process: refine
  time: 6
