# A bundle per thing: axe, pickaxe, shovel, sword, scythe, workbench, kiln, chest, each with
# its own records, pictures and models; the plank recipe is with the axe, the brick one - with the kiln. What a bundle
# needs is derived from the references in its recipes: the workbench (at) - the workbench bundle, branch, log, flint,
# stone and clay - "Resources", rope, planks and brick - "Materials".
