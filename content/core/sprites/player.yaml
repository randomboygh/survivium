# Лист кадров персонажа. Картинки лежат рядом в player/ и held/; заглушки нарисованы
# tools/make_sprites.gd, их можно просто перерисовать.
# frame — размер кадра в пикселях: ноги стоят на нижнем ряду, крайние пиксели кадра
# пустые (там рисуется обводка). directions — строки листа сверху вниз. layers — слои
# player/<имя>.png снизу вверх; то, что в руках, ложится поверх них, а за телом — под
# них. fists — кисти рук, которые работают, поверх того, что в них. hands —
# player/<имя>.png, где в каждом кадре один пиксель отмечает кисть руки: красный —
# правая, синий — левая, тёмный — рука за телом; нет пикселя — рука держит ту же вещь,
# что и другая. Лист нарисован для правой руки в работе, для левой берётся зеркало
# противоположной стороны.
# animations — столбцы листа и кадров в секунду. works — работы, которые предмет называет
# в своём `anim`: столбцы (замах, удар) и сколько рук они занимают; работа проигрывается
# за время одного взмаха.
# held — кадр листа вещи в руке (held/<sprite>.png): размер и точка хвата. Строки листа —
# стороны, как здесь (вещь в правой руке), столбцы — «несут», затем кадры её работы.
frame: [22, 24]
directions: [s, se, e, ne, n, sw, w, nw]
layers: [body, shirt, trousers, boots, hair]
fists: fists
hands: hands
outline: true
animations:
  idle:
    frames: [0]
    fps: 1.0
  walk:
    frames: [1, 2, 3, 4]
    fps: 10.0
  jump:
    frames: [1]
    fps: 1.0
  chop:
    frames: [5, 6, 6]
    fps: 1.0
  dig:
    frames: [7, 8, 8]
    fps: 1.0
  slash:
    frames: [9, 10, 10]
    fps: 1.0
  reach:
    frames: [11, 12, 12]
    fps: 1.0
  mow:
    frames: [13, 14, 14]
    fps: 1.0
  aim:
    frames: [15, 16, 16]
    fps: 1.0
works:
  chop:
    columns: [5, 6]
    hands: 1
  dig:
    columns: [7, 8]
    hands: 1
  slash:
    columns: [9, 10]
    hands: 1
  reach:
    columns: [11, 12]
    hands: 1
  mow:
    columns: [13, 14]
    hands: 2
  aim:
    columns: [15, 16]
    hands: 2
held:
  cell: [15, 15]
  grip: [7, 7]
