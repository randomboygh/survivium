# content/core/data/eras.yaml
"Выживание без инструментов": "Überleben ohne Werkzeug"
"Сбор руками, ветки, волокно, камни, ягоды и грибы; простые вещи из них руками.": "Sammeln von Hand: Äste, Fasern, Steine, Beeren und Pilze; einfache Dinge daraus von Hand."
"Примитивные инструменты": "Primitive Werkzeuge"
"Верёвка, костёр, верстак, каменные и деревянные инструменты, брёвна и доски, сундук.": "Schnur, Lagerfeuer, Werkbank, Werkzeuge aus Stein und Holz, Stämme und Bretter, Truhe."
"Дерево, кости и кожа": "Holz, Knochen und Leder"
"Разделка зверей, сушилка, кожа из шкуры с жиром, костяные игла и клей, свеча, луки и праща, ткань.": "Zerlegen, Trockengestell, Leder aus Fell und Fett, Knochennadel und -leim, Kerze, Bögen und Schleuder, Stoff."
"Керамика и ранняя металлургия": "Töpferei und frühe Metallurgie"
"Печь для обжига, кирпич, уголь, горн, медь и медные инструменты.": "Brennofen, Ziegel, Holzkohle, Esse, Kupfer und Kupferwerkzeuge."
"Бронза": "Bronze"
"Олово, тигель, бронзовый сплав и бронзовые инструменты, которые берут железную руду.": "Zinn, Tiegel, Bronzelegierung und Bronzewerkzeuge, die Eisenerz abbauen."
"Железо": "Eisen"
"Железная руда, сыродутная печь и крица, железные слитки, наковальня и железные инструменты.": "Eisenerz, Rennofen und Luppe, Eisenbarren, Amboss und Eisenwerkzeuge."
"Сталь": "Stahl"
"Сталь из железа с углём в тигле и стальные инструменты.": "Stahl aus Eisen und Holzkohle im Tiegel, und Stahlwerkzeuge."

