# src/client/ui/menu_loading.gd
"[fiber_comes_from_tall_grass]": "Fasern geben hohes Gras, Kräuter und Schilf; drei Fasern werden zu einer Schnur gedreht."
"[flint_turns_up_when_you]": "Feuerstein findet man beim Graben in Erde, Sand und Geröll."
"[a_campfire_is_made_of]": "Ein Lagerfeuer besteht aus fünf Ästen und fünf Fasern; darauf brät man Pilze, Fleisch und Fisch."
"[a_recipe_becomes_known_once]": "Ein Rezept wird bekannt, wenn alle seine Materialien in deiner Tasche waren."
"[a_workbench_of_eight_branches]": "Eine Werkbank aus acht Ästen und zwei Schnüren: an ihr macht man Steinwerkzeuge."
"[a_kiln_is_built_of]": "Ein Brennofen wird aus Stein und Lehm gebaut; darin brennt man Ziegel und backt Fladen."
"[ears_give_grain_and_grain]": "Ähren geben Korn, und Korn wird zu Mehl gemahlen."
"[bandages_are_made_of_moss]": "Verbände macht man aus Moos und Fasern."
"[the_map_remembers_everything_you]": "Die Karte merkt sich alles, was du gesehen hast, und du kannst Markierungen setzen."
"[the_level_buttons_by_the]": "Die Ebenen-Knöpfe an der Minikarte schneiden die Sicht: so siehst du, was in einer Höhle und unter den Kronen ist."
"[walking_against_the_wind_is]": "Gegen den Wind geht es sich schwerer, und im Sprung treibt er dich zur Seite."
"[a_torch_of_a_branch]": "Eine Fackel aus einem Ast und zwei Fasern erhellt das Dunkel, brennt aber mit der Zeit herunter."
"[planks_are_made_from_a]": "Bretter macht man an der Werkbank aus einem Stamm, wenn eine Axt in der Tasche ist."
"[copper_ore_is_mined_with]": "Kupfererz wird mit der Spitzhacke in Steinadern abgebaut, und Barren schmilzt man in der Esse aus Erz und Holzkohle."
"[charcoal_is_burned_from_logs]": "Holzkohle brennt man aus Stämmen im Brennofen."
"[a_chest_of_six_planks]": "Eine Truhe aus sechs Brettern hält, was nicht in die Tasche passt."
"[jumping_swimming_and_work_use]": "Springen, Schwimmen und Arbeit kosten Kraft, und in Ruhe kommt sie zurück."
"[a_hungry_body_cant_fully]": "Hungrig erholt man sich nicht ganz: iss Beeren, Pilze, Fleisch und Fladen."
"[with_a_heavy_bag_you]": "Mit schwerer Tasche gehst du langsamer: lass Überflüssiges in einer Truhe."
"[without_strength_you_start_to]": "Ohne Kraft beginnst du im Wasser zu sinken: schwimm nicht zu weit hinaus."
"[a_burning_campfire_scorches_and]": "Ein brennendes Lagerfeuer verbrennt und stößt zurück, wenn du zu nah kommst."
"[after_death_your_things_stay]": "Nach dem Tod bleiben deine Sachen in einem Sack, wo du gefallen bist; er ist auf der Karte markiert."
"[you_come_back_to_life]": "Du kehrst an deinem Lagerfeuer ins Leben zurück: stell es nahe deinem Zuhause auf."
"[acorns_cones_and_seeds_can]": "Eicheln, Zapfen und Samen kann man pflanzen, und daraus wachsen Bäume und Kräuter."
"[grass_is_cut_by_hand]": "Gras schneidet man von Hand, mit einem Schwert oder einer Sense, und Fasern fallen ab."
"[the_camera_can_be_turned]": "Die Kamera dreht man mit den Knöpfen an der Minikarte und neigt sie, um hinter Bäume zu sehen."
"[in_the_settings_the_time]": "In den Einstellungen können Tageszeit, Jahreszeit und Wetter dem echten Leben folgen."
"[a_fishing_rod_is_made]": "Eine Angel macht man aus zwei Ästen, zwei Schnüren und Feuerstein, und gefangene Fische brät man am Lagerfeuer."
"[a_small_animals_carcass_is]": "Einen kleinen Kadaver zerlegt man von Hand, einen großen nur mit dem Messer: er gibt Fell, Knochen und Fett."
"[leather_is_made_from_hide]": "Leder macht man aus Fell und Fett auf dem Trockengestell, dort dörrt man auch Fleisch."
"[bows_and_arrows_are_made]": "Bögen und Pfeile macht man an der Werkbank, die Pfeilspitze aus Feuerstein oder Knochen."
"[bronze_is_smelted_in_a]": "Bronze schmilzt man in der Esse aus Kupfer und Zinn, und ein Tiegel muss in der Tasche sein."
"[iron_ore_is_smelted_into]": "Eisenerz schmilzt man im Rennofen zu einer Luppe, und die Esse macht aus der Luppe Barren."
"[iron_and_steel_tools_are]": "Werkzeuge aus Eisen und Stahl schmiedet man auf dem Amboss."
"[thread_is_spun_from_flax]": "Aus Flachsstängeln spinnt man Faden, und am Webstuhl webt man daraus Stoff."
"[tar_is_drawn_from_logs]": "Teer gewinnt man aus Stämmen im Brennofen, und dafür braucht man einen Tontopf."
"[silver_gold_and_platinum_are]": "Silber, Gold und Platin schmilzt man in der Esse, und auf dem Amboss macht man aus Barren Blöcke."
"[cancel_loading_esc]": "Laden abbrechen (Esc)"
"[the_world_is_ready]": "Die Welt ist bereit"

