# content/core/data/skills.yaml
"[core.skills.gathering]": "Sammeln"
"[core.skills.gathering.about]": "Beeren, Kräuter, Fasern, Früchte und Mähen. Sammelt schneller, nimmt manchmal eins mehr."
"[core.skills.chopping]": "Fällen"
"[core.skills.chopping.about]": "Bäume und Büsche mit der Axt. Fällt schneller, ermüdet weniger, bekommt manchmal einen Stamm extra."
"[core.skills.digging]": "Graben"
"[core.skills.digging.about]": "Erde, Sand, Stein und Erz. Gräbt schneller. Selbst Gesetztes auszugraben gibt keine Erfahrung."
"[core.skills.crafting]": "Handwerk"
"[core.skills.crafting.about]": "Dinge von Hand, an Werkbank, Ofen und Esse. Fertigt schneller; Werkzeuge und Kleidung werden haltbarer."
"[core.skills.building]": "Bauen"
"[core.skills.building.about]": "Wände, Böden, Baupläne und Möbel. Baut schneller."
"[core.skills.cooking]": "Kochen"
"[core.skills.cooking.about]": "Braten, Eintopf, Brot und alles, was am Feuer gekocht wird. Kocht schneller, manchmal eine größere Portion."
"[core.skills.hunting]": "Jagd"
"[core.skills.hunting.about]": "Tiere mit Waffen und bloßen Händen. Schlägt schneller und härter; beim Zerlegen manchmal mehr Fleisch."
"[core.skills.fishing]": "Angeln"
"[core.skills.fishing.about]": "Fische mit der Angel. Zieht manchmal zwei heraus."
"[core.skills.swimming]": "Schwimmen"
"[core.skills.swimming.about]": "Wächst beim Schwimmen. Schwimmt schneller (später auch auf Flößen und Booten)."
"[core.skills.farming]": "Anbau"
"[core.skills.farming.about]": "Beete mit der Hacke, Säen, Gießen und Ernten. Arbeitet schneller an Beeten, erntet manchmal eins mehr."

