# content/core/data/skills.yaml
"Сбор": "Sammeln"
"Ягоды, травы, волокно, плоды и покос. Быстрее собирает, иногда берёт на одну больше.": "Beeren, Kräuter, Fasern, Früchte und Mähen. Sammelt schneller, nimmt manchmal eins mehr."
"Рубка": "Fällen"
"Деревья и кусты топором. Быстрее рубит, тратит меньше сил, иногда снимает лишнее бревно.": "Bäume und Büsche mit der Axt. Fällt schneller, ermüdet weniger, bekommt manchmal einen Stamm extra."
"Копание": "Graben"
"Земля, песок, камень и руда. Быстрее копает. Выкопать поставленное своими руками опыта не даёт.": "Erde, Sand, Stein und Erz. Gräbt schneller. Selbst Gesetztes auszugraben gibt keine Erfahrung."
"Ремесло": "Handwerk"
"Вещи на руках, у верстака, печи и горна. Быстрее делает, инструменты и одежда выходят прочнее.": "Dinge von Hand, an Werkbank, Ofen und Esse. Fertigt schneller; Werkzeuge und Kleidung werden haltbarer."
"Стены, пол, чертёж и мебель. Быстрее строит.": "Wände, Böden, Baupläne und Möbel. Baut schneller."
"Готовка": "Kochen"
"Жарка, похлёбка, хлеб и всё, что готовят на огне. Быстрее готовит, иногда выходит порция больше.": "Braten, Eintopf, Brot und alles, was am Feuer gekocht wird. Kocht schneller, manchmal eine größere Portion."
"Охота": "Jagd"
"Звери оружием и руками. Быстрее и сильнее бьёт, при разделке туши иногда выходит больше мяса.": "Tiere mit Waffen und bloßen Händen. Schlägt schneller und härter; beim Zerlegen manchmal mehr Fleisch."
"Рыбалка": "Angeln"
"Рыба на удочку. Иногда вытаскивает две.": "Fische mit der Angel. Zieht manchmal zwei heraus."
"Плавание": "Schwimmen"
"Растёт, пока плывёшь. Быстрее плывёт (потом и на плотах, лодках).": "Wächst beim Schwimmen. Schwimmt schneller (später auch auf Flößen und Booten)."
"Земледелие": "Anbau"
"Грядки тяпкой, посев, полив и урожай. Быстрее работает на грядках, иногда собирает на одну больше.": "Beete mit der Hacke, Säen, Gießen und Ernten. Arbeitet schneller an Beeten, erntet manchmal eins mehr."

