"Прозрачным становится только то, что перед игроком и не ниже линии: 0 — по ногам, +1 — по пояс, +2 — по голову. Срезы впереди — вертикальные слои по клетке, уровни сверху считаются от линии, берётся более прозрачное. Первые слои рисуются с плотностью первых, следующие за ними тают за «растяжение» слоёв.": "Durchsichtig wird nur, was vor dem Spieler und nicht unter der Linie ist: 0 — an den Füßen, +1 — an der Hüfte, +2 — am Kopf. Schnitte vorne sind senkrechte Schichten je ein Feld, Ebenen oben zählen ab der Linie, das Durchsichtigere gewinnt. Die ersten Schichten werden mit der Dichte der ersten gezeichnet, die danach blenden über die „Dehnung“ aus."
