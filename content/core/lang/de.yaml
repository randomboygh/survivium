# src/client/ui/menu_loading.gd
"Волокно дают высокая трава, травы и тростник; из трёх волокон скручивают верёвку.": "Fasern geben hohes Gras, Kräuter und Schilf; drei Fasern werden zu einer Schnur gedreht."
"Кремень попадается, когда копаешь землю, песок и осыпь.": "Feuerstein findet man beim Graben in Erde, Sand und Geröll."
"Костёр складывают из пяти веток и пяти волокон, на нём жарят грибы, мясо и рыбу.": "Ein Lagerfeuer besteht aus fünf Ästen und fünf Fasern; darauf brät man Pilze, Fleisch und Fisch."
"Рецепт становится известен, когда в сумке побывали все его материалы.": "Ein Rezept wird bekannt, wenn alle seine Materialien in deiner Tasche waren."
"Верстак из восьми веток и двух верёвок: у него делают каменные инструменты.": "Eine Werkbank aus acht Ästen und zwei Schnüren: an ihr macht man Steinwerkzeuge."
"Печь для обжига складывают из камня и глины, в ней обжигают кирпичи и пекут лепёшки.": "Ein Brennofen wird aus Stein und Lehm gebaut; darin brennt man Ziegel und backt Fladen."
"Колоски дают зерно, а из зерна мелют муку.": "Ähren geben Korn, und Korn wird zu Mehl gemahlen."
"Из мха и волокна делают бинты.": "Verbände macht man aus Moos und Fasern."
"Карта помнит всё, что вы видели, и на ней можно ставить метки.": "Die Karte merkt sich alles, was du gesehen hast, und du kannst Markierungen setzen."
"Кнопки уровня у миникарты срезают вид: так видно, что в пещере и под кронами.": "Die Ebenen-Knöpfe an der Minikarte schneiden die Sicht: so siehst du, was in einer Höhle und unter den Kronen ist."
"Против ветра идти тяжелее, а в прыжке он сносит в сторону.": "Gegen den Wind geht es sich schwerer, und im Sprung treibt er dich zur Seite."
"Факел из ветки и двух волокон светит в темноте, но со временем догорает.": "Eine Fackel aus einem Ast und zwei Fasern erhellt das Dunkel, brennt aber mit der Zeit herunter."
"Доски делают у верстака из бревна, если в сумке есть топор.": "Bretter macht man an der Werkbank aus einem Stamm, wenn eine Axt in der Tasche ist."
"Медную руду бьют киркой в жилах камня, а слитки плавят в горне из руды и угля.": "Kupfererz wird mit der Spitzhacke in Steinadern abgebaut, und Barren schmilzt man in der Esse aus Erz und Holzkohle."
"Уголь выжигают из брёвен в печи для обжига.": "Holzkohle brennt man aus Stämmen im Brennofen."
"Сундук из шести досок хранит вещи, которые не помещаются в сумку.": "Eine Truhe aus sechs Brettern hält, was nicht in die Tasche passt."
"Прыжки, плавание и работа тратят силы, а в покое они возвращаются.": "Springen, Schwimmen und Arbeit kosten Kraft, und in Ruhe kommt sie zurück."
"Голодному не восстановить силы полностью: ешьте ягоды, грибы, мясо и лепёшки.": "Hungrig erholt man sich nicht ganz: iss Beeren, Pilze, Fleisch und Fladen."
"С тяжёлой сумкой идёшь медленнее: лишнее можно оставить в сундуке.": "Mit schwerer Tasche gehst du langsamer: lass Überflüssiges in einer Truhe."
"Без сил в воде начинаешь тонуть: далеко не заплывайте.": "Ohne Kraft beginnst du im Wasser zu sinken: schwimm nicht zu weit hinaus."
"Горящий костёр обжигает и отбрасывает, если подойти вплотную.": "Ein brennendes Lagerfeuer verbrennt und stößt zurück, wenn du zu nah kommst."
"После смерти вещи остаются в мешке на месте гибели, он отмечен на карте.": "Nach dem Tod bleiben deine Sachen in einem Sack, wo du gefallen bist; er ist auf der Karte markiert."
"Возвращаешься к жизни у своего костра: поставьте его рядом с домом.": "Du kehrst an deinem Lagerfeuer ins Leben zurück: stell es nahe deinem Zuhause auf."
"Жёлуди, шишки и семена можно посадить, и из них вырастут деревья и травы.": "Eicheln, Zapfen und Samen kann man pflanzen, und daraus wachsen Bäume und Kräuter."
"Траву срезают руками, мечом или косой, и с неё падает волокно.": "Gras schneidet man von Hand, mit einem Schwert oder einer Sense, und Fasern fallen ab."
"Камеру можно повернуть кнопками у миникарты и наклонить, чтобы заглянуть за деревья.": "Die Kamera dreht man mit den Knöpfen an der Minikarte und neigt sie, um hinter Bäume zu sehen."
"В настройках время суток, сезон и погоду можно сделать как в жизни.": "In den Einstellungen können Tageszeit, Jahreszeit und Wetter dem echten Leben folgen."
"Удочку делают из двух веток, двух верёвок и кремня, а пойманную рыбу жарят на костре.": "Eine Angel macht man aus zwei Ästen, zwei Schnüren und Feuerstein, und gefangene Fische brät man am Lagerfeuer."
"Тушку зверька разделывают руками, а большую тушу — только ножом: с неё падают шкура, кости и жир.": "Einen kleinen Kadaver zerlegt man von Hand, einen großen nur mit dem Messer: er gibt Fell, Knochen und Fett."
"На сушилке из шкуры и жира выделывают кожу, там же вялят мясо.": "Leder macht man aus Fell und Fett auf dem Trockengestell, dort dörrt man auch Fleisch."
"Лук и стрелы делают у верстака, а наконечник стрелы — из кремня или кости.": "Bögen und Pfeile macht man an der Werkbank, die Pfeilspitze aus Feuerstein oder Knochen."
"Бронзу плавят в горне из меди и олова, и в сумке должен быть тигель.": "Bronze schmilzt man in der Esse aus Kupfer und Zinn, und ein Tiegel muss in der Tasche sein."
"Железную руду плавят в крицу в сыродутной печи, а из крицы в горне получаются слитки.": "Eisenerz schmilzt man im Rennofen zu einer Luppe, und die Esse macht aus der Luppe Barren."
"Железные и стальные инструменты куют на наковальне.": "Werkzeuge aus Eisen und Stahl schmiedet man auf dem Amboss."
"Из стеблей льна прядут нить, а на ткацком станке ткут из неё ткань.": "Aus Flachsstängeln spinnt man Faden, und am Webstuhl webt man daraus Stoff."
"Смолу выгоняют из брёвен в печи для обжига, и для этого нужен глиняный горшок.": "Teer gewinnt man aus Stämmen im Brennofen, und dafür braucht man einen Tontopf."
"Серебро, золото и платину плавят в горне, а на наковальне из слитков собирают блоки.": "Silber, Gold und Platin schmilzt man in der Esse, und auf dem Amboss macht man aus Barren Blöcke."
