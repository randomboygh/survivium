# content/core/data/skills.yaml
"Сбор": "Cueillette"
"Ягоды, травы, волокно, плоды и покос. Быстрее собирает, иногда берёт на одну больше.": "Baies, herbes, fibre, fruits et fauchage. Cueille plus vite, prend parfois un de plus."
"Рубка": "Coupe"
"Деревья и кусты топором. Быстрее рубит, тратит меньше сил, иногда снимает лишнее бревно.": "Arbres et buissons à la hache. Coupe plus vite, se fatigue moins, obtient parfois un rondin de plus."
"Копание": "Fouille"
"Земля, песок, камень и руда. Быстрее копает. Выкопать поставленное своими руками опыта не даёт.": "Terre, sable, pierre et minerai. Creuse plus vite. Déterrer ce que vous avez posé ne donne pas d'expérience."
"Ремесло": "Artisan"
"Вещи на руках, у верстака, печи и горна. Быстрее делает, инструменты и одежда выходят прочнее.": "Objets à la main, à l'établi, au four et à la forge. Fabrique plus vite ; outils et vêtements plus solides."
"Стены, пол, чертёж и мебель. Быстрее строит.": "Murs, sols, plans et meubles. Construit plus vite."
"Готовка": "Cuisine"
"Жарка, похлёбка, хлеб и всё, что готовят на огне. Быстрее готовит, иногда выходит порция больше.": "Grillades, ragoût, pain et tout ce qui cuit au feu. Cuisine plus vite, parfois une portion plus grande."
"Охота": "Chasse"
"Звери оружием и руками. Быстрее и сильнее бьёт, при разделке туши иногда выходит больше мяса.": "Animaux avec des armes ou à mains nues. Frappe plus vite et plus fort ; le dépeçage donne parfois plus de viande."
"Рыбалка": "Pêche"
"Рыба на удочку. Иногда вытаскивает две.": "Poissons à la canne. En sort parfois deux."
"Плавание": "Nage"
"Растёт, пока плывёшь. Быстрее плывёт (потом и на плотах, лодках).": "Monte pendant que vous nagez. Nage plus vite (plus tard en radeau et en barque aussi)."
"Земледелие": "Culture"
"Грядки тяпкой, посев, полив и урожай. Быстрее работает на грядках, иногда собирает на одну больше.": "Plates-bandes à la houe, semis, arrosage et récolte. Travaille les plates-bandes plus vite, récolte parfois un de plus."

