# content/core/data/eras.yaml
"Выживание без инструментов": "Survie sans outils"
"Сбор руками, ветки, волокно, камни, ягоды и грибы; простые вещи из них руками.": "Cueillette à la main : branches, fibre, pierres, baies et champignons ; des choses simples faites avec, à la main."
"Примитивные инструменты": "Outils primitifs"
"Верёвка, костёр, верстак, каменные и деревянные инструменты, брёвна и доски, сундук.": "Corde, feu de camp, établi, outils de pierre et de bois, rondins et planches, coffre."
"Дерево, кости и кожа": "Bois, os et cuir"
"Разделка зверей, сушилка, кожа из шкуры с жиром, костяные игла и клей, свеча, луки и праща, ткань.": "Dépeçage, séchoir, cuir de peau et de graisse, aiguille et colle d'os, bougie, arcs et fronde, drap."
"Керамика и ранняя металлургия": "Poterie et premiers métaux"
"Печь для обжига, кирпич, уголь, горн, медь и медные инструменты.": "Four, brique, charbon de bois, forge, cuivre et outils de cuivre."
"Бронза": "Bronze"
"Олово, тигель, бронзовый сплав и бронзовые инструменты, которые берут железную руду.": "Étain, creuset, alliage de bronze et outils de bronze qui extraient le minerai de fer."
"Железо": "Fer"
"Железная руда, сыродутная печь и крица, железные слитки, наковальня и железные инструменты.": "Minerai de fer, bas fourneau et loupe, lingots de fer, enclume et outils de fer."
"Сталь": "Acier"
"Сталь из железа с углём в тигле и стальные инструменты.": "Acier de fer et de charbon dans un creuset, et outils d'acier."

