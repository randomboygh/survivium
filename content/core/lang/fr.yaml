"Прозрачным становится только то, что перед игроком и не ниже линии: 0 — по ногам, +1 — по пояс, +2 — по голову. Срезы впереди — вертикальные слои по клетке, уровни сверху считаются от линии, берётся более прозрачное. Первые слои рисуются с плотностью первых, следующие за ними тают за «растяжение» слоёв.": "Seul devient transparent ce qui est devant le joueur et pas sous la ligne : 0 — aux pieds, +1 — à la taille, +2 — à la tête. Les coupes devant sont des couches verticales d'une case, les niveaux au-dessus se comptent depuis la ligne, le plus transparent l'emporte. Les premières couches sont dessinées à la densité des premières, les suivantes s'effacent sur l'« étirement »."
