# src/client/ui/menu_loading.gd
"Волокно дают высокая трава, травы и тростник; из трёх волокон скручивают верёвку.": "La fibre vient des hautes herbes, des plantes et des roseaux ; trois fibres se tordent en une corde."
"Кремень попадается, когда копаешь землю, песок и осыпь.": "Le silex se trouve en creusant la terre, le sable et l'éboulis."
"Костёр складывают из пяти веток и пяти волокон, на нём жарят грибы, мясо и рыбу.": "Un feu de camp se fait de cinq branches et cinq fibres ; on y grille champignons, viande et poisson."
"Рецепт становится известен, когда в сумке побывали все его материалы.": "Une recette devient connue quand tous ses matériaux sont passés par votre sac."
"Верстак из восьми веток и двух верёвок: у него делают каменные инструменты.": "Un établi de huit branches et deux cordes : on y fait des outils de pierre."
"Печь для обжига складывают из камня и глины, в ней обжигают кирпичи и пекут лепёшки.": "Un four se bâtit en pierre et en argile ; on y cuit briques et galettes."
"Колоски дают зерно, а из зерна мелют муку.": "Les épis donnent du grain, et le grain se moud en farine."
"Из мха и волокна делают бинты.": "Les bandages se font de mousse et de fibre."
"Карта помнит всё, что вы видели, и на ней можно ставить метки.": "La carte se souvient de tout ce que vous avez vu, et on peut y poser des repères."
"Кнопки уровня у миникарты срезают вид: так видно, что в пещере и под кронами.": "Les boutons de niveau près de la mini-carte coupent la vue : on voit ce qu'il y a dans une grotte et sous les cimes."
"Против ветра идти тяжелее, а в прыжке он сносит в сторону.": "Marcher contre le vent est plus dur, et en saut il vous pousse de côté."
"Факел из ветки и двух волокон светит в темноте, но со временем догорает.": "Une torche d'une branche et deux fibres éclaire le noir, mais elle se consume avec le temps."
"Доски делают у верстака из бревна, если в сумке есть топор.": "Les planches se font d'un rondin à l'établi s'il y a une hache dans le sac."
"Медную руду бьют киркой в жилах камня, а слитки плавят в горне из руды и угля.": "Le minerai de cuivre se pioche dans les veines de pierre, et les lingots se fondent à la forge avec minerai et charbon."
"Уголь выжигают из брёвен в печи для обжига.": "Le charbon de bois se fait en brûlant des rondins au four."
"Сундук из шести досок хранит вещи, которые не помещаются в сумку.": "Un coffre de six planches garde ce qui ne tient pas dans le sac."
"Прыжки, плавание и работа тратят силы, а в покое они возвращаются.": "Sauter, nager et travailler usent les forces, et elles reviennent au repos."
"Голодному не восстановить силы полностью: ешьте ягоды, грибы, мясо и лепёшки.": "Le ventre vide, on ne récupère pas tout : mangez baies, champignons, viande et galettes."
"С тяжёлой сумкой идёшь медленнее: лишнее можно оставить в сундуке.": "Avec un sac lourd on marche plus lentement : laissez le surplus dans un coffre."
"Без сил в воде начинаешь тонуть: далеко не заплывайте.": "Sans forces on commence à couler : ne nagez pas trop loin."
"Горящий костёр обжигает и отбрасывает, если подойти вплотную.": "Un feu de camp allumé brûle et repousse si on s'en approche trop."
"После смерти вещи остаются в мешке на месте гибели, он отмечен на карте.": "Après la mort vos affaires restent dans un sac là où vous êtes tombé ; il est marqué sur la carte."
"Возвращаешься к жизни у своего костра: поставьте его рядом с домом.": "Vous revenez à la vie près de votre feu de camp : installez-le près de chez vous."
"Жёлуди, шишки и семена можно посадить, и из них вырастут деревья и травы.": "Glands, cônes et graines se plantent, et il en pousse des arbres et des plantes."
"Траву срезают руками, мечом или косой, и с неё падает волокно.": "L'herbe se coupe à la main, à l'épée ou à la faux, et il en tombe de la fibre."
"Камеру можно повернуть кнопками у миникарты и наклонить, чтобы заглянуть за деревья.": "La caméra se tourne avec les boutons près de la mini-carte et s'incline pour voir derrière les arbres."
"В настройках время суток, сезон и погоду можно сделать как в жизни.": "Dans les réglages, l'heure, la saison et la météo peuvent suivre la vraie vie."
"Удочку делают из двух веток, двух верёвок и кремня, а пойманную рыбу жарят на костре.": "Une canne à pêche se fait de deux branches, deux cordes et un silex, et les poissons pris se grillent au feu de camp."
"Тушку зверька разделывают руками, а большую тушу — только ножом: с неё падают шкура, кости и жир.": "Une petite carcasse se dépèce à la main, une grande seulement au couteau : elle donne peau, os et graisse."
"На сушилке из шкуры и жира выделывают кожу, там же вялят мясо.": "Le cuir se fait de peau et de graisse sur le séchoir, et on y sèche aussi la viande."
"Лук и стрелы делают у верстака, а наконечник стрелы — из кремня или кости.": "Arcs et flèches se font à l'établi, et la pointe de flèche en silex ou en os."
"Бронзу плавят в горне из меди и олова, и в сумке должен быть тигель.": "Le bronze se fond à la forge avec du cuivre et de l'étain, et il faut un creuset dans le sac."
"Железную руду плавят в крицу в сыродутной печи, а из крицы в горне получаются слитки.": "Le minerai de fer se fond en loupe dans un bas fourneau, et la forge change la loupe en lingots."
"Железные и стальные инструменты куют на наковальне.": "Les outils de fer et d'acier se forgent sur l'enclume."
"Из стеблей льна прядут нить, а на ткацком станке ткут из неё ткань.": "Les tiges de lin se filent en fil, et sur le métier on en tisse du drap."
"Смолу выгоняют из брёвен в печи для обжига, и для этого нужен глиняный горшок.": "Le goudron se tire des rondins au four, et il faut pour cela un pot en terre."
"Серебро, золото и платину плавят в горне, а на наковальне из слитков собирают блоки.": "Argent, or et platine se fondent à la forge, et sur l'enclume on fait des blocs avec les lingots."
"Отменить загрузку (Esc)": "Annuler le chargement (Échap)"
"Мир готов": "Le monde est prêt"

