"[fiber_comes_from_tall_grass]": "La fibre vient des hautes herbes, des plantes et des roseaux ; trois fibres se tordent en une corde."
"[flint_turns_up_when_you]": "Le silex se trouve en creusant la terre, le sable et l'éboulis."
"[a_campfire_is_made_of]": "Un feu de camp se fait de cinq branches et cinq fibres ; on y grille champignons, viande et poisson."
"[a_recipe_becomes_known_once]": "Une recette devient connue quand tous ses matériaux sont passés par votre sac."
"[a_workbench_of_eight_branches]": "Un établi de huit branches et deux cordes : on y fait des outils de pierre."
"[a_kiln_is_built_of]": "Un four se bâtit en pierre et en argile ; on y cuit briques et galettes."
"[ears_give_grain_and_grain]": "Les épis donnent du grain, et le grain se moud en farine."
"[bandages_are_made_of_moss]": "Les bandages se font de mousse et de fibre."
"[the_map_remembers_everything_you]": "La carte se souvient de tout ce que vous avez vu, et on peut y poser des repères."
"[the_level_buttons_by_the]": "Les boutons de niveau près de la mini-carte coupent la vue : on voit ce qu'il y a dans une grotte et sous les cimes."
"[walking_against_the_wind_is]": "Marcher contre le vent est plus dur, et en saut il vous pousse de côté."
"[a_torch_of_a_branch]": "Une torche d'une branche et deux fibres éclaire le noir, mais elle se consume avec le temps."
"[planks_are_made_from_a]": "Les planches se font d'un rondin à l'établi s'il y a une hache dans le sac."
"[copper_ore_is_mined_with]": "Le minerai de cuivre se pioche dans les veines de pierre, et les lingots se fondent à la forge avec minerai et charbon."
"[charcoal_is_burned_from_logs]": "Le charbon de bois se fait en brûlant des rondins au four."
"[a_chest_of_six_planks]": "Un coffre de six planches garde ce qui ne tient pas dans le sac."
"[jumping_swimming_and_work_use]": "Sauter, nager et travailler usent les forces, et elles reviennent au repos."
"[a_hungry_body_cant_fully]": "Le ventre vide, on ne récupère pas tout : mangez baies, champignons, viande et galettes."
"[with_a_heavy_bag_you]": "Avec un sac lourd on marche plus lentement : laissez le surplus dans un coffre."
"[without_strength_you_start_to]": "Sans forces on commence à couler : ne nagez pas trop loin."
"[a_burning_campfire_scorches_and]": "Un feu de camp allumé brûle et repousse si on s'en approche trop."
"[after_death_your_things_stay]": "Après la mort vos affaires restent dans un sac là où vous êtes tombé ; il est marqué sur la carte."
"[you_come_back_to_life]": "Vous revenez à la vie près de votre feu de camp : installez-le près de chez vous."
"[acorns_cones_and_seeds_can]": "Glands, cônes et graines se plantent, et il en pousse des arbres et des plantes."
"[grass_is_cut_by_hand]": "L'herbe se coupe à la main, à l'épée ou à la faux, et il en tombe de la fibre."
"[the_camera_can_be_turned]": "La caméra se tourne avec les boutons près de la mini-carte et s'incline pour voir derrière les arbres."
"[in_the_settings_the_time]": "Dans les réglages, l'heure, la saison et la météo peuvent suivre la vraie vie."
"[a_fishing_rod_is_made]": "Une canne à pêche se fait de deux branches, deux cordes et un silex, et les poissons pris se grillent au feu de camp."
"[a_small_animals_carcass_is]": "Une petite carcasse se dépèce à la main, une grande seulement au couteau : elle donne peau, os et graisse."
"[leather_is_made_from_hide]": "Le cuir se fait de peau et de graisse sur le séchoir, et on y sèche aussi la viande."
"[bows_and_arrows_are_made]": "Arcs et flèches se font à l'établi, et la pointe de flèche en silex ou en os."
"[bronze_is_smelted_in_a]": "Le bronze se fond à la forge avec du cuivre et de l'étain, et il faut un creuset dans le sac."
"[iron_ore_is_smelted_into]": "Le minerai de fer se fond en loupe dans un bas fourneau, et la forge change la loupe en lingots."
"[iron_and_steel_tools_are]": "Les outils de fer et d'acier se forgent sur l'enclume."
"[thread_is_spun_from_flax]": "Les tiges de lin se filent en fil, et sur le métier on en tisse du drap."
"[tar_is_drawn_from_logs]": "Le goudron se tire des rondins au four, et il faut pour cela un pot en terre."
"[silver_gold_and_platinum_are]": "Argent, or et platine se fondent à la forge, et sur l'enclume on fait des blocs avec les lingots."
