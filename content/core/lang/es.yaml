# content/core/data/eras.yaml
"Выживание без инструментов": "Supervivencia sin herramientas"
"Сбор руками, ветки, волокно, камни, ягоды и грибы; простые вещи из них руками.": "Recolección a mano: ramas, fibra, piedras, bayas y setas; cosas sencillas hechas con ellas a mano."
"Примитивные инструменты": "Herramientas primitivas"
"Верёвка, костёр, верстак, каменные и деревянные инструменты, брёвна и доски, сундук.": "Cuerda, hoguera, banco de trabajo, herramientas de piedra y madera, troncos y tablas, cofre."
"Дерево, кости и кожа": "Madera, hueso y cuero"
"Разделка зверей, сушилка, кожа из шкуры с жиром, костяные игла и клей, свеча, луки и праща, ткань.": "Despiece, secadero, cuero de piel y grasa, aguja y cola de hueso, vela, arcos y honda, tela."
"Керамика и ранняя металлургия": "Alfarería y primera metalurgia"
"Печь для обжига, кирпич, уголь, горн, медь и медные инструменты.": "Horno de cocción, ladrillo, carbón, fragua, cobre y herramientas de cobre."
"Бронза": "Bronce"
"Олово, тигель, бронзовый сплав и бронзовые инструменты, которые берут железную руду.": "Estaño, crisol, aleación de bronce y herramientas de bronce que pueden extraer mineral de hierro."
"Железо": "Hierro"
"Железная руда, сыродутная печь и крица, железные слитки, наковальня и железные инструменты.": "Mineral de hierro, horno de lupa y lupa, lingotes de hierro, yunque y herramientas de hierro."
"Сталь": "Acero"
"Сталь из железа с углём в тигле и стальные инструменты.": "Acero de hierro y carbón en un crisol, y herramientas de acero."

