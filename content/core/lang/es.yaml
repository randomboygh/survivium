# src/client/ui/menu_loading.gd
"Волокно дают высокая трава, травы и тростник; из трёх волокон скручивают верёвку.": "La fibra sale de la hierba alta, las hierbas y los juncos; tres fibras se tuercen en una cuerda."
"Кремень попадается, когда копаешь землю, песок и осыпь.": "El sílex aparece al cavar tierra, arena y pedregal."
"Костёр складывают из пяти веток и пяти волокон, на нём жарят грибы, мясо и рыбу.": "Una hoguera se hace con cinco ramas y cinco fibras; en ella se asan setas, carne y pescado."
"Рецепт становится известен, когда в сумке побывали все его материалы.": "Una receta se conoce cuando todos sus materiales han estado en tu bolsa."
"Верстак из восьми веток и двух верёвок: у него делают каменные инструменты.": "Un banco de trabajo de ocho ramas y dos cuerdas: en él se hacen herramientas de piedra."
"Печь для обжига складывают из камня и глины, в ней обжигают кирпичи и пекут лепёшки.": "El horno se hace de piedra y arcilla; en él se cuecen ladrillos y tortas."
"Колоски дают зерно, а из зерна мелют муку.": "Las espigas dan grano, y el grano se muele en harina."
"Из мха и волокна делают бинты.": "Las vendas se hacen de musgo y fibra."
"Карта помнит всё, что вы видели, и на ней можно ставить метки.": "El mapa recuerda todo lo que has visto, y puedes poner marcas en él."
"Кнопки уровня у миникарты срезают вид: так видно, что в пещере и под кронами.": "Los botones de nivel junto al minimapa cortan la vista: así ves lo que hay en una cueva y bajo las copas."
"Против ветра идти тяжелее, а в прыжке он сносит в сторону.": "Andar contra el viento cuesta más, y en un salto te empuja a un lado."
"Факел из ветки и двух волокон светит в темноте, но со временем догорает.": "Una antorcha de una rama y dos fibras alumbra la oscuridad, pero se consume con el tiempo."
"Доски делают у верстака из бревна, если в сумке есть топор.": "Las tablas se hacen de un tronco en el banco si hay un hacha en la bolsa."
"Медную руду бьют киркой в жилах камня, а слитки плавят в горне из руды и угля.": "El mineral de cobre se pica en vetas de piedra, y los lingotes se funden en la fragua con mineral y carbón."
"Уголь выжигают из брёвен в печи для обжига.": "El carbón se hace quemando troncos en el horno."
"Сундук из шести досок хранит вещи, которые не помещаются в сумку.": "Un cofre de seis tablas guarda lo que no cabe en la bolsa."
"Прыжки, плавание и работа тратят силы, а в покое они возвращаются.": "Saltar, nadar y trabajar gastan fuerzas, y vuelven al descansar."
"Голодному не восстановить силы полностью: ешьте ягоды, грибы, мясо и лепёшки.": "Con hambre no te recuperas del todo: come bayas, setas, carne y tortas."
"С тяжёлой сумкой идёшь медленнее: лишнее можно оставить в сундуке.": "Con la bolsa pesada andas más lento: deja lo que sobra en un cofre."
"Без сил в воде начинаешь тонуть: далеко не заплывайте.": "Sin fuerzas empiezas a hundirte en el agua: no nades demasiado lejos."
"Горящий костёр обжигает и отбрасывает, если подойти вплотную.": "Una hoguera encendida quema y empuja si te acercas demasiado."
"После смерти вещи остаются в мешке на месте гибели, он отмечен на карте.": "Al morir tus cosas quedan en un saco donde caíste; está marcado en el mapa."
"Возвращаешься к жизни у своего костра: поставьте его рядом с домом.": "Vuelves a la vida junto a tu hoguera: ponla cerca de tu casa."
"Жёлуди, шишки и семена можно посадить, и из них вырастут деревья и травы.": "Bellotas, piñas y semillas se pueden plantar, y de ellas crecen árboles y hierbas."
"Траву срезают руками, мечом или косой, и с неё падает волокно.": "La hierba se corta a mano, con espada o con guadaña, y de ella cae fibra."
"Камеру можно повернуть кнопками у миникарты и наклонить, чтобы заглянуть за деревья.": "La cámara se gira con los botones junto al minimapa y se inclina para mirar detrás de los árboles."
"В настройках время суток, сезон и погоду можно сделать как в жизни.": "En los ajustes, la hora, la estación y el tiempo pueden seguir la vida real."
"Удочку делают из двух веток, двух верёвок и кремня, а пойманную рыбу жарят на костре.": "Una caña se hace con dos ramas, dos cuerdas y sílex, y los peces pescados se asan en la hoguera."
"Тушку зверька разделывают руками, а большую тушу — только ножом: с неё падают шкура, кости и жир.": "Una presa pequeña se despieza a mano, y una grande solo con cuchillo: da piel, huesos y grasa."
"На сушилке из шкуры и жира выделывают кожу, там же вялят мясо.": "El cuero se hace de piel y grasa en el secadero, y allí también se seca la carne."
"Лук и стрелы делают у верстака, а наконечник стрелы — из кремня или кости.": "Arcos y flechas se hacen en el banco, y la punta de flecha de sílex o hueso."
"Бронзу плавят в горне из меди и олова, и в сумке должен быть тигель.": "El bronce se funde en la fragua con cobre y estaño, y hace falta un crisol en la bolsa."
"Железную руду плавят в крицу в сыродутной печи, а из крицы в горне получаются слитки.": "El mineral de hierro se funde en lupa en un horno de lupa, y la fragua convierte la lupa en lingotes."
"Железные и стальные инструменты куют на наковальне.": "Las herramientas de hierro y acero se forjan en el yunque."
"Из стеблей льна прядут нить, а на ткацком станке ткут из неё ткань.": "Del tallo de lino se hila hilo, y en el telar se teje tela con él."
"Смолу выгоняют из брёвен в печи для обжига, и для этого нужен глиняный горшок.": "La brea se saca de troncos en el horno, y para eso hace falta una olla de barro."
"Серебро, золото и платину плавят в горне, а на наковальне из слитков собирают блоки.": "Plata, oro y platino se funden en la fragua, y en el yunque se hacen bloques con los lingotes."
"Отменить загрузку (Esc)": "Cancelar la carga (Esc)"
"Мир готов": "El mundo está listo"

