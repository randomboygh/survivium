"Прозрачным становится только то, что перед игроком и не ниже линии: 0 — по ногам, +1 — по пояс, +2 — по голову. Срезы впереди — вертикальные слои по клетке, уровни сверху считаются от линии, берётся более прозрачное. Первые слои рисуются с плотностью первых, следующие за ними тают за «растяжение» слоёв.": "Solo se vuelve transparente lo que está delante del jugador y no por debajo de la línea: 0 — a los pies, +1 — a la cintura, +2 — a la cabeza. Los cortes delante son capas verticales de una celda, los niveles de arriba se cuentan desde la línea, gana el más transparente. Las primeras capas se dibujan con la densidad de las primeras, las siguientes se desvanecen a lo largo del «estiramiento»."
