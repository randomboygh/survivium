# content/core/data/skills.yaml
"Сбор": "Recoger"
"Ягоды, травы, волокно, плоды и покос. Быстрее собирает, иногда берёт на одну больше.": "Bayas, hierbas, fibra, frutos y siega. Recoge más rápido, a veces toma uno más."
"Рубка": "Talar"
"Деревья и кусты топором. Быстрее рубит, тратит меньше сил, иногда снимает лишнее бревно.": "Árboles y arbustos con hacha. Tala más rápido, se cansa menos, a veces saca un tronco extra."
"Копание": "Cavar"
"Земля, песок, камень и руда. Быстрее копает. Выкопать поставленное своими руками опыта не даёт.": "Tierra, arena, piedra y mineral. Cava más rápido. Desenterrar lo que pusiste tú no da experiencia."
"Ремесло": "Oficio"
"Вещи на руках, у верстака, печи и горна. Быстрее делает, инструменты и одежда выходят прочнее.": "Cosas a mano, en el banco, el horno y la fragua. Fabrica más rápido; herramientas y ropa salen más resistentes."
"Стены, пол, чертёж и мебель. Быстрее строит.": "Paredes, suelos, planos y muebles. Construye más rápido."
"Готовка": "Cocina"
"Жарка, похлёбка, хлеб и всё, что готовят на огне. Быстрее готовит, иногда выходит порция больше.": "Asados, guisos, pan y todo lo que se cocina al fuego. Cocina más rápido, a veces sale una ración mayor."
"Охота": "Caza"
"Звери оружием и руками. Быстрее и сильнее бьёт, при разделке туши иногда выходит больше мяса.": "Animales con armas y a mano limpia. Golpea más rápido y fuerte; al despiezar a veces sale más carne."
"Рыбалка": "Pesca"
"Рыба на удочку. Иногда вытаскивает две.": "Peces con caña. A veces saca dos."
"Плавание": "Nadar"
"Растёт, пока плывёшь. Быстрее плывёт (потом и на плотах, лодках).": "Crece mientras nadas. Nada más rápido (luego también en balsas y barcas)."
"Земледелие": "Cultivo"
"Грядки тяпкой, посев, полив и урожай. Быстрее работает на грядках, иногда собирает на одну больше.": "Bancales con azada, siembra, riego y cosecha. Trabaja los bancales más rápido, a veces cosecha uno más."

