"[with_a_heavy_bag_you]": "Con la bolsa pesada andas más lento: deja lo que sobra en un cofre."
"[without_strength_you_start_to]": "Sin fuerzas empiezas a hundirte en el agua: no nades demasiado lejos."
"[a_burning_campfire_scorches_and]": "Una hoguera encendida quema y empuja si te acercas demasiado."
"[after_death_your_things_stay]": "Al morir tus cosas quedan en un saco donde caíste; está marcado en el mapa."
"[you_come_back_to_life]": "Vuelves a la vida junto a tu hoguera: ponla cerca de tu casa."
"[acorns_cones_and_seeds_can]": "Bellotas, piñas y semillas se pueden plantar, y de ellas crecen árboles y hierbas."
"[grass_is_cut_by_hand]": "La hierba se corta a mano, con espada o con guadaña, y de ella cae fibra."
"[the_camera_can_be_turned]": "La cámara se gira con los botones junto al minimapa y se inclina para mirar detrás de los árboles."
"[in_the_settings_the_time]": "En los ajustes, la hora, la estación y el tiempo pueden seguir la vida real."
"[a_fishing_rod_is_made]": "Una caña se hace con dos ramas, dos cuerdas y sílex, y los peces pescados se asan en la hoguera."
"[a_small_animals_carcass_is]": "Una presa pequeña se despieza a mano, y una grande solo con cuchillo: da piel, huesos y grasa."
"[leather_is_made_from_hide]": "El cuero se hace de piel y grasa en el secadero, y allí también se seca la carne."
"[bows_and_arrows_are_made]": "Arcos y flechas se hacen en el banco, y la punta de flecha de sílex o hueso."
"[bronze_is_smelted_in_a]": "El bronce se funde en la fragua con cobre y estaño, y hace falta un crisol en la bolsa."
"[iron_ore_is_smelted_into]": "El mineral de hierro se funde en lupa en un horno de lupa, y la fragua convierte la lupa en lingotes."
"[iron_and_steel_tools_are]": "Las herramientas de hierro y acero se forjan en el yunque."
"[thread_is_spun_from_flax]": "Del tallo de lino se hila hilo, y en el telar se teje tela con él."
"[tar_is_drawn_from_logs]": "La brea se saca de troncos en el horno, y para eso hace falta una olla de barro."
"[silver_gold_and_platinum_are]": "Plata, oro y platino se funden en la fragua, y en el yunque se hacen bloques con los lingotes."
