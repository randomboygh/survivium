# content/core/data/skills.yaml
"[core.skills.gathering]": "Recoger"
"[core.skills.gathering.about]": "Bayas, hierbas, fibra, frutos y siega. Recoge más rápido, a veces toma uno más."
"[core.skills.chopping]": "Talar"
"[core.skills.chopping.about]": "Árboles y arbustos con hacha. Tala más rápido, se cansa menos, a veces saca un tronco extra."
"[core.skills.digging]": "Cavar"
"[core.skills.digging.about]": "Tierra, arena, piedra y mineral. Cava más rápido. Desenterrar lo que pusiste tú no da experiencia."
"[core.skills.crafting]": "Oficio"
"[core.skills.crafting.about]": "Cosas a mano, en el banco, el horno y la fragua. Fabrica más rápido; herramientas y ropa salen más resistentes."
"[core.skills.building]": "Construcción"
"[core.skills.building.about]": "Paredes, suelos, planos y muebles. Construye más rápido."
"[core.skills.cooking]": "Cocina"
"[core.skills.cooking.about]": "Asados, guisos, pan y todo lo que se cocina al fuego. Cocina más rápido, a veces sale una ración mayor."
"[core.skills.hunting]": "Caza"
"[core.skills.hunting.about]": "Animales con armas y a mano limpia. Golpea más rápido y fuerte; al despiezar a veces sale más carne."
"[core.skills.fishing]": "Pesca"
"[core.skills.fishing.about]": "Peces con caña. A veces saca dos."
"[core.skills.swimming]": "Nadar"
"[core.skills.swimming.about]": "Crece mientras nadas. Nada más rápido (luego también en balsas y barcas)."
"[core.skills.farming]": "Cultivo"
"[core.skills.farming.about]": "Bancales con azada, siembra, riego y cosecha. Trabaja los bancales más rápido, a veces cosecha uno más."

