# src/client/ui/menu_loading.gd
"Волокно дают высокая трава, травы и тростник; из трёх волокон скручивают верёвку.": "A fibra vem da grama alta, das ervas e dos juncos; três fibras se torcem numa corda."
"Кремень попадается, когда копаешь землю, песок и осыпь.": "O sílex aparece quando você cava terra, areia e cascalho."
"Костёр складывают из пяти веток и пяти волокон, на нём жарят грибы, мясо и рыбу.": "A fogueira se faz com cinco galhos e cinco fibras; nela se assam cogumelos, carne e peixe."
"Рецепт становится известен, когда в сумке побывали все его материалы.": "Uma receita fica conhecida quando todos os seus materiais já estiveram na sua bolsa."
"Верстак из восьми веток и двух верёвок: у него делают каменные инструменты.": "Uma bancada de oito galhos e duas cordas: nela se fazem ferramentas de pedra."
"Печь для обжига складывают из камня и глины, в ней обжигают кирпичи и пекут лепёшки.": "O forno se faz de pedra e argila; nele se cozem tijolos e se assam broas."
"Колоски дают зерно, а из зерна мелют муку.": "As espigas dão grão, e do grão se mói farinha."
"Из мха и волокна делают бинты.": "Ataduras se fazem de musgo e fibra."
"Карта помнит всё, что вы видели, и на ней можно ставить метки.": "O mapa lembra tudo o que você viu, e dá para pôr marcas nele."
"Кнопки уровня у миникарты срезают вид: так видно, что в пещере и под кронами.": "Os botões de nível junto ao minimapa cortam a vista: assim se vê o que há numa caverna e sob as copas."
"Против ветра идти тяжелее, а в прыжке он сносит в сторону.": "Andar contra o vento é mais difícil, e no pulo ele empurra para o lado."
"Факел из ветки и двух волокон светит в темноте, но со временем догорает.": "Uma tocha de um galho e duas fibras ilumina o escuro, mas se consome com o tempo."
"Доски делают у верстака из бревна, если в сумке есть топор.": "Tábuas se fazem de uma tora na bancada se houver um machado na bolsa."
"Медную руду бьют киркой в жилах камня, а слитки плавят в горне из руды и угля.": "O minério de cobre se tira com picareta em veios de pedra, e os lingotes se fundem na forja com minério e carvão."
"Уголь выжигают из брёвен в печи для обжига.": "O carvão se faz queimando toras no forno."
"Сундук из шести досок хранит вещи, которые не помещаются в сумку.": "Um baú de seis tábuas guarda o que não cabe na bolsa."
"Прыжки, плавание и работа тратят силы, а в покое они возвращаются.": "Pular, nadar e trabalhar gastam forças, e elas voltam no descanso."
"Голодному не восстановить силы полностью: ешьте ягоды, грибы, мясо и лепёшки.": "Com fome não se recupera de todo: coma bagas, cogumelos, carne e broas."
"С тяжёлой сумкой идёшь медленнее: лишнее можно оставить в сундуке.": "Com a bolsa pesada você anda mais devagar: deixe o excesso num baú."
"Без сил в воде начинаешь тонуть: далеко не заплывайте.": "Sem forças você começa a afundar na água: não nade longe demais."
"Горящий костёр обжигает и отбрасывает, если подойти вплотную.": "Uma fogueira acesa queima e empurra se você chegar perto demais."
"После смерти вещи остаются в мешке на месте гибели, он отмечен на карте.": "Depois da morte suas coisas ficam num saco onde você caiu; ele aparece no mapa."
"Возвращаешься к жизни у своего костра: поставьте его рядом с домом.": "Você volta à vida na sua fogueira: monte-a perto de casa."
"Жёлуди, шишки и семена можно посадить, и из них вырастут деревья и травы.": "Bolotas, pinhas e sementes podem ser plantadas, e delas crescem árvores e ervas."
"Траву срезают руками, мечом или косой, и с неё падает волокно.": "A grama se corta à mão, com espada ou foice, e dela cai fibra."
"Камеру можно повернуть кнопками у миникарты и наклонить, чтобы заглянуть за деревья.": "A câmera gira com os botões junto ao minimapa e se inclina para olhar atrás das árvores."
"В настройках время суток, сезон и погоду можно сделать как в жизни.": "Nas configurações, a hora do dia, a estação e o clima podem seguir a vida real."
"Удочку делают из двух веток, двух верёвок и кремня, а пойманную рыбу жарят на костре.": "Uma vara de pesca se faz com dois galhos, duas cordas e sílex, e os peixes pescados se assam na fogueira."
"Тушку зверька разделывают руками, а большую тушу — только ножом: с неё падают шкура, кости и жир.": "Uma presa pequena se desmancha à mão, e uma grande só com faca: dá pele, ossos e gordura."
"На сушилке из шкуры и жира выделывают кожу, там же вялят мясо.": "O couro se faz de pele e gordura no secador, e lá também se seca carne."
"Лук и стрелы делают у верстака, а наконечник стрелы — из кремня или кости.": "Arcos e flechas se fazem na bancada, e a ponta da flecha de sílex ou osso."
"Бронзу плавят в горне из меди и олова, и в сумке должен быть тигель.": "O bronze se funde na forja com cobre e estanho, e é preciso um cadinho na bolsa."
"Железную руду плавят в крицу в сыродутной печи, а из крицы в горне получаются слитки.": "O minério de ferro se funde em lupa num forno de lupa, e a forja transforma a lupa em lingotes."
"Железные и стальные инструменты куют на наковальне.": "Ferramentas de ferro e aço se forjam na bigorna."
"Из стеблей льна прядут нить, а на ткацком станке ткут из неё ткань.": "Dos caules de linho se fia linha, e no tear se tece pano com ela."
"Смолу выгоняют из брёвен в печи для обжига, и для этого нужен глиняный горшок.": "O alcatrão se tira de toras no forno, e para isso é preciso um pote de barro."
"Серебро, золото и платину плавят в горне, а на наковальне из слитков собирают блоки.": "Prata, ouro e platina se fundem na forja, e na bigorna se fazem blocos dos lingotes."
