# content/core/data/eras.yaml
"Выживание без инструментов": "Sobrevivência sem ferramentas"
"Сбор руками, ветки, волокно, камни, ягоды и грибы; простые вещи из них руками.": "Coleta à mão: galhos, fibra, pedras, bagas e cogumelos; coisas simples feitas com eles à mão."
"Примитивные инструменты": "Ferramentas primitivas"
"Верёвка, костёр, верстак, каменные и деревянные инструменты, брёвна и доски, сундук.": "Corda, fogueira, bancada, ferramentas de pedra e madeira, toras e tábuas, baú."
"Дерево, кости и кожа": "Madeira, osso e couro"
"Разделка зверей, сушилка, кожа из шкуры с жиром, костяные игла и клей, свеча, луки и праща, ткань.": "Desmanche, secador, couro de pele e gordura, agulha e cola de osso, vela, arcos e funda, pano."
"Керамика и ранняя металлургия": "Cerâmica e primeira metalurgia"
"Печь для обжига, кирпич, уголь, горн, медь и медные инструменты.": "Forno de cozer, tijolo, carvão, forja, cobre e ferramentas de cobre."
"Бронза": "Bronze"
"Олово, тигель, бронзовый сплав и бронзовые инструменты, которые берут железную руду.": "Estanho, cadinho, liga de bronze e ferramentas de bronze que extraem minério de ferro."
"Железо": "Ferro"
"Железная руда, сыродутная печь и крица, железные слитки, наковальня и железные инструменты.": "Minério de ferro, forno de lupa e lupa, lingotes de ferro, bigorna e ferramentas de ferro."
"Сталь": "Aço"
"Сталь из железа с углём в тигле и стальные инструменты.": "Aço de ferro e carvão num cadinho, e ferramentas de aço."

