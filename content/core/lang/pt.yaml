# content/core/data/skills.yaml
"Сбор": "Coleta"
"Ягоды, травы, волокно, плоды и покос. Быстрее собирает, иногда берёт на одну больше.": "Bagas, ervas, fibra, frutos e ceifa. Coleta mais rápido, às vezes pega um a mais."
"Рубка": "Corte"
"Деревья и кусты топором. Быстрее рубит, тратит меньше сил, иногда снимает лишнее бревно.": "Árvores e arbustos com machado. Corta mais rápido, cansa menos, às vezes tira uma tora extra."
"Копание": "Cavar"
"Земля, песок, камень и руда. Быстрее копает. Выкопать поставленное своими руками опыта не даёт.": "Terra, areia, pedra e minério. Cava mais rápido. Desenterrar o que você mesmo pôs não dá experiência."
"Ремесло": "Ofício"
"Вещи на руках, у верстака, печи и горна. Быстрее делает, инструменты и одежда выходят прочнее.": "Coisas à mão, na bancada, no forno e na forja. Faz mais rápido; ferramentas e roupas saem mais resistentes."
"Стены, пол, чертёж и мебель. Быстрее строит.": "Paredes, pisos, plantas e móveis. Constrói mais rápido."
"Готовка": "Cozinha"
"Жарка, похлёбка, хлеб и всё, что готовят на огне. Быстрее готовит, иногда выходит порция больше.": "Assados, ensopado, pão e tudo que se cozinha no fogo. Cozinha mais rápido, às vezes sai uma porção maior."
"Охота": "Caça"
"Звери оружием и руками. Быстрее и сильнее бьёт, при разделке туши иногда выходит больше мяса.": "Animais com armas e com as mãos. Bate mais rápido e mais forte; ao desmanchar às vezes sai mais carne."
"Рыбалка": "Pesca"
"Рыба на удочку. Иногда вытаскивает две.": "Peixes com vara. Às vezes tira dois."
"Плавание": "Nadar"
"Растёт, пока плывёшь. Быстрее плывёт (потом и на плотах, лодках).": "Cresce enquanto você nada. Nada mais rápido (depois também em jangadas e barcos)."
"Земледелие": "Cultivo"
"Грядки тяпкой, посев, полив и урожай. Быстрее работает на грядках, иногда собирает на одну больше.": "Canteiros com enxada, semeadura, rega e colheita. Trabalha os canteiros mais rápido, às vezes colhe um a mais."

