"Прозрачным становится только то, что перед игроком и не ниже линии: 0 — по ногам, +1 — по пояс, +2 — по голову. Срезы впереди — вертикальные слои по клетке, уровни сверху считаются от линии, берётся более прозрачное. Первые слои рисуются с плотностью первых, следующие за ними тают за «растяжение» слоёв.": "Só fica transparente o que está à frente do jogador e não abaixo da linha: 0 — nos pés, +1 — na cintura, +2 — na cabeça. Os cortes à frente são camadas verticais de uma célula, os níveis acima contam a partir da linha, vence o mais transparente. As primeiras camadas são desenhadas com a densidade das primeiras, as seguintes somem ao longo do “estiramento”."
