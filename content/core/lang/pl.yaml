# content/core/data/eras.yaml
"[core.eras.foraging]": "Przetrwanie bez narzędzi"
"[core.eras.foraging.about]": "Zbieranie rękami: gałęzie, włókno, kamienie, jagody i grzyby; proste rzeczy z nich robione ręcznie."
"[core.eras.primitive]": "Prymitywne narzędzia"
"[core.eras.primitive.about]": "Sznurek, ognisko, warsztat, kamienne i drewniane narzędzia, kłody i deski, skrzynia."
"[core.eras.bone_leather]": "Drewno, kość i skóra"
"[core.eras.bone_leather.about]": "Oprawianie, suszarnia, skóra z futra i tłuszczu, kościana igła i klej, świeca, łuki i proca, tkanina."
"[core.eras.bronze]": "Garncarstwo i wczesna metalurgia"
"[core.eras.bronze.about]": "Piec do wypalania, cegła, węgiel drzewny, kuźnia, miedź i miedziane narzędzia."
"[core.eras.alloy]": "Brąz"
"[core.eras.alloy.about]": "Cyna, tygiel, stop brązu i brązowe narzędzia, które wydobywają rudę żelaza."
"[core.eras.iron]": "Żelazo"
"[core.eras.iron.about]": "Ruda żelaza, dymarka i łupka, sztabki żelaza, kowadło i żelazne narzędzia."
"[core.eras.steel]": "Stal"
"[core.eras.steel.about]": "Stal z żelaza i węgla w tyglu oraz stalowe narzędzia."

