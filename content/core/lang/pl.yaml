"[with_a_heavy_bag_you]": "Z ciężką torbą idziesz wolniej: nadmiar zostaw w skrzyni."
"[without_strength_you_start_to]": "Bez sił zaczynasz tonąć: nie wypływaj daleko."
"[a_burning_campfire_scorches_and]": "Płonące ognisko parzy i odpycha, gdy podejdziesz za blisko."
"[after_death_your_things_stay]": "Po śmierci rzeczy zostają w worku tam, gdzie padłeś; jest zaznaczony na mapie."
"[you_come_back_to_life]": "Wracasz do życia przy swoim ognisku: postaw je blisko domu."
"[acorns_cones_and_seeds_can]": "Żołędzie, szyszki i nasiona można zasadzić, a wyrosną z nich drzewa i zioła."
"[grass_is_cut_by_hand]": "Trawę ścina się rękami, mieczem lub kosą, i spada z niej włókno."
"[the_camera_can_be_turned]": "Kamerę można obracać przyciskami przy minimapie i pochylać, by zajrzeć za drzewa."
"[in_the_settings_the_time]": "W ustawieniach porę dnia, porę roku i pogodę można ustawić jak w życiu."
"[a_fishing_rod_is_made]": "Wędkę robi się z dwóch gałęzi, dwóch sznurków i krzemienia, a złowione ryby piecze się na ognisku."
"[a_small_animals_carcass_is]": "Małą tuszę oprawia się rękami, a dużą tylko nożem: daje skórę, kości i tłuszcz."
"[leather_is_made_from_hide]": "Na suszarni ze skóry i tłuszczu wyprawia się skórę, tam też suszy się mięso."
"[bows_and_arrows_are_made]": "Łuki i strzały robi się przy warsztacie, a grot z krzemienia lub kości."
"[bronze_is_smelted_in_a]": "Brąz wytapia się w kuźni z miedzi i cyny, a w torbie musi być tygiel."
"[iron_ore_is_smelted_into]": "Rudę żelaza wytapia się w łupkę w dymarce, a kuźnia robi z łupki sztabki."
"[iron_and_steel_tools_are]": "Narzędzia z żelaza i stali kuje się na kowadle."
"[thread_is_spun_from_flax]": "Z łodyg lnu przędzie się nić, a na krośnie tka się z niej tkaninę."
"[tar_is_drawn_from_logs]": "Smołę wytapia się z kłód w piecu, a do tego trzeba glinianego garnka."
"[silver_gold_and_platinum_are]": "Srebro, złoto i platynę wytapia się w kuźni, a na kowadle robi się ze sztabek bloki."
