# src/client/ui/menu_loading.gd
"[fiber_comes_from_tall_grass]": "Włókno daje wysoka trawa, zioła i trzcina; z trzech włókien skręca się sznurek."
"[flint_turns_up_when_you]": "Krzemień trafia się przy kopaniu ziemi, piasku i piargu."
"[a_campfire_is_made_of]": "Ognisko układa się z pięciu gałęzi i pięciu włókien; piecze się na nim grzyby, mięso i ryby."
"[a_recipe_becomes_known_once]": "Przepis staje się znany, gdy wszystkie jego materiały były w torbie."
"[a_workbench_of_eight_branches]": "Warsztat z ośmiu gałęzi i dwóch sznurków: robi się przy nim kamienne narzędzia."
"[a_kiln_is_built_of]": "Piec do wypalania stawia się z kamienia i gliny; wypala się w nim cegły i piecze placki."
"[ears_give_grain_and_grain]": "Kłosy dają ziarno, a ziarno miele się na mąkę."
"[bandages_are_made_of_moss]": "Bandaże robi się z mchu i włókna."
"[the_map_remembers_everything_you]": "Mapa pamięta wszystko, co widziałeś, i można stawiać na niej znaczniki."
"[the_level_buttons_by_the]": "Przyciski poziomu przy minimapie przecinają widok: tak widać, co jest w jaskini i pod koronami."
"[walking_against_the_wind_is]": "Pod wiatr idzie się ciężej, a w skoku znosi on w bok."
"[a_torch_of_a_branch]": "Pochodnia z gałęzi i dwóch włókien świeci w ciemności, ale z czasem się wypala."
"[planks_are_made_from_a]": "Deski robi się przy warsztacie z kłody, jeśli w torbie jest siekiera."
"[copper_ore_is_mined_with]": "Rudę miedzi wydobywa się kilofem z żył w kamieniu, a sztabki wytapia w kuźni z rudy i węgla."
"[charcoal_is_burned_from_logs]": "Węgiel drzewny wypala się z kłód w piecu."
"[a_chest_of_six_planks]": "Skrzynia z sześciu desek przechowuje to, co nie mieści się w torbie."
"[jumping_swimming_and_work_use]": "Skoki, pływanie i praca zużywają siły, a w spoczynku one wracają."
"[a_hungry_body_cant_fully]": "Głodny nie odzyska w pełni sił: jedz jagody, grzyby, mięso i placki."
"[with_a_heavy_bag_you]": "Z ciężką torbą idziesz wolniej: nadmiar zostaw w skrzyni."
"[without_strength_you_start_to]": "Bez sił zaczynasz tonąć: nie wypływaj daleko."
"[a_burning_campfire_scorches_and]": "Płonące ognisko parzy i odpycha, gdy podejdziesz za blisko."
"[after_death_your_things_stay]": "Po śmierci rzeczy zostają w worku tam, gdzie padłeś; jest zaznaczony na mapie."
"[you_come_back_to_life]": "Wracasz do życia przy swoim ognisku: postaw je blisko domu."
"[acorns_cones_and_seeds_can]": "Żołędzie, szyszki i nasiona można zasadzić, a wyrosną z nich drzewa i zioła."
"[grass_is_cut_by_hand]": "Trawę ścina się rękami, mieczem lub kosą, i spada z niej włókno."
"[the_camera_can_be_turned]": "Kamerę można obracać przyciskami przy minimapie i pochylać, by zajrzeć za drzewa."
"[in_the_settings_the_time]": "W ustawieniach porę dnia, porę roku i pogodę można ustawić jak w życiu."
