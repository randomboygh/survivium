# content/core/data/skills.yaml
"[core.skills.gathering]": "Zbiór"
"[core.skills.gathering.about]": "Jagody, zioła, włókno, owoce i koszenie. Zbiera szybciej, czasem bierze jedno więcej."
"[core.skills.chopping]": "Ścinka"
"[core.skills.chopping.about]": "Drzewa i krzaki siekierą. Ścina szybciej, mniej się męczy, czasem daje dodatkową kłodę."
"[core.skills.digging]": "Kopanie"
"[core.skills.digging.about]": "Ziemia, piasek, kamień i ruda. Kopie szybciej. Wykopanie tego, co sam postawiłeś, nie daje doświadczenia."
"[core.skills.crafting]": "Rzemiosło"
"[core.skills.crafting.about]": "Rzeczy w rękach, przy warsztacie, piecu i kuźni. Robi szybciej; narzędzia i ubrania wychodzą trwalsze."
"[core.skills.building]": "Budowa"
"[core.skills.building.about]": "Ściany, podłogi, plany i meble. Buduje szybciej."
"[core.skills.cooking]": "Gotowanie"
"[core.skills.cooking.about]": "Pieczenie, gulasz, chleb i wszystko, co gotuje się na ogniu. Gotuje szybciej, czasem wychodzi większa porcja."
"[core.skills.hunting]": "Łowy"
"[core.skills.hunting.about]": "Zwierzęta bronią i gołymi rękami. Bije szybciej i mocniej; przy oprawianiu czasem więcej mięsa."
"[core.skills.fishing]": "Wędkarstwo"
"[core.skills.fishing.about]": "Ryby na wędkę. Czasem wyciąga dwie."
"[core.skills.swimming]": "Pływanie"
"[core.skills.swimming.about]": "Rośnie, gdy pływasz. Pływa szybciej (później też na tratwach i łodziach)."
"[core.skills.farming]": "Uprawa"
"[core.skills.farming.about]": "Grządki motyką, siew, podlewanie i zbiory. Szybciej pracuje na grządkach, czasem zbiera jedno więcej."

