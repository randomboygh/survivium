"Рецепт становится известен, когда в сумке побывали все его материалы.": "Przepis staje się znany, gdy wszystkie jego materiały były w torbie."
"Верстак из восьми веток и двух верёвок: у него делают каменные инструменты.": "Warsztat z ośmiu gałęzi i dwóch sznurków: robi się przy nim kamienne narzędzia."
"Печь для обжига складывают из камня и глины, в ней обжигают кирпичи и пекут лепёшки.": "Piec do wypalania stawia się z kamienia i gliny; wypala się w nim cegły i piecze placki."
"Колоски дают зерно, а из зерна мелют муку.": "Kłosy dają ziarno, a ziarno miele się na mąkę."
"Из мха и волокна делают бинты.": "Bandaże robi się z mchu i włókna."
"Карта помнит всё, что вы видели, и на ней можно ставить метки.": "Mapa pamięta wszystko, co widziałeś, i można stawiać na niej znaczniki."
"Кнопки уровня у миникарты срезают вид: так видно, что в пещере и под кронами.": "Przyciski poziomu przy minimapie przecinają widok: tak widać, co jest w jaskini i pod koronami."
"Против ветра идти тяжелее, а в прыжке он сносит в сторону.": "Pod wiatr idzie się ciężej, a w skoku znosi on w bok."
"Факел из ветки и двух волокон светит в темноте, но со временем догорает.": "Pochodnia z gałęzi i dwóch włókien świeci w ciemności, ale z czasem się wypala."
"Доски делают у верстака из бревна, если в сумке есть топор.": "Deski robi się przy warsztacie z kłody, jeśli w torbie jest siekiera."
"Медную руду бьют киркой в жилах камня, а слитки плавят в горне из руды и угля.": "Rudę miedzi wydobywa się kilofem z żył w kamieniu, a sztabki wytapia w kuźni z rudy i węgla."
"Уголь выжигают из брёвен в печи для обжига.": "Węgiel drzewny wypala się z kłód w piecu."
"Сундук из шести досок хранит вещи, которые не помещаются в сумку.": "Skrzynia z sześciu desek przechowuje to, co nie mieści się w torbie."
"Прыжки, плавание и работа тратят силы, а в покое они возвращаются.": "Skoki, pływanie i praca zużywają siły, a w spoczynku one wracają."
"Голодному не восстановить силы полностью: ешьте ягоды, грибы, мясо и лепёшки.": "Głodny nie odzyska w pełni sił: jedz jagody, grzyby, mięso i placki."
"С тяжёлой сумкой идёшь медленнее: лишнее можно оставить в сундуке.": "Z ciężką torbą idziesz wolniej: nadmiar zostaw w skrzyni."
"Без сил в воде начинаешь тонуть: далеко не заплывайте.": "Bez sił zaczynasz tonąć: nie wypływaj daleko."
"Горящий костёр обжигает и отбрасывает, если подойти вплотную.": "Płonące ognisko parzy i odpycha, gdy podejdziesz za blisko."
"После смерти вещи остаются в мешке на месте гибели, он отмечен на карте.": "Po śmierci rzeczy zostają w worku tam, gdzie padłeś; jest zaznaczony na mapie."
"Возвращаешься к жизни у своего костра: поставьте его рядом с домом.": "Wracasz do życia przy swoim ognisku: postaw je blisko domu."
"Жёлуди, шишки и семена можно посадить, и из них вырастут деревья и травы.": "Żołędzie, szyszki i nasiona można zasadzić, a wyrosną z nich drzewa i zioła."
"Траву срезают руками, мечом или косой, и с неё падает волокно.": "Trawę ścina się rękami, mieczem lub kosą, i spada z niej włókno."
"Камеру можно повернуть кнопками у миникарты и наклонить, чтобы заглянуть за деревья.": "Kamerę można obracać przyciskami przy minimapie i pochylać, by zajrzeć za drzewa."
"В настройках время суток, сезон и погоду можно сделать как в жизни.": "W ustawieniach porę dnia, porę roku i pogodę można ustawić jak w życiu."
"Удочку делают из двух веток, двух верёвок и кремня, а пойманную рыбу жарят на костре.": "Wędkę robi się z dwóch gałęzi, dwóch sznurków i krzemienia, a złowione ryby piecze się na ognisku."
"Тушку зверька разделывают руками, а большую тушу — только ножом: с неё падают шкура, кости и жир.": "Małą tuszę oprawia się rękami, a dużą tylko nożem: daje skórę, kości i tłuszcz."
"На сушилке из шкуры и жира выделывают кожу, там же вялят мясо.": "Na suszarni ze skóry i tłuszczu wyprawia się skórę, tam też suszy się mięso."
"Лук и стрелы делают у верстака, а наконечник стрелы — из кремня или кости.": "Łuki i strzały robi się przy warsztacie, a grot z krzemienia lub kości."
"Бронзу плавят в горне из меди и олова, и в сумке должен быть тигель.": "Brąz wytapia się w kuźni z miedzi i cyny, a w torbie musi być tygiel."
"Железную руду плавят в крицу в сыродутной печи, а из крицы в горне получаются слитки.": "Rudę żelaza wytapia się w łupkę w dymarce, a kuźnia robi z łupki sztabki."
"Железные и стальные инструменты куют на наковальне.": "Narzędzia z żelaza i stali kuje się na kowadle."
"Из стеблей льна прядут нить, а на ткацком станке ткут из неё ткань.": "Z łodyg lnu przędzie się nić, a na krośnie tka się z niej tkaninę."
"Смолу выгоняют из брёвен в печи для обжига, и для этого нужен глиняный горшок.": "Smołę wytapia się z kłód w piecu, a do tego trzeba glinianego garnka."
"Серебро, золото и платину плавят в горне, а на наковальне из слитков собирают блоки.": "Srebro, złoto i platynę wytapia się w kuźni, a na kowadle robi się ze sztabek bloki."
