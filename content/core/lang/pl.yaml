# content/core/data/eras.yaml
"Выживание без инструментов": "Przetrwanie bez narzędzi"
"Сбор руками, ветки, волокно, камни, ягоды и грибы; простые вещи из них руками.": "Zbieranie rękami: gałęzie, włókno, kamienie, jagody i grzyby; proste rzeczy z nich robione ręcznie."
"Примитивные инструменты": "Prymitywne narzędzia"
"Верёвка, костёр, верстак, каменные и деревянные инструменты, брёвна и доски, сундук.": "Sznurek, ognisko, warsztat, kamienne i drewniane narzędzia, kłody i deski, skrzynia."
"Дерево, кости и кожа": "Drewno, kość i skóra"
"Разделка зверей, сушилка, кожа из шкуры с жиром, костяные игла и клей, свеча, луки и праща, ткань.": "Oprawianie, suszarnia, skóra z futra i tłuszczu, kościana igła i klej, świeca, łuki i proca, tkanina."
"Керамика и ранняя металлургия": "Garncarstwo i wczesna metalurgia"
"Печь для обжига, кирпич, уголь, горн, медь и медные инструменты.": "Piec do wypalania, cegła, węgiel drzewny, kuźnia, miedź i miedziane narzędzia."
"Бронза": "Brąz"
"Олово, тигель, бронзовый сплав и бронзовые инструменты, которые берут железную руду.": "Cyna, tygiel, stop brązu i brązowe narzędzia, które wydobywają rudę żelaza."
"Железо": "Żelazo"
"Железная руда, сыродутная печь и крица, железные слитки, наковальня и железные инструменты.": "Ruda żelaza, dymarka i łupka, sztabki żelaza, kowadło i żelazne narzędzia."
"Сталь": "Stal"
"Сталь из железа с углём в тигле и стальные инструменты.": "Stal z żelaza i węgla w tyglu oraz stalowe narzędzia."

