# content/core/data/skills.yaml
"Сбор": "Zbiór"
"Ягоды, травы, волокно, плоды и покос. Быстрее собирает, иногда берёт на одну больше.": "Jagody, zioła, włókno, owoce i koszenie. Zbiera szybciej, czasem bierze jedno więcej."
"Рубка": "Ścinka"
"Деревья и кусты топором. Быстрее рубит, тратит меньше сил, иногда снимает лишнее бревно.": "Drzewa i krzaki siekierą. Ścina szybciej, mniej się męczy, czasem daje dodatkową kłodę."
"Копание": "Kopanie"
"Земля, песок, камень и руда. Быстрее копает. Выкопать поставленное своими руками опыта не даёт.": "Ziemia, piasek, kamień i ruda. Kopie szybciej. Wykopanie tego, co sam postawiłeś, nie daje doświadczenia."
"Ремесло": "Rzemiosło"
"Вещи на руках, у верстака, печи и горна. Быстрее делает, инструменты и одежда выходят прочнее.": "Rzeczy w rękach, przy warsztacie, piecu i kuźni. Robi szybciej; narzędzia i ubrania wychodzą trwalsze."
"Стены, пол, чертёж и мебель. Быстрее строит.": "Ściany, podłogi, plany i meble. Buduje szybciej."
"Готовка": "Gotowanie"
"Жарка, похлёбка, хлеб и всё, что готовят на огне. Быстрее готовит, иногда выходит порция больше.": "Pieczenie, gulasz, chleb i wszystko, co gotuje się na ogniu. Gotuje szybciej, czasem wychodzi większa porcja."
"Охота": "Łowy"
"Звери оружием и руками. Быстрее и сильнее бьёт, при разделке туши иногда выходит больше мяса.": "Zwierzęta bronią i gołymi rękami. Bije szybciej i mocniej; przy oprawianiu czasem więcej mięsa."
"Рыбалка": "Wędkarstwo"
"Рыба на удочку. Иногда вытаскивает две.": "Ryby na wędkę. Czasem wyciąga dwie."
"Плавание": "Pływanie"
"Растёт, пока плывёшь. Быстрее плывёт (потом и на плотах, лодках).": "Rośnie, gdy pływasz. Pływa szybciej (później też na tratwach i łodziach)."
"Земледелие": "Uprawa"
"Грядки тяпкой, посев, полив и урожай. Быстрее работает на грядках, иногда собирает на одну больше.": "Grządki motyką, siew, podlewanie i zbiory. Szybciej pracuje na grządkach, czasem zbiera jedno więcej."

