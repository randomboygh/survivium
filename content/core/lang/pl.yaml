"[core.eras.bronze.about]": "Piec do wypalania, cegła, węgiel drzewny, kuźnia, miedź i miedziane narzędzia."
"[core.eras.alloy]": "Brąz"
"[core.eras.alloy.about]": "Cyna, tygiel, stop brązu i brązowe narzędzia, które wydobywają rudę żelaza."
"[core.eras.iron]": "Żelazo"
"[core.eras.iron.about]": "Ruda żelaza, dymarka i łupka, sztabki żelaza, kowadło i żelazne narzędzia."
"[core.eras.steel]": "Stal"
"[core.eras.steel.about]": "Stal z żelaza i węgla w tyglu oraz stalowe narzędzia."

