"Прозрачным становится только то, что перед игроком и не ниже линии: 0 — по ногам, +1 — по пояс, +2 — по голову. Срезы впереди — вертикальные слои по клетке, уровни сверху считаются от линии, берётся более прозрачное. Первые слои рисуются с плотностью первых, следующие за ними тают за «растяжение» слоёв.": "Przezroczyste staje się tylko to, co przed graczem i nie niżej linii: 0 — przy stopach, +1 — w pasie, +2 — przy głowie. Cięcia z przodu to pionowe warstwy po polu, poziomy z góry liczy się od linii, wygrywa bardziej przezroczyste. Pierwsze warstwy rysuje się z gęstością pierwszych, następne zanikają przez „rozciągnięcie” warstw."
