"[in_the_settings_the_time]": "У налаштуваннях час доби, сезон і погоду можна зробити як у житті."
"[a_fishing_rod_is_made]": "Вудку роблять із двох гілок, двох мотузок і кременю, а спійману рибу смажать на багатті."
