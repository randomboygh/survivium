# content/core/data/skills.yaml
"Сбор": "Збір"
"Ягоды, травы, волокно, плоды и покос. Быстрее собирает, иногда берёт на одну больше.": "Ягоди, трави, волокно, плоди й косіння. Швидше збирає, іноді бере на одну більше."
"Рубка": "Рубка"
"Деревья и кусты топором. Быстрее рубит, тратит меньше сил, иногда снимает лишнее бревно.": "Дерева й кущі сокирою. Швидше рубає, менше втомлюється, іноді знімає зайву колоду."
"Копание": "Копання"
"Земля, песок, камень и руда. Быстрее копает. Выкопать поставленное своими руками опыта не даёт.": "Земля, пісок, камінь і руда. Швидше копає. Викопати поставлене власноруч досвіду не дає."
"Ремесло": "Ремесло"
"Вещи на руках, у верстака, печи и горна. Быстрее делает, инструменты и одежда выходят прочнее.": "Речі в руках, біля верстака, печі й горна. Швидше робить, інструменти й одяг виходять міцнішими."
"Стены, пол, чертёж и мебель. Быстрее строит.": "Стіни, підлога, креслення й меблі. Швидше будує."
"Готовка": "Кулінарія"
"Жарка, похлёбка, хлеб и всё, что готовят на огне. Быстрее готовит, иногда выходит порция больше.": "Смаження, юшка, хліб і все, що готують на вогні. Швидше готує, іноді порція виходить більшою."
"Охота": "Полювання"
"Звери оружием и руками. Быстрее и сильнее бьёт, при разделке туши иногда выходит больше мяса.": "Звірі зброєю й руками. Швидше й сильніше б'є, при розбиранні туші іноді виходить більше м'яса."
"Рыбалка": "Риболовля"
"Рыба на удочку. Иногда вытаскивает две.": "Риба на вудку. Іноді витягує дві."
"Плавание": "Плавання"
"Растёт, пока плывёшь. Быстрее плывёт (потом и на плотах, лодках).": "Росте, поки пливеш. Швидше пливе (потім і на плотах, човнах)."
"Земледелие": "Землеробство"
"Грядки тяпкой, посев, полив и урожай. Быстрее работает на грядках, иногда собирает на одну больше.": "Грядки сапою, посів, полив і врожай. Швидше працює на грядках, іноді збирає на одну більше."

