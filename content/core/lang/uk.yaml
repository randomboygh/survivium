# src/client/ui/menu_loading.gd
"Волокно дают высокая трава, травы и тростник; из трёх волокон скручивают верёвку.": "Волокно дають висока трава, трави й очерет; із трьох волокон скручують мотузку."
"Кремень попадается, когда копаешь землю, песок и осыпь.": "Кремінь трапляється, коли копаєш землю, пісок і осип."
"Костёр складывают из пяти веток и пяти волокон, на нём жарят грибы, мясо и рыбу.": "Багаття складають із п'яти гілок і п'яти волокон, на ньому смажать гриби, м'ясо й рибу."
"Рецепт становится известен, когда в сумке побывали все его материалы.": "Рецепт стає відомим, коли в сумці побували всі його матеріали."
"Верстак из восьми веток и двух верёвок: у него делают каменные инструменты.": "Верстак із восьми гілок і двох мотузок: біля нього роблять кам'яні інструменти."
"Печь для обжига складывают из камня и глины, в ней обжигают кирпичи и пекут лепёшки.": "Піч для випалу складають із каменю й глини, у ній випалюють цеглу й печуть коржі."
"Колоски дают зерно, а из зерна мелют муку.": "Колоски дають зерно, а із зерна мелють борошно."
"Из мха и волокна делают бинты.": "Із моху й волокна роблять бинти."
"Карта помнит всё, что вы видели, и на ней можно ставить метки.": "Мапа пам'ятає все, що ви бачили, і на ній можна ставити мітки."
"Кнопки уровня у миникарты срезают вид: так видно, что в пещере и под кронами.": "Кнопки рівня біля мінімапи зрізають вигляд: так видно, що в печері й під кронами."
"Против ветра идти тяжелее, а в прыжке он сносит в сторону.": "Проти вітру йти важче, а в стрибку він зносить убік."
"Факел из ветки и двух волокон светит в темноте, но со временем догорает.": "Смолоскип із гілки й двох волокон світить у темряві, але з часом догорає."
"Доски делают у верстака из бревна, если в сумке есть топор.": "Дошки роблять біля верстака з колоди, якщо в сумці є сокира."
"Медную руду бьют киркой в жилах камня, а слитки плавят в горне из руды и угля.": "Мідну руду б'ють кайлом у жилах каменю, а зливки плавлять у горні з руди й вугілля."
"Уголь выжигают из брёвен в печи для обжига.": "Вугілля випалюють із колод у печі для випалу."
"Сундук из шести досок хранит вещи, которые не помещаются в сумку.": "Скриня із шести дощок зберігає речі, що не вміщаються в сумку."
"Прыжки, плавание и работа тратят силы, а в покое они возвращаются.": "Стрибки, плавання й робота витрачають сили, а в спокої вони повертаються."
"Голодному не восстановить силы полностью: ешьте ягоды, грибы, мясо и лепёшки.": "Голодному не відновити сили повністю: їжте ягоди, гриби, м'ясо й коржі."
"С тяжёлой сумкой идёшь медленнее: лишнее можно оставить в сундуке.": "З важкою сумкою йдеш повільніше: зайве можна залишити в скрині."
"Без сил в воде начинаешь тонуть: далеко не заплывайте.": "Без сил у воді починаєш тонути: далеко не запливайте."
"Горящий костёр обжигает и отбрасывает, если подойти вплотную.": "Палаюче багаття обпікає й відкидає, якщо підійти впритул."
"После смерти вещи остаются в мешке на месте гибели, он отмечен на карте.": "Після смерті речі лишаються в мішку на місці загибелі, він позначений на мапі."
"Возвращаешься к жизни у своего костра: поставьте его рядом с домом.": "Повертаєшся до життя біля свого багаття: поставте його поруч із домом."
"Жёлуди, шишки и семена можно посадить, и из них вырастут деревья и травы.": "Жолуді, шишки й насіння можна посадити, і з них виростуть дерева й трави."
"Траву срезают руками, мечом или косой, и с неё падает волокно.": "Траву зрізають руками, мечем або косою, і з неї падає волокно."
"Камеру можно повернуть кнопками у миникарты и наклонить, чтобы заглянуть за деревья.": "Камеру можна повернути кнопками біля мінімапи й нахилити, щоб зазирнути за дерева."
"В настройках время суток, сезон и погоду можно сделать как в жизни.": "У налаштуваннях час доби, сезон і погоду можна зробити як у житті."
"Удочку делают из двух веток, двух верёвок и кремня, а пойманную рыбу жарят на костре.": "Вудку роблять із двох гілок, двох мотузок і кременю, а спійману рибу смажать на багатті."
"Тушку зверька разделывают руками, а большую тушу — только ножом: с неё падают шкура, кости и жир.": "Тушку звірка розбирають руками, а велику тушу — лише ножем: з неї падають шкура, кістки й жир."
"На сушилке из шкуры и жира выделывают кожу, там же вялят мясо.": "На сушарці зі шкури й жиру вичинюють шкіру, там же в'ялять м'ясо."
"Лук и стрелы делают у верстака, а наконечник стрелы — из кремня или кости.": "Лук і стріли роблять біля верстака, а наконечник стріли — із кременю чи кістки."
"Бронзу плавят в горне из меди и олова, и в сумке должен быть тигель.": "Бронзу плавлять у горні з міді й олова, і в сумці має бути тигель."
"Железную руду плавят в крицу в сыродутной печи, а из крицы в горне получаются слитки.": "Залізну руду плавлять у крицю в сиродутній печі, а з криці в горні виходять зливки."
"Железные и стальные инструменты куют на наковальне.": "Залізні й сталеві інструменти кують на ковадлі."
"Из стеблей льна прядут нить, а на ткацком станке ткут из неё ткань.": "Зі стебел льону прядуть нитку, а на ткацькому верстаті тчуть із неї тканину."
"Смолу выгоняют из брёвен в печи для обжига, и для этого нужен глиняный горшок.": "Смолу виганяють із колод у печі для випалу, і для цього потрібен глиняний горщик."
"Серебро, золото и платину плавят в горне, а на наковальне из слитков собирают блоки.": "Срібло, золото й платину плавлять у горні, а на ковадлі зі зливків збирають блоки."
"Отменить загрузку (Esc)": "Скасувати завантаження (Esc)"
"Мир готов": "Світ готовий"

