# content/core/data/eras.yaml
"Выживание без инструментов": "Виживання без інструментів"
"Сбор руками, ветки, волокно, камни, ягоды и грибы; простые вещи из них руками.": "Збір руками: гілки, волокно, каміння, ягоди й гриби; прості речі з них руками."
"Примитивные инструменты": "Примітивні інструменти"
"Верёвка, костёр, верстак, каменные и деревянные инструменты, брёвна и доски, сундук.": "Мотузка, багаття, верстак, кам'яні й дерев'яні інструменти, колоди й дошки, скриня."
"Дерево, кости и кожа": "Дерево, кістки й шкіра"
"Разделка зверей, сушилка, кожа из шкуры с жиром, костяные игла и клей, свеча, луки и праща, ткань.": "Оброблення звірів, сушарка, шкіра зі шкури з жиром, кістяні голка й клей, свічка, луки й праща, тканина."
"Керамика и ранняя металлургия": "Кераміка й рання металургія"
"Печь для обжига, кирпич, уголь, горн, медь и медные инструменты.": "Піч для випалу, цегла, вугілля, горно, мідь і мідні інструменти."
"Бронза": "Бронза"
"Олово, тигель, бронзовый сплав и бронзовые инструменты, которые берут железную руду.": "Олово, тигель, бронзовий сплав і бронзові інструменти, що беруть залізну руду."
"Железо": "Залізо"
"Железная руда, сыродутная печь и крица, железные слитки, наковальня и железные инструменты.": "Залізна руда, сиродутна піч і криця, залізні зливки, ковадло й залізні інструменти."
"Сталь": "Сталь"
"Сталь из железа с углём в тигле и стальные инструменты.": "Сталь із заліза з вугіллям у тиглі й сталеві інструменти."

