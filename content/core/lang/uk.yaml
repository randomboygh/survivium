"Прозрачным становится только то, что перед игроком и не ниже линии: 0 — по ногам, +1 — по пояс, +2 — по голову. Срезы впереди — вертикальные слои по клетке, уровни сверху считаются от линии, берётся более прозрачное. Первые слои рисуются с плотностью первых, следующие за ними тают за «растяжение» слоёв.": "Прозорим стає лише те, що перед гравцем і не нижче лінії: 0 — по ногах, +1 — по пояс, +2 — по голову. Зрізи попереду — вертикальні шари по клітинці, рівні зверху рахуються від лінії, береться прозоріше. Перші шари малюються зі щільністю перших, наступні за ними тануть за «розтягнення» шарів."
