# content/core/data/skills.yaml
"[core.skills.gathering]": "Збір"
"[core.skills.gathering.about]": "Ягоди, трави, волокно, плоди й косіння. Швидше збирає, іноді бере на одну більше."
"[core.skills.chopping]": "Рубка"
"[core.skills.chopping.about]": "Дерева й кущі сокирою. Швидше рубає, менше втомлюється, іноді знімає зайву колоду."
"[core.skills.digging]": "Копання"
"[core.skills.digging.about]": "Земля, пісок, камінь і руда. Швидше копає. Викопати поставлене власноруч досвіду не дає."
"[core.skills.crafting]": "Ремесло"
"[core.skills.crafting.about]": "Речі в руках, біля верстака, печі й горна. Швидше робить, інструменти й одяг виходять міцнішими."
"[core.skills.building]": "Будівництво"
"[core.skills.building.about]": "Стіни, підлога, креслення й меблі. Швидше будує."
"[core.skills.cooking]": "Кулінарія"
"[core.skills.cooking.about]": "Смаження, юшка, хліб і все, що готують на вогні. Швидше готує, іноді порція виходить більшою."
"[core.skills.hunting]": "Полювання"
"[core.skills.hunting.about]": "Звірі зброєю й руками. Швидше й сильніше б'є, при розбиранні туші іноді виходить більше м'яса."
"[core.skills.fishing]": "Риболовля"
"[core.skills.fishing.about]": "Риба на вудку. Іноді витягує дві."
"[core.skills.swimming]": "Плавання"
"[core.skills.swimming.about]": "Росте, поки пливеш. Швидше пливе (потім і на плотах, човнах)."
"[core.skills.farming]": "Землеробство"
"[core.skills.farming.about]": "Грядки сапою, посів, полив і врожай. Швидше працює на грядках, іноді збирає на одну більше."

