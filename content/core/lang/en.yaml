# content/core/data/skills.yaml
"Сбор": "Forage"
"Ягоды, травы, волокно, плоды и покос. Быстрее собирает, иногда берёт на одну больше.": "Berries, herbs, fiber, fruit and mowing. Gathers faster, sometimes takes one more."
"Рубка": "Chop"
"Деревья и кусты топором. Быстрее рубит, тратит меньше сил, иногда снимает лишнее бревно.": "Trees and bushes with an axe. Chops faster, tires less, sometimes gets an extra log."
"Копание": "Dig"
"Земля, песок, камень и руда. Быстрее копает. Выкопать поставленное своими руками опыта не даёт.": "Earth, sand, stone and ore. Digs faster. Digging up what you placed yourself gives no experience."
"Ремесло": "Craft"
"Вещи на руках, у верстака, печи и горна. Быстрее делает, инструменты и одежда выходят прочнее.": "Things by hand, at the workbench, kiln and forge. Crafts faster; tools and clothes come out sturdier."
"Стены, пол, чертёж и мебель. Быстрее строит.": "Walls, floors, blueprints and furniture. Builds faster."
"Готовка": "Cook"
"Жарка, похлёбка, хлеб и всё, что готовят на огне. Быстрее готовит, иногда выходит порция больше.": "Roasting, stew, bread and everything cooked on fire. Cooks faster, sometimes makes a bigger portion."
"Охота": "Hunt"
"Звери оружием и руками. Быстрее и сильнее бьёт, при разделке туши иногда выходит больше мяса.": "Animals with weapons and bare hands. Strikes faster and harder; butchering sometimes gives more meat."
"Рыбалка": "Fish"
"Рыба на удочку. Иногда вытаскивает две.": "Fish with a rod. Sometimes pulls out two."
"Плавание": "Swim"
"Растёт, пока плывёшь. Быстрее плывёт (потом и на плотах, лодках).": "Grows while you swim. Swims faster (later on rafts and boats too)."
"Земледелие": "Farm"
"Грядки тяпкой, посев, полив и урожай. Быстрее работает на грядках, иногда собирает на одну больше.": "Beds with a hoe, sowing, watering and harvest. Works the beds faster, sometimes harvests one more."

