# src/client/ui/menu_loading.gd
"[fiber_comes_from_tall_grass]": "Fiber comes from tall grass, herbs and reeds; three fibers are twisted into a cord."
"[flint_turns_up_when_you]": "Flint turns up when you dig earth, sand and scree."
"[a_campfire_is_made_of]": "A campfire is made of five branches and five fibers; mushrooms, meat and fish are roasted on it."
"[a_recipe_becomes_known_once]": "A recipe becomes known once all its materials have been in your bag."
"[a_workbench_of_eight_branches]": "A workbench of eight branches and two cords: stone tools are made at it."
"[a_kiln_is_built_of]": "A kiln is built of stone and clay; bricks are fired and flatbreads baked in it."
"[ears_give_grain_and_grain]": "Ears give grain, and grain is ground into flour."
"[bandages_are_made_of_moss]": "Bandages are made of moss and fiber."
"[the_map_remembers_everything_you]": "The map remembers everything you have seen, and you can put marks on it."
"[the_level_buttons_by_the]": "The level buttons by the minimap cut the view: that way you see what's in a cave and under the treetops."
"[walking_against_the_wind_is]": "Walking against the wind is harder, and in a jump it blows you aside."
"[a_torch_of_a_branch]": "A torch of a branch and two fibers lights up the dark, but it burns down in time."
"[planks_are_made_from_a]": "Planks are made from a log at the workbench if there is an axe in the bag."
"[copper_ore_is_mined_with]": "Copper ore is mined with a pickaxe in stone veins, and ingots are smelted in a forge from ore and charcoal."
"[charcoal_is_burned_from_logs]": "Charcoal is burned from logs in a kiln."
"[a_chest_of_six_planks]": "A chest of six planks keeps what doesn't fit in the bag."
"[jumping_swimming_and_work_use]": "Jumping, swimming and work use up strength, and it comes back at rest."
"[a_hungry_body_cant_fully]": "A hungry body can't fully recover: eat berries, mushrooms, meat and flatbreads."
"[with_a_heavy_bag_you]": "With a heavy bag you walk slower: leave the extra in a chest."
"[without_strength_you_start_to]": "Without strength you start to sink in water: don't swim too far."
"[a_burning_campfire_scorches_and]": "A burning campfire scorches and pushes you back if you come too close."
"[after_death_your_things_stay]": "After death your things stay in a sack where you fell; it's marked on the map."
"[you_come_back_to_life]": "You come back to life at your campfire: set it up near your home."
"[acorns_cones_and_seeds_can]": "Acorns, cones and seeds can be planted, and trees and herbs grow from them."
"[grass_is_cut_by_hand]": "Grass is cut by hand, with a sword or a scythe, and fiber falls from it."
"[the_camera_can_be_turned]": "The camera can be turned with the buttons by the minimap and tilted to look behind trees."
"[in_the_settings_the_time]": "In the settings, the time of day, the season and the weather can follow real life."
"[a_fishing_rod_is_made]": "A fishing rod is made of two branches, two cords and flint, and the fish you catch are roasted on a campfire."
"[a_small_animals_carcass_is]": "A small animal's carcass is butchered by hand, and a big one only with a knife: it gives hide, bones and fat."
"[leather_is_made_from_hide]": "Leather is made from hide and fat on a drying rack, and meat is dried there too."
"[bows_and_arrows_are_made]": "Bows and arrows are made at the workbench, and an arrowhead from flint or bone."
"[bronze_is_smelted_in_a]": "Bronze is smelted in a forge from copper and tin, and there must be a crucible in the bag."
"[iron_ore_is_smelted_into]": "Iron ore is smelted into a bloom in a bloomery, and the forge turns the bloom into ingots."
"[iron_and_steel_tools_are]": "Iron and steel tools are forged on an anvil."
"[thread_is_spun_from_flax]": "Thread is spun from flax stems, and cloth is woven from it on a loom."
"[tar_is_drawn_from_logs]": "Tar is drawn from logs in a kiln, and that needs a clay pot."
"[silver_gold_and_platinum_are]": "Silver, gold and platinum are smelted in a forge, and blocks are made from ingots on an anvil."
"[cancel_loading_esc]": "Cancel loading (Esc)"
"[the_world_is_ready]": "The world is ready"

