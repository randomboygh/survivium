# src/client/ui/menu_loading.gd
"Волокно дают высокая трава, травы и тростник; из трёх волокон скручивают верёвку.": "Fiber comes from tall grass, herbs and reeds; three fibers are twisted into a cord."
"Кремень попадается, когда копаешь землю, песок и осыпь.": "Flint turns up when you dig earth, sand and scree."
"Костёр складывают из пяти веток и пяти волокон, на нём жарят грибы, мясо и рыбу.": "A campfire is made of five branches and five fibers; mushrooms, meat and fish are roasted on it."
"Рецепт становится известен, когда в сумке побывали все его материалы.": "A recipe becomes known once all its materials have been in your bag."
"Верстак из восьми веток и двух верёвок: у него делают каменные инструменты.": "A workbench of eight branches and two cords: stone tools are made at it."
"Печь для обжига складывают из камня и глины, в ней обжигают кирпичи и пекут лепёшки.": "A kiln is built of stone and clay; bricks are fired and flatbreads baked in it."
"Колоски дают зерно, а из зерна мелют муку.": "Ears give grain, and grain is ground into flour."
"Из мха и волокна делают бинты.": "Bandages are made of moss and fiber."
"Карта помнит всё, что вы видели, и на ней можно ставить метки.": "The map remembers everything you have seen, and you can put marks on it."
"Кнопки уровня у миникарты срезают вид: так видно, что в пещере и под кронами.": "The level buttons by the minimap cut the view: that way you see what's in a cave and under the treetops."
"Против ветра идти тяжелее, а в прыжке он сносит в сторону.": "Walking against the wind is harder, and in a jump it blows you aside."
"Факел из ветки и двух волокон светит в темноте, но со временем догорает.": "A torch of a branch and two fibers lights up the dark, but it burns down in time."
"Доски делают у верстака из бревна, если в сумке есть топор.": "Planks are made from a log at the workbench if there is an axe in the bag."
"Медную руду бьют киркой в жилах камня, а слитки плавят в горне из руды и угля.": "Copper ore is mined with a pickaxe in stone veins, and ingots are smelted in a forge from ore and charcoal."
"Уголь выжигают из брёвен в печи для обжига.": "Charcoal is burned from logs in a kiln."
"Сундук из шести досок хранит вещи, которые не помещаются в сумку.": "A chest of six planks keeps what doesn't fit in the bag."
"Прыжки, плавание и работа тратят силы, а в покое они возвращаются.": "Jumping, swimming and work use up strength, and it comes back at rest."
"Голодному не восстановить силы полностью: ешьте ягоды, грибы, мясо и лепёшки.": "A hungry body can't fully recover: eat berries, mushrooms, meat and flatbreads."
"С тяжёлой сумкой идёшь медленнее: лишнее можно оставить в сундуке.": "With a heavy bag you walk slower: leave the extra in a chest."
"Без сил в воде начинаешь тонуть: далеко не заплывайте.": "Without strength you start to sink in water: don't swim too far."
"Горящий костёр обжигает и отбрасывает, если подойти вплотную.": "A burning campfire scorches and pushes you back if you come too close."
"После смерти вещи остаются в мешке на месте гибели, он отмечен на карте.": "After death your things stay in a sack where you fell; it's marked on the map."
"Возвращаешься к жизни у своего костра: поставьте его рядом с домом.": "You come back to life at your campfire: set it up near your home."
"Жёлуди, шишки и семена можно посадить, и из них вырастут деревья и травы.": "Acorns, cones and seeds can be planted, and trees and herbs grow from them."
"Траву срезают руками, мечом или косой, и с неё падает волокно.": "Grass is cut by hand, with a sword or a scythe, and fiber falls from it."
"Камеру можно повернуть кнопками у миникарты и наклонить, чтобы заглянуть за деревья.": "The camera can be turned with the buttons by the minimap and tilted to look behind trees."
"В настройках время суток, сезон и погоду можно сделать как в жизни.": "In the settings, the time of day, the season and the weather can follow real life."
"Удочку делают из двух веток, двух верёвок и кремня, а пойманную рыбу жарят на костре.": "A fishing rod is made of two branches, two cords and flint, and the fish you catch are roasted on a campfire."
"Тушку зверька разделывают руками, а большую тушу — только ножом: с неё падают шкура, кости и жир.": "A small animal's carcass is butchered by hand, and a big one only with a knife: it gives hide, bones and fat."
"На сушилке из шкуры и жира выделывают кожу, там же вялят мясо.": "Leather is made from hide and fat on a drying rack, and meat is dried there too."
"Лук и стрелы делают у верстака, а наконечник стрелы — из кремня или кости.": "Bows and arrows are made at the workbench, and an arrowhead from flint or bone."
"Бронзу плавят в горне из меди и олова, и в сумке должен быть тигель.": "Bronze is smelted in a forge from copper and tin, and there must be a crucible in the bag."
"Железную руду плавят в крицу в сыродутной печи, а из крицы в горне получаются слитки.": "Iron ore is smelted into a bloom in a bloomery, and the forge turns the bloom into ingots."
"Железные и стальные инструменты куют на наковальне.": "Iron and steel tools are forged on an anvil."
"Из стеблей льна прядут нить, а на ткацком станке ткут из неё ткань.": "Thread is spun from flax stems, and cloth is woven from it on a loom."
"Смолу выгоняют из брёвен в печи для обжига, и для этого нужен глиняный горшок.": "Tar is drawn from logs in a kiln, and that needs a clay pot."
"Серебро, золото и платину плавят в горне, а на наковальне из слитков собирают блоки.": "Silver, gold and platinum are smelted in a forge, and blocks are made from ingots on an anvil."
"Отменить загрузку (Esc)": "Cancel loading (Esc)"
"Мир готов": "The world is ready"

