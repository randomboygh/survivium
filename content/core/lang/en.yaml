# content/core/data/skills.yaml
"[core.skills.gathering]": "Forage"
"[core.skills.gathering.about]": "Berries, herbs, fiber, fruit and mowing. Gathers faster, sometimes takes one more."
"[core.skills.chopping]": "Chopping"
"[core.skills.chopping.about]": "Trees and bushes with an axe. Chops faster, tires less, sometimes gets an extra log."
"[core.skills.digging]": "Digging"
"[core.skills.digging.about]": "Earth, sand, stone and ore. Digs faster. Digging up what you placed yourself gives no experience."
"[core.skills.crafting]": "Craftsmanship"
"[core.skills.crafting.about]": "Things by hand, at the workbench, kiln and forge. Crafts faster; tools and clothes come out sturdier."
"[core.skills.building]": "Building"
"[core.skills.building.about]": "Walls, floors, blueprints and furniture. Builds faster."
"[core.skills.cooking]": "Cook"
"[core.skills.cooking.about]": "Roasting, stew, bread and everything cooked on fire. Cooks faster, sometimes makes a bigger portion."
"[core.skills.hunting]": "Hunt"
"[core.skills.hunting.about]": "Animals with weapons and bare hands. Strikes faster and harder; butchering sometimes gives more meat."
"[core.skills.fishing]": "Fishing"
"[core.skills.fishing.about]": "Fish with a rod. Sometimes pulls out two."
"[core.skills.swimming]": "Swim"
"[core.skills.swimming.about]": "Grows while you swim. Swims faster (later on rafts and boats too)."
"[core.skills.farming]": "Farm"
"[core.skills.farming.about]": "Beds with a hoe, sowing, watering and harvest. Works the beds faster, sometimes harvests one more."

