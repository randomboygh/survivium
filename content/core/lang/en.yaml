# content/core/data/eras.yaml
"Выживание без инструментов": "Survival without tools"
"Сбор руками, ветки, волокно, камни, ягоды и грибы; простые вещи из них руками.": "Gathering by hand: branches, fiber, stones, berries and mushrooms; simple things made from them by hand."
"Примитивные инструменты": "Primitive tools"
"Верёвка, костёр, верстак, каменные и деревянные инструменты, брёвна и доски, сундук.": "Cord, campfire, workbench, stone and wooden tools, logs and planks, chest."
"Дерево, кости и кожа": "Wood, bone and leather"
"Разделка зверей, сушилка, кожа из шкуры с жиром, костяные игла и клей, свеча, луки и праща, ткань.": "Butchering, drying rack, leather from hide and fat, bone needle and glue, candle, bows and sling, cloth."
"Керамика и ранняя металлургия": "Pottery and early metalworking"
"Печь для обжига, кирпич, уголь, горн, медь и медные инструменты.": "Kiln, brick, charcoal, forge, copper and copper tools."
"Бронза": "Bronze"
"Олово, тигель, бронзовый сплав и бронзовые инструменты, которые берут железную руду.": "Tin, crucible, bronze alloy and bronze tools that can mine iron ore."
"Железо": "Iron"
"Железная руда, сыродутная печь и крица, железные слитки, наковальня и железные инструменты.": "Iron ore, bloomery and bloom, iron ingots, anvil and iron tools."
"Сталь": "Steel"
"Сталь из железа с углём в тигле и стальные инструменты.": "Steel from iron and charcoal in a crucible, and steel tools."

