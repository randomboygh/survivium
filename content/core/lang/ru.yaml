# src/client/ui/menu_loading.gd
"[fiber_comes_from_tall_grass]": "Волокно дают высокая трава, травы и тростник; из трёх волокон скручивают верёвку."
"[flint_turns_up_when_you]": "Кремень попадается, когда копаешь землю, песок и осыпь."
"[a_campfire_is_made_of]": "Костёр складывают из пяти веток и пяти волокон, на нём жарят грибы, мясо и рыбу."
"[a_recipe_becomes_known_once]": "Рецепт становится известен, когда в сумке побывали все его материалы."
"[a_workbench_of_eight_branches]": "Верстак из восьми веток и двух верёвок: у него делают каменные инструменты."
"[a_kiln_is_built_of]": "Печь для обжига складывают из камня и глины, в ней обжигают кирпичи и пекут лепёшки."
"[ears_give_grain_and_grain]": "Колоски дают зерно, а из зерна мелют муку."
"[bandages_are_made_of_moss]": "Из мха и волокна делают бинты."
"[the_map_remembers_everything_you]": "Карта помнит всё, что вы видели, и на ней можно ставить метки."
"[the_level_buttons_by_the]": "Кнопки уровня у миникарты срезают вид: так видно, что в пещере и под кронами."
"[walking_against_the_wind_is]": "Против ветра идти тяжелее, а в прыжке он сносит в сторону."
"[a_torch_of_a_branch]": "Факел из ветки и двух волокон светит в темноте, но со временем догорает."
"[planks_are_made_from_a]": "Доски делают у верстака из бревна, если в сумке есть топор."
"[copper_ore_is_mined_with]": "Медную руду бьют киркой в жилах камня, а слитки плавят в горне из руды и угля."
"[charcoal_is_burned_from_logs]": "Уголь выжигают из брёвен в печи для обжига."
"[a_chest_of_six_planks]": "Сундук из шести досок хранит вещи, которые не помещаются в сумку."
"[jumping_swimming_and_work_use]": "Прыжки, плавание и работа тратят силы, а в покое они возвращаются."
"[a_hungry_body_cant_fully]": "Голодному не восстановить силы полностью: ешьте ягоды, грибы, мясо и лепёшки."
"[with_a_heavy_bag_you]": "С тяжёлой сумкой идёшь медленнее: лишнее можно оставить в сундуке."
"[without_strength_you_start_to]": "Без сил в воде начинаешь тонуть: далеко не заплывайте."
"[a_burning_campfire_scorches_and]": "Горящий костёр обжигает и отбрасывает, если подойти вплотную."
"[after_death_your_things_stay]": "После смерти вещи остаются в мешке на месте гибели, он отмечен на карте."
"[you_come_back_to_life]": "Вы возрождаетесь в своей последней кровати, а если её нет, у своего костра: поставьте их рядом с домом."
"[acorns_cones_and_seeds_can]": "Жёлуди, шишки и семена можно посадить, и из них вырастут деревья и травы."
"[grass_is_cut_by_hand]": "Траву срезают руками, мечом или косой, и с неё падает волокно."
"[the_camera_can_be_turned]": "Камеру можно повернуть кнопками у миникарты и наклонить, чтобы заглянуть за деревья."
"[in_the_settings_the_time]": "В настройках время суток, сезон и погоду можно сделать как в жизни."
"[a_fishing_rod_is_made]": "Удочку делают из двух веток, двух верёвок и кремня, а пойманную рыбу жарят на костре."
"[a_small_animals_carcass_is]": "Тушку зверька разделывают руками, а большую тушу — только ножом: с неё падают шкура, кости и жир."
"[leather_is_made_from_hide]": "На сушилке из шкуры и жира выделывают кожу, там же вялят мясо."
"[bows_and_arrows_are_made]": "Лук и стрелы делают у верстака, а наконечник стрелы — из кремня или кости."
"[bronze_is_smelted_in_a]": "Бронзу плавят в горне из меди и олова, и в сумке должен быть тигель."
"[iron_ore_is_smelted_into]": "Железную руду плавят в крицу в сыродутной печи, а из крицы в горне получаются слитки."
"[iron_and_steel_tools_are]": "Железные и стальные инструменты куют на наковальне."
"[thread_is_spun_from_flax]": "Из стеблей льна прядут нить, а на ткацком станке ткут из неё ткань."
"[tar_is_drawn_from_logs]": "Смолу выгоняют из брёвен в печи для обжига, и для этого нужен глиняный горшок."
"[silver_gold_and_platinum_are]": "Серебро, золото и платину плавят в горне, а на наковальне из слитков собирают блоки."
"[in_build_mode_a_tap_sets]": "В режиме строительства касание ставит вещь или поднимает её; удержание приподнимает, отпускание ставит на место, двойное касание поворачивает."
"[stairs_and_slopes_of_a]": "Лестницы и скаты чертежа поднимаются от места начала до выбранной высоты; у квадрата две лестницы идут к дальнему углу."
"[the_build_button_raises_the]": "Кнопка постройки возводит весь чертёж поблизости: сначала копает лучшим инструментом из сумки, затем заполняет блоками из неё."
"[a_hoe_turns_grass_into]": "Мотыга превращает траву в грядку; полейте её из лейки или дождитесь дождя: урожай растёт только на мокрой грядке в тёплые сезоны, а зимой гибнет."
"[in_garden_mode_you_mark]": "В режиме «Огород» вы отмечаете, где копать грядки, сеять, поливать и жать, затем нажимаете «Работать», и руки делают всё сами."
"[fish_swim_at_different_depths]": "Рыба плавает на разной глубине и уходит вглубь, если её спугнуть: стойте спокойно, и поплавок приманит её наверх."
"[in_winter_cut_a_hole]": "Зимой прорубите лунку во льду над глубокой водой ледорубом или ледобуром и закиньте в неё удочку."
"[a_boat_is_made_of]": "Лодка делается из досок и смолы на верстаке, а вёсла из досок; течение рек сносит и лодку."
"[a_woven_pouch_a_leather]": "Плетёная сумка, кожаная сумка и холщовый рюкзак, надетые на спину, добавляют к сумке 8, 16 и 24 ячейки."
"[a_boundary_post_claims_land]": "Межевой столб закрепляет землю за вами или вашей командой: чужие там не строят и не берут, а брошенная земля со временем разрушается."
"[to_play_with_friends_choose]": "Чтобы играть с друзьями, выберите «Мультиплеер» → «Создать сервер» и отправьте им показанную ссылку."
"[the_testing_tab_sets_the]": "Вкладка «Тестирование» задаёт время, погоду и температуру вручную и может сделать вас неуязвимым; «Сохранить» запоминает выбор."
"[white_fog_at_the_edge]": "Белый туман на краю обзора значит, что мир там ещё строится; после дальнего прыжка подождите немного, и он растает."
"[a_bed_of_planks_and]": "Кровать из досок и ткани делается на верстаке; сон под крышей восстанавливает больше, а когда на сервере спят все, ночь идёт быстрее."
"[rain_and_snow_make_you]": "Дождь и снег мочат и холодят: обсохните у огня, ведь на морозе холод ранит."
"[a_fall_from_higher_than]": "Падение с высоты больше шести уровней ранит; вода глубиной в две клетки гасит его полностью."
"[a_poultice_of_moss_and]": "Припарка из мха и бинта, сделанная у костра, лечит со временем."
"[hold_the_food_an_animal]": "Держите в руке еду, которую любит зверь, и он не убежит; прирученный зверь ходит за вами."
"[a_clay_pot_fired_in]": "Глиняный горшок, обожжённый в печи, позволяет готовить у костра жареные жёлуди и чай из примулы."
"[fur_and_leather_clothes_made]": "Меховая и кожаная одежда, сшитая на верстаке иглой, согревает в холод."
"[invite_a_player_to_your]": "Пригласите игрока в свою команду: товарищи делят права на землю и возрождаются у костров команды."
"[steel_is_made_of_an]": "Сталь делается в сыродутной печи из железного слитка и угля, и в сумке должен быть тигель."
"[when_cold_you_dont_heal]": "Когда вам холодно, здоровье не восстанавливается, а отдых идёт медленнее; в сильную жару силы восстанавливаются не полностью."
"[cancel_loading_esc]": "Отменить загрузку (Esc)"
"[the_world_is_ready]": "Мир готов"

