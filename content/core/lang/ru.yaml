"[core.eras.bronze.about]": "Печь для обжига, кирпич, уголь, горн, медь и медные инструменты."
"[core.eras.alloy]": "Бронза"
"[core.eras.alloy.about]": "Олово, тигель, бронзовый сплав и бронзовые инструменты, которые берут железную руду."
"[core.eras.iron]": "Железо"
