# content/core/data/skills.yaml
"[core.skills.gathering]": "Сбор"
"[core.skills.gathering.about]": "Ягоды, травы, волокно, плоды и покос. Быстрее собирает, иногда берёт на одну больше."
"[core.skills.chopping]": "Рубка"
"[core.skills.chopping.about]": "Деревья и кусты топором. Быстрее рубит, тратит меньше сил, иногда снимает лишнее бревно."
"[core.skills.digging]": "Копание"
"[core.skills.digging.about]": "Земля, песок, камень и руда. Быстрее копает. Выкопать поставленное своими руками опыта не даёт."
"[core.skills.crafting]": "Ремесло"
"[core.skills.crafting.about]": "Вещи на руках, у верстака, печи и горна. Быстрее делает, инструменты и одежда выходят прочнее."
"[core.skills.building]": "Стройка"
"[core.skills.building.about]": "Стены, пол, чертёж и мебель. Быстрее строит."
"[core.skills.cooking]": "Готовка"
"[core.skills.cooking.about]": "Жарка, похлёбка, хлеб и всё, что готовят на огне. Быстрее готовит, иногда выходит порция больше."
"[core.skills.hunting]": "Охота"
"[core.skills.hunting.about]": "Звери оружием и руками. Быстрее и сильнее бьёт, при разделке туши иногда выходит больше мяса."
"[core.skills.fishing]": "Рыбалка"
"[core.skills.fishing.about]": "Рыба на удочку. Иногда вытаскивает две."
"[core.skills.swimming]": "Плавание"
"[core.skills.swimming.about]": "Растёт, пока плывёшь. Быстрее плывёт (потом и на плотах, лодках)."
"[core.skills.farming]": "Земледелие"
"[core.skills.farming.about]": "Грядки тяпкой, посев, полив и урожай. Быстрее работает на грядках, иногда собирает на одну больше."

