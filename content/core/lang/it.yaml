"Прозрачным становится только то, что перед игроком и не ниже линии: 0 — по ногам, +1 — по пояс, +2 — по голову. Срезы впереди — вертикальные слои по клетке, уровни сверху считаются от линии, берётся более прозрачное. Первые слои рисуются с плотностью первых, следующие за ними тают за «растяжение» слоёв.": "Diventa trasparente solo ciò che è davanti al giocatore e non sotto la linea: 0 — ai piedi, +1 — alla vita, +2 — alla testa. I tagli davanti sono strati verticali di una cella, i livelli sopra si contano dalla linea, vince il più trasparente. I primi strati si disegnano con la densità dei primi, quelli dopo sfumano lungo l'«allungamento»."
