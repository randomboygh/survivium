# content/core/data/skills.yaml
"Сбор": "Raccolta"
"Ягоды, травы, волокно, плоды и покос. Быстрее собирает, иногда берёт на одну больше.": "Bacche, erbe, fibra, frutti e falciatura. Raccoglie più in fretta, a volte ne prende uno in più."
"Рубка": "Taglio"
"Деревья и кусты топором. Быстрее рубит, тратит меньше сил, иногда снимает лишнее бревно.": "Alberi e cespugli con l'ascia. Taglia più in fretta, si stanca meno, a volte ricava un tronco in più."
"Копание": "Scavo"
"Земля, песок, камень и руда. Быстрее копает. Выкопать поставленное своими руками опыта не даёт.": "Terra, sabbia, pietra e minerale. Scava più in fretta. Scavare ciò che hai posato tu non dà esperienza."
"Ремесло": "Mestiere"
"Вещи на руках, у верстака, печи и горна. Быстрее делает, инструменты и одежда выходят прочнее.": "Oggetti a mano, al banco, alla fornace e alla forgia. Crea più in fretta; attrezzi e vestiti più robusti."
"Стены, пол, чертёж и мебель. Быстрее строит.": "Muri, pavimenti, progetti e mobili. Costruisce più in fretta."
"Готовка": "Cucina"
"Жарка, похлёбка, хлеб и всё, что готовят на огне. Быстрее готовит, иногда выходит порция больше.": "Arrosti, zuppa, pane e tutto ciò che si cuoce sul fuoco. Cucina più in fretta, a volte una porzione più grande."
"Охота": "Caccia"
"Звери оружием и руками. Быстрее и сильнее бьёт, при разделке туши иногда выходит больше мяса.": "Animali con armi e a mani nude. Colpisce più in fretta e più forte; macellando a volte esce più carne."
"Рыбалка": "Pesca"
"Рыба на удочку. Иногда вытаскивает две.": "Pesci con la canna. A volte ne tira su due."
"Плавание": "Nuoto"
"Растёт, пока плывёшь. Быстрее плывёт (потом и на плотах, лодках).": "Cresce mentre nuoti. Nuota più in fretta (poi anche su zattere e barche)."
"Земледелие": "Coltura"
"Грядки тяпкой, посев, полив и урожай. Быстрее работает на грядках, иногда собирает на одну больше.": "Aiuole con la zappa, semina, irrigazione e raccolto. Lavora le aiuole più in fretta, a volte raccoglie uno in più."

