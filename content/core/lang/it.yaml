# src/client/ui/menu_loading.gd
"Волокно дают высокая трава, травы и тростник; из трёх волокон скручивают верёвку.": "La fibra viene dall'erba alta, dalle erbe e dalle canne; tre fibre si torcono in una corda."
"Кремень попадается, когда копаешь землю, песок и осыпь.": "La selce salta fuori scavando terra, sabbia e ghiaione."
"Костёр складывают из пяти веток и пяти волокон, на нём жарят грибы, мясо и рыбу.": "Un falò si fa con cinque rami e cinque fibre; ci si arrostiscono funghi, carne e pesce."
"Рецепт становится известен, когда в сумке побывали все его материалы.": "Una ricetta diventa nota quando tutti i suoi materiali sono stati nella tua borsa."
"Верстак из восьми веток и двух верёвок: у него делают каменные инструменты.": "Un banco da lavoro di otto rami e due corde: ci si fanno attrezzi di pietra."
"Печь для обжига складывают из камня и глины, в ней обжигают кирпичи и пекут лепёшки.": "Una fornace si costruisce con pietra e argilla; ci si cuociono mattoni e focacce."
"Колоски дают зерно, а из зерна мелют муку.": "Le spighe danno grano, e il grano si macina in farina."
"Из мха и волокна делают бинты.": "Le bende si fanno con muschio e fibra."
"Карта помнит всё, что вы видели, и на ней можно ставить метки.": "La mappa ricorda tutto ciò che hai visto, e ci puoi mettere dei segni."
"Кнопки уровня у миникарты срезают вид: так видно, что в пещере и под кронами.": "I pulsanti di livello accanto alla minimappa tagliano la vista: così vedi cosa c'è in una grotta e sotto le chiome."
"Против ветра идти тяжелее, а в прыжке он сносит в сторону.": "Camminare controvento è più faticoso, e nel salto ti spinge di lato."
"Факел из ветки и двух волокон светит в темноте, но со временем догорает.": "Una torcia di un ramo e due fibre illumina il buio, ma col tempo si consuma."
"Доски делают у верстака из бревна, если в сумке есть топор.": "Le assi si fanno da un tronco al banco se nella borsa c'è un'ascia."
"Медную руду бьют киркой в жилах камня, а слитки плавят в горне из руды и угля.": "Il minerale di rame si estrae col piccone nelle vene di pietra, e i lingotti si fondono nella forgia con minerale e carbone."
"Уголь выжигают из брёвен в печи для обжига.": "Il carbone si ottiene bruciando tronchi nella fornace."
"Сундук из шести досок хранит вещи, которые не помещаются в сумку.": "Un baule di sei assi tiene ciò che non entra nella borsa."
"Прыжки, плавание и работа тратят силы, а в покое они возвращаются.": "Saltare, nuotare e lavorare consumano forze, che tornano a riposo."
"Голодному не восстановить силы полностью: ешьте ягоды, грибы, мясо и лепёшки.": "A stomaco vuoto non ti riprendi del tutto: mangia bacche, funghi, carne e focacce."
"С тяжёлой сумкой идёшь медленнее: лишнее можно оставить в сундуке.": "Con la borsa pesante cammini più piano: lascia il superfluo in un baule."
"Без сил в воде начинаешь тонуть: далеко не заплывайте.": "Senza forze inizi ad affondare: non nuotare troppo lontano."
"Горящий костёр обжигает и отбрасывает, если подойти вплотную.": "Un falò acceso scotta e respinge se ti avvicini troppo."
"После смерти вещи остаются в мешке на месте гибели, он отмечен на карте.": "Dopo la morte le tue cose restano in un sacco dove sei caduto; è segnato sulla mappa."
"Возвращаешься к жизни у своего костра: поставьте его рядом с домом.": "Torni in vita al tuo falò: mettilo vicino a casa."
"Жёлуди, шишки и семена можно посадить, и из них вырастут деревья и травы.": "Ghiande, pigne e semi si possono piantare, e ne crescono alberi ed erbe."
"Траву срезают руками, мечом или косой, и с неё падает волокно.": "L'erba si taglia a mano, con la spada o con la falce, e ne cade fibra."
"Камеру можно повернуть кнопками у миникарты и наклонить, чтобы заглянуть за деревья.": "La telecamera si ruota con i pulsanti accanto alla minimappa e si inclina per guardare dietro gli alberi."
"В настройках время суток, сезон и погоду можно сделать как в жизни.": "Nelle impostazioni ora del giorno, stagione e meteo possono seguire la vita reale."
"Удочку делают из двух веток, двух верёвок и кремня, а пойманную рыбу жарят на костре.": "Una canna da pesca si fa con due rami, due corde e una selce, e i pesci presi si arrostiscono sul falò."
"Тушку зверька разделывают руками, а большую тушу — только ножом: с неё падают шкура, кости и жир.": "Una carcassa piccola si macella a mano, una grande solo col coltello: dà pelle, ossa e grasso."
"На сушилке из шкуры и жира выделывают кожу, там же вялят мясо.": "Il cuoio si fa da pelle e grasso sull'essiccatoio, dove si essicca anche la carne."
"Лук и стрелы делают у верстака, а наконечник стрелы — из кремня или кости.": "Archi e frecce si fanno al banco, e la punta di freccia di selce o d'osso."
"Бронзу плавят в горне из меди и олова, и в сумке должен быть тигель.": "Il bronzo si fonde nella forgia con rame e stagno, e nella borsa serve un crogiolo."
"Железную руду плавят в крицу в сыродутной печи, а из крицы в горне получаются слитки.": "Il minerale di ferro si fonde in massello in un basso fuoco, e la forgia trasforma il massello in lingotti."
"Железные и стальные инструменты куют на наковальне.": "Gli attrezzi di ferro e d'acciaio si forgiano sull'incudine."
"Из стеблей льна прядут нить, а на ткацком станке ткут из неё ткань.": "Dagli steli di lino si fila il filo, e al telaio se ne tesse stoffa."
"Смолу выгоняют из брёвен в печи для обжига, и для этого нужен глиняный горшок.": "Il catrame si ricava dai tronchi nella fornace, e per farlo serve una pentola di terracotta."
"Серебро, золото и платину плавят в горне, а на наковальне из слитков собирают блоки.": "Argento, oro e platino si fondono nella forgia, e sull'incudine si fanno blocchi dai lingotti."
"Отменить загрузку (Esc)": "Annulla il caricamento (Esc)"
