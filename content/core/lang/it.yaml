# content/core/data/skills.yaml
"[core.skills.gathering]": "Raccolta"
"[core.skills.gathering.about]": "Bacche, erbe, fibra, frutti e falciatura. Raccoglie più in fretta, a volte ne prende uno in più."
"[core.skills.chopping]": "Taglio"
"[core.skills.chopping.about]": "Alberi e cespugli con l'ascia. Taglia più in fretta, si stanca meno, a volte ricava un tronco in più."
"[core.skills.digging]": "Scavo"
"[core.skills.digging.about]": "Terra, sabbia, pietra e minerale. Scava più in fretta. Scavare ciò che hai posato tu non dà esperienza."
"[core.skills.crafting]": "Mestiere"
"[core.skills.crafting.about]": "Oggetti a mano, al banco, alla fornace e alla forgia. Crea più in fretta; attrezzi e vestiti più robusti."
"[core.skills.building]": "Costruzione"
"[core.skills.building.about]": "Muri, pavimenti, progetti e mobili. Costruisce più in fretta."
"[core.skills.cooking]": "Cucina"
"[core.skills.cooking.about]": "Arrosti, zuppa, pane e tutto ciò che si cuoce sul fuoco. Cucina più in fretta, a volte una porzione più grande."
"[core.skills.hunting]": "Caccia"
"[core.skills.hunting.about]": "Animali con armi e a mani nude. Colpisce più in fretta e più forte; macellando a volte esce più carne."
"[core.skills.fishing]": "Pesca"
"[core.skills.fishing.about]": "Pesci con la canna. A volte ne tira su due."
"[core.skills.swimming]": "Nuoto"
"[core.skills.swimming.about]": "Cresce mentre nuoti. Nuota più in fretta (poi anche su zattere e barche)."
"[core.skills.farming]": "Coltura"
"[core.skills.farming.about]": "Aiuole con la zappa, semina, irrigazione e raccolto. Lavora le aiuole più in fretta, a volte raccoglie uno in più."

