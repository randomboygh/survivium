# src/client/ui/menu_loading.gd
"[fiber_comes_from_tall_grass]": "La fibra viene dall'erba alta, dalle erbe e dalle canne; tre fibre si torcono in una corda."
"[flint_turns_up_when_you]": "La selce salta fuori scavando terra, sabbia e ghiaione."
"[a_campfire_is_made_of]": "Un falò si fa con cinque rami e cinque fibre; ci si arrostiscono funghi, carne e pesce."
"[a_recipe_becomes_known_once]": "Una ricetta diventa nota quando tutti i suoi materiali sono stati nella tua borsa."
"[a_workbench_of_eight_branches]": "Un banco da lavoro di otto rami e due corde: ci si fanno attrezzi di pietra."
"[a_kiln_is_built_of]": "Una fornace si costruisce con pietra e argilla; ci si cuociono mattoni e focacce."
"[ears_give_grain_and_grain]": "Le spighe danno grano, e il grano si macina in farina."
"[bandages_are_made_of_moss]": "Le bende si fanno con muschio e fibra."
"[the_map_remembers_everything_you]": "La mappa ricorda tutto ciò che hai visto, e ci puoi mettere dei segni."
"[the_level_buttons_by_the]": "I pulsanti di livello accanto alla minimappa tagliano la vista: così vedi cosa c'è in una grotta e sotto le chiome."
"[walking_against_the_wind_is]": "Camminare controvento è più faticoso, e nel salto ti spinge di lato."
"[a_torch_of_a_branch]": "Una torcia di un ramo e due fibre illumina il buio, ma col tempo si consuma."
"[planks_are_made_from_a]": "Le assi si fanno da un tronco al banco se nella borsa c'è un'ascia."
"[copper_ore_is_mined_with]": "Il minerale di rame si estrae col piccone nelle vene di pietra, e i lingotti si fondono nella forgia con minerale e carbone."
"[charcoal_is_burned_from_logs]": "Il carbone si ottiene bruciando tronchi nella fornace."
"[a_chest_of_six_planks]": "Un baule di sei assi tiene ciò che non entra nella borsa."
"[jumping_swimming_and_work_use]": "Saltare, nuotare e lavorare consumano forze, che tornano a riposo."
"[a_hungry_body_cant_fully]": "A stomaco vuoto non ti riprendi del tutto: mangia bacche, funghi, carne e focacce."
"[with_a_heavy_bag_you]": "Con la borsa pesante cammini più piano: lascia il superfluo in un baule."
"[without_strength_you_start_to]": "Senza forze inizi ad affondare: non nuotare troppo lontano."
"[a_burning_campfire_scorches_and]": "Un falò acceso scotta e respinge se ti avvicini troppo."
"[after_death_your_things_stay]": "Dopo la morte le tue cose restano in un sacco dove sei caduto; è segnato sulla mappa."
"[you_come_back_to_life]": "Torni in vita al tuo falò: mettilo vicino a casa."
"[acorns_cones_and_seeds_can]": "Ghiande, pigne e semi si possono piantare, e ne crescono alberi ed erbe."
"[grass_is_cut_by_hand]": "L'erba si taglia a mano, con la spada o con la falce, e ne cade fibra."
"[the_camera_can_be_turned]": "La telecamera si ruota con i pulsanti accanto alla minimappa e si inclina per guardare dietro gli alberi."
"[in_the_settings_the_time]": "Nelle impostazioni ora del giorno, stagione e meteo possono seguire la vita reale."
"[a_fishing_rod_is_made]": "Una canna da pesca si fa con due rami, due corde e una selce, e i pesci presi si arrostiscono sul falò."
"[a_small_animals_carcass_is]": "Una carcassa piccola si macella a mano, una grande solo col coltello: dà pelle, ossa e grasso."
"[leather_is_made_from_hide]": "Il cuoio si fa da pelle e grasso sull'essiccatoio, dove si essicca anche la carne."
"[bows_and_arrows_are_made]": "Archi e frecce si fanno al banco, e la punta di freccia di selce o d'osso."
"[bronze_is_smelted_in_a]": "Il bronzo si fonde nella forgia con rame e stagno, e nella borsa serve un crogiolo."
"[iron_ore_is_smelted_into]": "Il minerale di ferro si fonde in massello in un basso fuoco, e la forgia trasforma il massello in lingotti."
"[iron_and_steel_tools_are]": "Gli attrezzi di ferro e d'acciaio si forgiano sull'incudine."
"[thread_is_spun_from_flax]": "Dagli steli di lino si fila il filo, e al telaio se ne tesse stoffa."
"[tar_is_drawn_from_logs]": "Il catrame si ricava dai tronchi nella fornace, e per farlo serve una pentola di terracotta."
"[silver_gold_and_platinum_are]": "Argento, oro e platino si fondono nella forgia, e sull'incudine si fanno blocchi dai lingotti."
"[cancel_loading_esc]": "Annulla il caricamento (Esc)"
"[the_world_is_ready]": "Il mondo è pronto"

