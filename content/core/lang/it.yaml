"[core.eras.primitive]": "Attrezzi primitivi"
"[core.eras.primitive.about]": "Corda, falò, banco da lavoro, attrezzi di pietra e legno, tronchi e assi, baule."
"[core.eras.bone_leather]": "Legno, osso e cuoio"
"[core.eras.bone_leather.about]": "Macellazione, essiccatoio, cuoio da pelle e grasso, ago e colla d'osso, candela, archi e fionda, stoffa."
"[core.eras.bronze]": "Ceramica e prima metallurgia"
"[core.eras.bronze.about]": "Fornace, mattone, carbone, forgia, rame e attrezzi di rame."
"[core.eras.alloy]": "Bronzo"
"[core.eras.alloy.about]": "Stagno, crogiolo, lega di bronzo e attrezzi di bronzo che estraggono il ferro."
"[core.eras.iron]": "Ferro"
"[core.eras.iron.about]": "Minerale di ferro, basso fuoco e massello, lingotti di ferro, incudine e attrezzi di ferro."
"[core.eras.steel]": "Acciaio"
"[core.eras.steel.about]": "Acciaio da ferro e carbone in un crogiolo, e attrezzi d'acciaio."

