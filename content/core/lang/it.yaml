# content/core/data/eras.yaml
"Выживание без инструментов": "Sopravvivenza senza attrezzi"
"Сбор руками, ветки, волокно, камни, ягоды и грибы; простые вещи из них руками.": "Raccolta a mano: rami, fibra, pietre, bacche e funghi; cose semplici fatte a mano con essi."
"Примитивные инструменты": "Attrezzi primitivi"
"Верёвка, костёр, верстак, каменные и деревянные инструменты, брёвна и доски, сундук.": "Corda, falò, banco da lavoro, attrezzi di pietra e legno, tronchi e assi, baule."
"Дерево, кости и кожа": "Legno, osso e cuoio"
"Разделка зверей, сушилка, кожа из шкуры с жиром, костяные игла и клей, свеча, луки и праща, ткань.": "Macellazione, essiccatoio, cuoio da pelle e grasso, ago e colla d'osso, candela, archi e fionda, stoffa."
"Керамика и ранняя металлургия": "Ceramica e prima metallurgia"
"Печь для обжига, кирпич, уголь, горн, медь и медные инструменты.": "Fornace, mattone, carbone, forgia, rame e attrezzi di rame."
"Бронза": "Bronzo"
"Олово, тигель, бронзовый сплав и бронзовые инструменты, которые берут железную руду.": "Stagno, crogiolo, lega di bronzo e attrezzi di bronzo che estraggono il ferro."
"Железо": "Ferro"
"Железная руда, сыродутная печь и крица, железные слитки, наковальня и железные инструменты.": "Minerale di ferro, basso fuoco e massello, lingotti di ferro, incudine e attrezzi di ferro."
"Сталь": "Acciaio"
"Сталь из железа с углём в тигле и стальные инструменты.": "Acciaio da ferro e carbone in un crogiolo, e attrezzi d'acciaio."

