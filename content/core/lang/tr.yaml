"Прозрачным становится только то, что перед игроком и не ниже линии: 0 — по ногам, +1 — по пояс, +2 — по голову. Срезы впереди — вертикальные слои по клетке, уровни сверху считаются от линии, берётся более прозрачное. Первые слои рисуются с плотностью первых, следующие за ними тают за «растяжение» слоёв.": "Yalnızca oyuncunun önünde olup çizginin altında kalmayanlar saydamlaşır: 0 — ayakta, +1 — belde, +2 — başta. Öndeki kesitler hücre hücre dikey katmanlardır, üstteki katlar çizgiden sayılır, daha saydam olan kazanır. İlk katmanlar ilklerin yoğunluğuyla çizilir, sonrakiler katmanların “esnemesi” boyunca solar."
