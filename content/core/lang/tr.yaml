# src/client/ui/menu_loading.gd
"Волокно дают высокая трава, травы и тростник; из трёх волокон скручивают верёвку.": "Lif uzun otlardan, bitkilerden ve kamıştan gelir; üç lif bükülerek ip olur."
"Кремень попадается, когда копаешь землю, песок и осыпь.": "Çakmaktaşı toprak, kum ve moloz kazarken çıkar."
"Костёр складывают из пяти веток и пяти волокон, на нём жарят грибы, мясо и рыбу.": "Kamp ateşi beş dal ve beş liften yapılır; üstünde mantar, et ve balık kızartılır."
"Рецепт становится известен, когда в сумке побывали все его материалы.": "Bir tarif, tüm malzemeleri çantanda bulunduğunda öğrenilir."
"Верстак из восьми веток и двух верёвок: у него делают каменные инструменты.": "Sekiz dal ve iki ipten bir tezgâh: başında taş aletler yapılır."
"Печь для обжига складывают из камня и глины, в ней обжигают кирпичи и пекут лепёшки.": "Fırın taş ve kilden kurulur; içinde tuğla pişirilir ve yassı ekmek yapılır."
"Колоски дают зерно, а из зерна мелют муку.": "Başaklar tane verir, tane de una öğütülür."
"Из мха и волокна делают бинты.": "Sargılar yosun ve liften yapılır."
"Карта помнит всё, что вы видели, и на ней можно ставить метки.": "Harita gördüğün her şeyi hatırlar, üstüne işaret koyabilirsin."
"Кнопки уровня у миникарты срезают вид: так видно, что в пещере и под кронами.": "Mini haritanın yanındaki kat düğmeleri görüşü keser: böylece mağarada ve ağaç taçlarının altında ne olduğu görünür."
"Против ветра идти тяжелее, а в прыжке он сносит в сторону.": "Rüzgâra karşı yürümek zordur, zıplarken seni yana iter."
"Факел из ветки и двух волокон светит в темноте, но со временем догорает.": "Bir dal ve iki liften meşale karanlığı aydınlatır, ama zamanla yanıp biter."
"Доски делают у верстака из бревна, если в сумке есть топор.": "Çantada balta varsa tezgâhta kütükten tahta yapılır."
"Медную руду бьют киркой в жилах камня, а слитки плавят в горне из руды и угля.": "Bakır cevheri taş damarlarında kazmayla kazılır, külçeler ocakta cevher ve kömürle eritilir."
"Уголь выжигают из брёвен в печи для обжига.": "Odun kömürü fırında kütük yakılarak elde edilir."
"Сундук из шести досок хранит вещи, которые не помещаются в сумку.": "Altı tahtadan bir sandık çantaya sığmayanları saklar."
"Прыжки, плавание и работа тратят силы, а в покое они возвращаются.": "Zıplamak, yüzmek ve çalışmak güç harcar, dinlenince güç geri gelir."
"Голодному не восстановить силы полностью: ешьте ягоды, грибы, мясо и лепёшки.": "Aç biri tam toparlanamaz: meyve, mantar, et ve yassı ekmek ye."
"С тяжёлой сумкой идёшь медленнее: лишнее можно оставить в сундуке.": "Ağır çantayla daha yavaş yürürsün: fazlasını bir sandıkta bırak."
"Без сил в воде начинаешь тонуть: далеко не заплывайте.": "Gücün bitince suda batmaya başlarsın: çok uzağa yüzme."
"Горящий костёр обжигает и отбрасывает, если подойти вплотную.": "Yanan kamp ateşi çok yaklaşırsan yakar ve geri iter."
"После смерти вещи остаются в мешке на месте гибели, он отмечен на карте.": "Ölümden sonra eşyaların düştüğün yerde bir çuvalda kalır; haritada işaretlidir."
"Возвращаешься к жизни у своего костра: поставьте его рядом с домом.": "Kendi kamp ateşinde yeniden hayata dönersin: onu evine yakın kur."
"Жёлуди, шишки и семена можно посадить, и из них вырастут деревья и травы.": "Palamut, kozalak ve tohumlar dikilebilir, onlardan ağaçlar ve otlar büyür."
"Траву срезают руками, мечом или косой, и с неё падает волокно.": "Çimen elle, kılıçla ya da tırpanla kesilir, ondan lif düşer."
"Камеру можно повернуть кнопками у миникарты и наклонить, чтобы заглянуть за деревья.": "Kamera mini haritanın yanındaki düğmelerle çevrilir ve ağaçların arkasına bakmak için eğilir."
"В настройках время суток, сезон и погоду можно сделать как в жизни.": "Ayarlarda günün saati, mevsim ve hava gerçek hayatı izleyebilir."
"Удочку делают из двух веток, двух верёвок и кремня, а пойманную рыбу жарят на костре.": "Olta iki dal, iki ip ve çakmaktaşından yapılır, tutulan balıklar kamp ateşinde kızartılır."
"Тушку зверька разделывают руками, а большую тушу — только ножом: с неё падают шкура, кости и жир.": "Küçük bir leş elle parçalanır, büyüğü ise yalnızca bıçakla: post, kemik ve yağ verir."
"На сушилке из шкуры и жира выделывают кожу, там же вялят мясо.": "Kurutma rafında post ve yağdan deri yapılır, et de orada kurutulur."
"Лук и стрелы делают у верстака, а наконечник стрелы — из кремня или кости.": "Yay ve oklar tezgâhta yapılır, ok ucu çakmaktaşından ya da kemikten."
"Бронзу плавят в горне из меди и олова, и в сумке должен быть тигель.": "Bronz ocakta bakır ve kalaydan eritilir, çantada bir pota olmalı."
"Железную руду плавят в крицу в сыродутной печи, а из крицы в горне получаются слитки.": "Demir cevheri ilkel ocakta süngerimsi demire eritilir, ocak da onu külçeye çevirir."
"Железные и стальные инструменты куют на наковальне.": "Demir ve çelik aletler örste dövülür."
"Из стеблей льна прядут нить, а на ткацком станке ткут из неё ткань.": "Keten saplarından iplik eğrilir, dokuma tezgâhında ondan kumaş dokunur."
"Смолу выгоняют из брёвен в печи для обжига, и для этого нужен глиняный горшок.": "Katran fırında kütüklerden çıkarılır, bunun için kil bir çömlek gerekir."
"Серебро, золото и платину плавят в горне, а на наковальне из слитков собирают блоки.": "Gümüş, altın ve platin ocakta eritilir, örste külçelerden bloklar yapılır."
"Отменить загрузку (Esc)": "Yüklemeyi iptal et (Esc)"
