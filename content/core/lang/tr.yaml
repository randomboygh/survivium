"Сбор": "Toplama"
"Ягоды, травы, волокно, плоды и покос. Быстрее собирает, иногда берёт на одну больше.": "Meyveler, otlar, lif, yemişler ve biçme. Daha hızlı toplar, bazen bir fazla alır."
"Рубка": "Kesim"
"Деревья и кусты топором. Быстрее рубит, тратит меньше сил, иногда снимает лишнее бревно.": "Baltayla ağaçlar ve çalılar. Daha hızlı keser, daha az yorulur, bazen fazladan kütük alır."
"Копание": "Kazı"
"Земля, песок, камень и руда. Быстрее копает. Выкопать поставленное своими руками опыта не даёт.": "Toprak, kum, taş ve cevher. Daha hızlı kazar. Kendi koyduğunu kazmak deneyim vermez."
"Ремесло": "Zanaat"
"Вещи на руках, у верстака, печи и горна. Быстрее делает, инструменты и одежда выходят прочнее.": "Elde, tezgâhta, fırında ve ocakta eşya. Daha hızlı yapar; aletler ve giysiler daha sağlam çıkar."
"Стены, пол, чертёж и мебель. Быстрее строит.": "Duvarlar, zeminler, planlar ve mobilya. Daha hızlı inşa eder."
"Готовка": "Aşçılık"
"Жарка, похлёбка, хлеб и всё, что готовят на огне. Быстрее готовит, иногда выходит порция больше.": "Kızartma, yahni, ekmek ve ateşte pişen her şey. Daha hızlı pişirir, bazen porsiyon büyük çıkar."
"Охота": "Avcılık"
"Звери оружием и руками. Быстрее и сильнее бьёт, при разделке туши иногда выходит больше мяса.": "Silahla ve çıplak elle hayvanlar. Daha hızlı ve sert vurur; parçalarken bazen daha çok et çıkar."
"Рыбалка": "Balıkçılık"
"Рыба на удочку. Иногда вытаскивает две.": "Oltayla balık. Bazen iki tane çeker."
"Плавание": "Yüzme"
"Растёт, пока плывёшь. Быстрее плывёт (потом и на плотах, лодках).": "Yüzdükçe artar. Daha hızlı yüzer (sonra sallarda ve teknelerde de)."
"Земледелие": "Tarım"
"Грядки тяпкой, посев, полив и урожай. Быстрее работает на грядках, иногда собирает на одну больше.": "Çapayla tarhlar, ekim, sulama ve hasat. Tarhlarda daha hızlı çalışır, bazen bir fazla toplar."

