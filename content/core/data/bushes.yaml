# Виды кустов: куст стоит в одной ячейке воздуха на траве, клиент рисует его
# пучками листвы. tint — цвет листвы; berries — цвет спелых ягод (нет поля — без
# ягод); berry_cards — доля пучков с ягодами; cards — пучков на куст; rise — высота
# их середины над землёй в единицах мира; spread — разброс по x, вверх и по z;
# small — мелкие пучки (низкий мелколистный куст).
- id: shrub
  title: Куст
  tint: "#33542b"
  cards: 6
  rise: 0.3
  spread: [0.22, 0.15, 0.15]
- id: raspberry
  title: Малина
  tint: "#3b5c26"
  berries: "#c72133"
  berry_cards: 0.5
  cards: 9
  rise: 0.38
  spread: [0.26, 0.4, 0.16]
- id: blueberry
  title: Черника
  tint: "#305436"
  berries: "#333d85"
  berry_cards: 0.6
  cards: 8
  rise: 0.16
  spread: [0.28, 0.08, 0.2]
  small: true
