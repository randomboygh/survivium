# Звуки: файлы sounds/<id>.wav мода, или <id>_1.wav, <id>_2.wav ... — столько, сколько
# variants (каждый раз звучит случайный). volume — громкость (1 — как в файле); loop —
# звук идёт по кругу (ветер, дождь, вода). Звуки собраны tools/make_sounds.gd из шума и
# тонов; любой можно заменить своим файлом с тем же именем.
# Кто какой звук издаёт, сказано у них: у материалов step (шаг по нему) и hit (удар
# инструментом), у существ calls (голос время от времени) и alarm (испуг, угроза).

