# Звуки основы: природа и погода (ветер, дождь, град, метель, вода, огонь, сверчки, гром, сова),
# игрок (шаги по траве, земле, камню, снегу и воде, гребок, прыжок, приземление, всплеск), работа
# (копание, удар по камню, блок поставлен, подбор, сделано, еда, огонь зажжён) и интерфейс.
# Файлы sounds/<id>.wav, или <id>_1.wav, <id>_2.wav ... — столько, сколько variants (каждый раз
# звучит случайный); volume — громкость (1 — как в файле), loop — звук идёт по кругу. Собраны
# tools/make_sounds.gd из шума и тонов; любой можно заменить своим файлом с тем же именем.
# Кто какой звук издаёт, сказано у них: у материалов step (шаг) и hit (удар), у существ calls и
# alarm; код просит звук по имени без приставки мода (click, chop, rain) — подойдёт запись с таким
# именем из любого загруженного мода, нет её — тишина.
- id: wind
  title: Ветер
  loop: true
