# Materials of the core cells: only the five without which the engine does not work (air, grass,
# earth, stone, water). The rest are in mods: sand, clay and scree in "Resources", ore, boards and
# brick in "Materials", log and foliage in "Plants". The order sets the numbers
# of cells in the world, so air comes first (an empty cell = 0); the mods' numbers follow the order
# of loading, and a save remembers its own list and translates the numbers (world.json, materials).
# Fields: solid — solid (cannot be walked through, can be walked on); roof — counts as a roof when
# cutting levels; slope — loose ground, lies as a slope where there is a step down; hotbar —
# the place on the block bar (0 — not placed); corners — cut corners of natural ground: sharp —
# a straight cut at 45°, soft — slightly rounded, round — quarter circles; item — the item
# a dug-out cell gives (no field — nothing); dig — what digs it: hand — anything,
# shovel — soft (slowly by hand, quickly with a shovel, with a pickaxe too), pickaxe — only a pickaxe,
# axe — only an axe, none — cannot be dug; hardness — a pickaxe or axe needs
# at least that power; toughness — sturdiness: a blow of a tool with less power lasts
# toughness / power times longer (no field — equal to hardness; docs/balance/GAME_BALANCE_DESIGN.md); bonus — an item a dug-out cell sometimes gives on top of item (both are
# items of the mod "Resources"; without it the cell gives nothing),
# bonus_chance — how often (0–1). mow — what the cell turns into when its
# top layer is cut by hands, a sword or a scythe (grass — into earth), mow_gives — what the cut layer
# always gives; the plants on it (plants.yaml) give their own on top of that.
# role — the role by which the engine asks for a material, not by name: beach (beaches, deserts,
# riverbeds), bank (river banks, swamps, tundra clay), scree (scree of mountain slopes), ore (ore in
# stone), trunk (a tree trunk), crown (the crown); if no mod of the world has the role, earth or
# stone is laid, and trees without trunk and crown do not grow. Of two records of one role the
# last loaded is taken.
# priority — who creeps onto whom with a ragged edge at the seam of two materials (0 — never,
# larger goes over smaller); ground — which patches are drawn on open ground: soil (damp
# and dry patches, pebbles), sand (dunes), rock (moss and lichen), none; drains — water
# drains into the ground, no puddles after rain (sand); fray — by how many texels (0–7) the seam with another material
# tears in both directions in tufts (salt); side_fray — by how many texels (0–7) the material reaches
# into another on the sides of cells, in lumps and specks (ore in stone; 0 keeps the sides straight, as
# built blocks do); layers — how many cells of the same
# material the generator lays under it when it is the top of a column, instead of earth (sand). texture — the picture of the material,
# textures/<texture>.png of this mod (no field — by id): three 16×16 tiles in a row — top,
# sides, bottom; tools/make_textures.gd draws it, it can be redrawn by hand.
# step — the sound of a step on the cell, hit — the sound of a tool hitting it, by sound name (without
# the mod): records in the bundle "Player" of the mod "Sounds", without it the core is silent.
# Any record may also have common fields: description — text for the player; tags — labels for
# reports and search (they do not change the game); provisional — which of its numbers are provisional, by the names
# of the fields. A record with the id of another record replaces it only with replaces: true, otherwise it is an error.
- id: air
  title: "[core.materials.air]"
  solid: false
  roof: false
  dig: none
- id: grass
  title: "[core.materials.grass]"
  corners: soft
  slope: true
  priority: 6
  item: resources:dirt
  bonus: resources:fiber
  bonus_chance: 0.25
  dig: shovel
  mow: dirt
  mow_gives: {resources:fiber: 1}
  step: step_grass
  hit: dig
- id: dirt
  title: "[core.materials.dirt]"
  corners: soft
  slope: true
  priority: 4
  side_fray: 2
  ground: soil
  hotbar: 2
  item: resources:dirt
  dig: shovel
  bonus: resources:flint
  bonus_chance: 0.15
  step: step_dirt
  hit: dig
- id: stone
  title: "[core.materials.stone]"
  priority: 1
  side_fray: 3
  ground: rock
  hotbar: 1
  item: resources:stone
  hardness: 2
  toughness: 3
  step: step_stone
  hit: hit_stone
- id: water
  title: "[core.materials.water]"
  solid: false
  roof: false
  dig: none
  step: step_water
