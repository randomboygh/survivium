# Материалы ячеек основы: только те пять, без которых движок не работает (воздух, трава,
# земля, камень, вода). Остальные — в модах: песок, глина и осыпь в «Ресурсах», руда, доски и
# кирпич в «Материалах», бревно и листва в «Растениях». Порядок задаёт номера
# ячеек в мире, поэтому воздух идёт первым (пустая ячейка = 0); номера модов — по порядку
# загрузки, а сохранение помнит свой список и переводит номера (world.json, materials).
# Поля: solid — твёрдая (через неё не пройти, по ней ходят); roof — считается крышей при
# срезе уровней; slope — рыхлый грунт, ложится склоном там, где ступенька вниз; hotbar —
# место на панели блоков (0 — не ставится); corners — срезанные углы природного грунта: sharp —
# прямой срез под 45°, soft — чуть скруглённый, round — по четверти круга; item — предмет,
# который даёт выкопанная ячейка (нет поля — ничего); dig — чем копают: hand — чем угодно,
# shovel — мягкое (руками медленно, лопатой быстро, киркой тоже), pickaxe — только киркой,
# axe — только топором, none — не копается; hardness — твёрдость: кирке или топору нужна
# сила не меньше; bonus — предмет, который выкопанная ячейка иногда даёт сверх item (оба —
# предметы мода «Ресурсы»; без него ячейка не даёт ничего),
# bonus_chance — как часто (0–1). mow — во что превращается ячейка, когда с неё срезают
# верхний слой руками, мечом или косой (трава — в землю), mow_gives — что срезанный слой
# даёт всегда; растения на нём (plants.yaml) дают своё сверх этого.
# role — роль, по которой материал просит движок, а не по имени: beach (пляжи, пустыни,
# русла), bank (берега рек, болота, глина тундры), scree (осыпь горных склонов), ore (руда в
# камне), trunk (ствол дерева), crown (крона); роли нет в модах мира — ложится земля или
# камень, а деревья без trunk и crown не растут. Из двух записей одной роли берётся
# последняя загруженная.
# priority — кто на кого наползает рваным краем на стыке двух материалов (0 — никогда,
# больше — поверх меньшего); ground — какие пятна рисуются на открытой земле: soil (сырые
# и сухие пятна, камешки), sand (барханы), rock (мох и лишайник), none; drains — вода
# уходит в землю, луж после дождя не бывает (песок). texture — картинка материала,
# textures/<texture>.png этого мода (нет поля — по id): три плитки 16×16 в ряд — верх,
# бока, низ; её рисует tools/make_textures.gd, перерисовать можно руками.
# step — звук шага по ячейке, hit — звук удара по ней инструментом, по имени звука (без
# мода; записи в data/sounds.yaml, файлы в sounds/).
- id: air
  title: Воздух
  solid: false
  roof: false
  dig: none
- id: grass
  title: Трава
  corners: soft
  slope: true
  priority: 6
  item: resources:dirt
  bonus: resources:fiber
  bonus_chance: 0.25
  dig: shovel
  mow: dirt
  mow_gives: {resources:fiber: 1}
  step: step_grass
  hit: dig
- id: dirt
  title: Земля
  corners: soft
  slope: true
  priority: 4
  ground: soil
  hotbar: 2
  item: resources:dirt
  dig: shovel
  bonus: resources:flint
  bonus_chance: 0.15
  step: step_dirt
  hit: dig
- id: stone
  title: Камень
  priority: 1
  ground: rock
  hotbar: 1
  item: resources:stone
  hardness: 2
  step: step_stone
  hit: hit_stone
- id: water
  title: Вода
  solid: false
  roof: false
  dig: none
  step: step_water
