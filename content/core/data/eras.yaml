# Eras are steps of progress (section 7 of the spec, docs/specifications/BUNDLE_SYSTEM.md, section 9). There are no
# technologies: an era forbids nothing in the game, it is a label the content graph checks and reports show.
# order — the order of the step (0, 1, 2…, no repeats); depth — how many crafting steps from the start to expect
# for the items of the era: a deeper item gets a "long chain" warning (0 — do not check). An era is written on
# the item that opens the step (era: a station, the first tool of a new material, a new
# material); for the others the graph derives it: a recipe by the latest of what it requires, a yield
# by the tool, an item by its earliest source, but not earlier than the one written. Eras 4–6 (bronze, iron,
# steel) came with their own content, 7 will come the same way.
