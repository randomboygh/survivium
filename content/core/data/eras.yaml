# Эпохи — ступени прогресса (раздел 7 ТЗ, docs/specifications/BUNDLE_SYSTEM.md, раздел 9). Технологий
# нет: эпоха ничего не запрещает в игре, это метка, которую проверяет граф контента и показывают отчёты.
# order — порядок ступени (0, 1, 2…, без повторов); depth — сколько шагов изготовления от старта ждать
# у вещей эпохи: вещь глубже — предупреждение «длинная цепочка» (0 — не проверять). Эпоху пишут у
# предмета, который открывает ступень (era: станок, первый инструмент из нового материала, новый
# материал); у остальных её выводит граф: рецепт — по самому позднему из того, что он требует, добыча —
# по инструменту, вещь — по самому раннему источнику, но не раньше записанной. Эпохи 4–7 появятся
# вместе со своим контентом.
- id: foraging
  title: Выживание без инструментов
  description: Сбор руками, ветки, волокно, камни, ягоды и грибы; простые вещи из них руками.
  order: 0
  depth: 2
  provisional: [depth]
- id: primitive
  title: Примитивные инструменты
  description: Верёвка, костёр, верстак, каменные и деревянные инструменты, брёвна и доски, сундук.
  order: 1
  depth: 6
  provisional: [depth]
- id: bone_leather
  title: Дерево, кости и кожа
  description: Разделка зверей, шкуры и кости, простые луки, ткань. Контента пока нет.
  order: 2
  depth: 8
  provisional: [depth]
- id: bronze
  title: Керамика и ранняя металлургия
  description: Печь для обжига, кирпич, уголь, горн, медь и медные инструменты.
  order: 3
  depth: 10
  provisional: [depth]
