# Рецепты: что делают руками в сумке, на верстаке и в печи. makes — предмет, count —
# сколько штук выходит; needs — материалы и сколько их уходит; at — станок, у которого
# делают (предмет с `prop`: верстак, печь, костёр; нет поля — руками, где угодно);
# tool — инструмент, который должен быть в сумке (axe, pickaxe, shovel, sword, scythe); time —
# секунд работы. Рецепт становится известен, когда в сумке побывали все его материалы.
# Название рецепта — то, что видно в окне крафта.

# Руками
- id: cord
  title: Верёвка
  makes: cord
  needs: {fiber: 3}
  time: 2
- id: campfire
  title: Костёр
  makes: campfire
  needs: {branch: 5, fiber: 5}
  time: 4
