# Предметы: то, что лежит в сумке и на земле. weight — вес одной штуки в кг; stack —
# сколько штук помещается в одну ячейку сумки; food — сытость от одной штуки (0 —
# несъедобно); place — материал ячейки, который предмет ставит в мир (нет поля — не
# ставится); model — воксельная модель предмета на земле (нет поля — свёрток);
# icon — картинка в сумке (нет поля — плитка материала из place). Инструменты: tool —
# axe (рубит деревья и деревянные ячейки), pickaxe (камень и руда), shovel (мягкий грунт
# быстро, выкапывает кусты), sword (сбивает ягоды с кустов); power — сила: твёрдость
# материала, которую он берёт, и урон дереву за удар; area — сколько ячеек за один
# взмах; swing — секунд на взмах. plant — куст, который сажает предмет.
