# Items: what lies in the bag and on the ground. weight — the weight of one piece in kg; stack —
# how many pieces fit into one bag slot; food — the satiety from one piece (0 —
# inedible); heal — how much health one piece restores (a bandage); heal_time — over how many seconds (a poultice heals gradually, 0 — at once); visions — seconds of visions one eaten piece gives (a glowing mushroom: the picture swims and shifts colour, as when short of sleep but stronger; pieces add up to VISIONS_MAX); place — the cell material the item puts into the world (no field — it is not
# placed); model — the voxel model of the item on the ground (no field — a bundle);
# icon — the picture in the bag (no field — the tile of the material from place). Tools: tool —
# axe (chops trees, bushes and wooden cells), pickaxe (stone and ore), shovel (soft
# ground quickly, digs up bushes), sword (knocks berries off bushes, cuts tall grass cell by cell),
# scythe (mows grass, spikelets and flowers in an arc in front); any other word (knife, hammer) —
# a new class: in the world it works like hands, while recipes and stations may require it; mows — which grass it cuts: tall
# (only tall grass, spikelets and flowers), all (and the grass itself down to the ground, like hands), no field — none; power — strength: the hardness
# of material it can take, and the damage to a tree per hit; area — how many cells per
# swing; swing — seconds per swing; reach — how many cells from the character it reaches (without a
# tool the hands reach 8, blocks are placed at 10). plant — the bush the item plants;
# sow — the material the sown item turns bare ground into (grass seeds — into grass);
# crop — the plant (plants.yaml) that then grows on it (grain — spikelets).
# durability — how many swings the tool lasts while wear is on (0 — does not wear out);
# repair — what is spent on repair at a station where things are repaired. prop — the class of a thing placed in the world
# from the bag onto 2×2 cells (chest, workbench, kiln, forge, campfire; a mod may add its own): such
# a thing, if it stores nothing, does what recipes.yaml points to it in `at`. What else
# it does is by flags: storage — how many slots it holds (a chest), fire — burns (a campfire: it is put out,
# lit with fuel, burns; fuel_max — how many seconds of burning fit in it, fuel_start —
# how many a just-placed one has, 0 — burns forever; under the open sky rain puts it out),
# repairs — tools are repaired at it (a workbench), serves — stations
# it replaces (their recipes are made at it too), place_tool — the class of tool that must
# be in the bag to place it.
# In hand: sprite — the sheet of frames of the tool in hand, sprites/held/<sprite>.png of this mod
# (layout in sprites/player.yaml); no field — in hand is its icon, shrunk, and the game
# turns it along with the hand. anim — the character's work (works in sprites/player.yaml)
# it is used for: chop (chop from above), dig (dig down in front), slash (strike
# from the side), reach (stretch out: place, gather; also the default), mow (mow with both hands),
# aim (hold in front with both hands), eat (bring to the mouth); hands — how many hands it
# takes (mow and aim — two). light — the item in hand shines in the dark (a torch): by how many world
# units its light reaches; its durability is how many seconds it burns in hand, in water it goes out;
# the fire burns at the brightest point of its sheet in hand. Without such an item there is only a faint glow around the player.
# source: special — the item is obtained in a way the content graph does not see (a quest, a trade): then it is not
# a "no source" error (every other item comes from the world, a recipe or the start). era — the era of progress
# (eras.yaml) the item opens: a station, the first tool of a new material, a new
# material; for the others the content graph derives it, not earlier than the one written. In the game an era forbids nothing.
# Any record may also have common fields: description — text for the player; tags — labels for
# reports and search (they do not change the game); provisional — which of its numbers are provisional, by the names
# of the fields. A record with the id of another record replaces it only with replaces: true, otherwise it is an error.
- id: campfire
  title: "[core.items.campfire]"
  era: primitive
  quality_cap: 70
  weight: 3.0
  stack: 5
  icon: campfire
  prop: campfire
  fire: true
  scares: 5.0
  fuel_max: 2400
  fuel_start: 600
# Rot — what spoiled food turns into (the rots_to field of food, spoils — how many game
# days it keeps; longer in the cold). It is used for nothing yet, later — fertiliser. source:
# special — the graph sees it even without the food that rots (in a world without food bundles).
- id: rot
  title: "[core.items.rot]"
  weight: 0.2
  stack: 50
  icon: rot
  source: special
# Cross — the world itself places it where a dead player's bag lay, when its days have passed
# (Placed.put_grave): above it, as above a sign, one sees who died here, of what, how long
# they lived and what they managed. grave — such a cross; it does not go into the bag: removed in
# build mode, it simply vanishes.
- id: grave
  title: "[core.items.grave]"
  description: "[core.items.grave.about]"
  weight: 2.0
  stack: 1
  icon: grave
  model: grave
  prop: grave
  furniture: true
  grave: true
  source: special
