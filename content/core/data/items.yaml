# Предметы: то, что лежит в сумке и на земле. weight — вес одной штуки в кг; stack —
# сколько штук помещается в одну ячейку сумки; food — сытость от одной штуки (0 —
# несъедобно); heal — сколько здоровья возвращает одна штука (бинт); place — материал ячейки, который предмет ставит в мир (нет поля — не
# ставится); model — воксельная модель предмета на земле (нет поля — свёрток);
# icon — картинка в сумке (нет поля — плитка материала из place). Инструменты: tool —
# axe (рубит деревья, кусты и деревянные ячейки), pickaxe (камень и руда), shovel (мягкий
# грунт быстро, выкапывает кусты), sword (сбивает ягоды с кустов, срезает высокую траву по клетке),
# scythe (косит траву, колоски и цветы дугой перед собой); любое другое слово (knife, hammer) —
# новый класс: в мире он работает как руки, а рецепты и станки могут его требовать; mows — какую траву срезает: tall
# (только высокую траву, колоски и цветы), all (и саму траву до земли, как руки), нет поля — никакую; power — сила: твёрдость
# материала, которую он берёт, и урон дереву за удар; area — сколько ячеек за один
# взмах; swing — секунд на взмах; reach — на сколько ячеек от персонажа достаёт (без
# инструмента руки достают на 8, блоки ставятся на 10). plant — куст, который сажает предмет;
# sow — материал, в который посеянный предмет превращает голую землю (семена трав — в траву);
# crop — растение (plants.yaml), которое потом растёт на ней (зерно — колоски).
# durability — сколько взмахов инструмент выдерживает, пока включён износ (0 — не изнашивается);
# repair — что уходит на починку у станка, где чинят. prop — класс вещи, которая ставится в мир
# из сумки на клетки 2×2 (chest, workbench, kiln, forge, campfire; мод может завести свой): у такой
# вещи, если она ничего не хранит, делают то, что в recipes.yaml указывает на неё в `at`. Что ещё
# она делает — флаги: storage — сколько мест хранит (сундук), fire — горит (костёр: тушится,
# разжигается топливом, обжигает), repairs — у неё чинят инструменты (верстак), serves — станки,
# которые она заменяет (их рецепты делают и у неё), place_tool — класс инструмента, который должен
# быть в сумке, чтобы её поставить.
# В руках: sprite — лист кадров инструмента в руке, sprites/held/<sprite>.png этого мода
# (раскладка в sprites/player.yaml); нет поля — в руке его иконка, уменьшенная, и игра
# поворачивает её вместе с рукой. anim — работа персонажа (works в sprites/player.yaml),
# которой с ним работают: chop (рубить сверху), dig (копать вниз перед собой), slash (бить
# сбоку), reach (тянуться: ставить, собирать; так и без поля), mow (косить двумя руками),
# aim (держать перед собой двумя руками), eat (подносить ко рту); hands — сколько рук он
# занимает (mow и aim — две). light — вещь в руке светит в темноте (факел): на сколько мировых
# единиц достаёт её свет; durability у неё — сколько секунд она горит в руке, в воде гаснет;
# огонь горит в самой яркой точке её листа в руке. Без такой вещи вокруг игрока лишь слабый отсвет.
# source: special — предмет получают так, как граф контента не видит (задание, обмен): тогда он не
# ошибка «нет источника» (каждый другой предмет даёт мир, рецепт или старт). era — эпоха прогресса
# (eras.yaml), которую предмет открывает: станок, первый инструмент из нового материала, новый
# материал; у остальных её выводит граф контента, не раньше записанной. В игре эпоха ничего не запрещает.
# Любая запись может иметь ещё общие поля: description — текст для игрока; tags — метки для
# отчётов и поиска (игру они не меняют); provisional — какие её числа предварительные, по именам
# полей. Запись с id чужой записи заменяет её только с replaces: true, иначе это ошибка.
- id: campfire
  title: Костёр
  era: primitive
  weight: 3.0
  stack: 5
  icon: campfire
  prop: campfire
  fire: true
