# Растения на траве и что они дают, когда их срезают руками, мечом или косой. Сначала
# срезаются высокие (высокая трава, цветы, травы, колоски, тростник), и клетка остаётся травой;
# потом низкая трава (tuft) вместе с `mow_gives` материала, и остаётся земля. Какие растения
# где растут, решает клиент: луга высокой травы, пятна цветов и трав, поля колосков на
# равнине, тростник у воды. gives — предметы и сколько их за одно растение; chance — как
# часто растение их даёт (0–1).
- id: tuft
  title: Трава
  gives: {grass_seeds: 1}
  chance: 0.08
- id: tall_grass
  title: Высокая трава
  gives: {fiber: 1}
  chance: 0.5
- id: flowers
  title: Цветы
  gives: {grass_seeds: 1}
  chance: 0.6
- id: herbs
  title: Травы
  gives: {fiber: 1}
  chance: 0.5
- id: ears
  title: Колоски
  gives: {grain: 2}
- id: reeds
  title: Тростник
  gives: {fiber: 2}
