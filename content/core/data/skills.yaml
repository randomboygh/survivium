# Навыки (решение 164): растут от полезной работы своего вида (role) и ускоряют её. Очки — секунды
# работы: взмах, который что-то сделал, столько, сколько он длится; вещь из рецепта — его время (тот же
# рецепт подряд даёт всё меньше); где у работы нет своего времени, целая вещь даёт each (добытый зверь,
# пойманная рыба). levels — уровней; first — очков на первый, каждый следующий в growth раз дороже;
# speed — насколько быстрее работа на последнем уровне (доля прибавки темпа: 1 — вдвое быстрее, у плавания —
# вдвое быстрее плывёт; по умолчанию 1); yield — шанс на последнем уровне получить ещё одну штуку того, что даёт
# работа; quality — сколько очков качества (из 100) навык на последнем уровне прибавляет добытому или потолку
# сделанного (по умолчанию 30, у ремесла 50; качество — решение 181); effort — на
# какую долю дешевле по силам взмах на последнем уровне (по умолчанию 0,4); care — шанс на последнем уровне,
# что взмах не изнашивает инструмент (по умолчанию 0,5); might — на какую долю сильнее удар инструмента на
# последнем уровне (только охота: 0,5; у прочих 0 — силу удара решает инструмент). Без first и growth: 120 очков
# на первый уровень, каждый следующий в 1,45 раза дороже (десятый — около трёх часов чистой работы).
# Формулы и таблицы: docs/balance/GAME_BALANCE_DESIGN.md. Порядок полос в окне персонажа — order. Мод добавляет навык записью с новой
# ролью, только когда движок знает эту работу.
- id: gathering
  title: Сбор
  description: Ягоды, травы, волокно, плоды и покос. Быстрее собирает, иногда берёт на одну больше.
  role: gather
  order: 0
  yield: 0.6
- id: chopping
  title: Рубка
  description: Деревья и кусты топором. Быстрее рубит, тратит меньше сил, иногда снимает лишнее бревно.
  role: chop
  order: 1
  yield: 0.5
- id: digging
  title: Копание
  description: Земля, песок, камень и руда. Быстрее копает. Выкопать поставленное своими руками опыта не даёт.
  role: dig
  order: 2
- id: crafting
  title: Ремесло
  description: Вещи на руках, у верстака, печи и горна. Быстрее делает, инструменты и одежда выходят прочнее.
  role: craft
  order: 3
  quality: 50
  effort: 0.0
- id: building
  title: Стройка
  description: Стены, пол, чертёж и мебель. Быстрее строит.
  role: build
  order: 4
- id: cooking
  title: Готовка
  description: Жарка, похлёбка, хлеб и всё, что готовят на огне. Быстрее готовит, иногда выходит порция больше.
  role: cook
  order: 5
  yield: 0.6
  effort: 0.0
- id: hunting
  title: Охота
  description: Звери оружием и руками. Быстрее и сильнее бьёт, при разделке туши иногда выходит больше мяса.
  role: hunt
  order: 6
  each: 30
  yield: 0.6
  might: 0.5
- id: fishing
  title: Рыбалка
  description: Рыба на удочку. Иногда вытаскивает две.
  role: fish
  order: 7
  each: 20
  yield: 0.5
  speed: 0.0
  effort: 0.0
- id: swimming
  title: Плавание
  description: Растёт, пока плывёшь. Быстрее плывёт (потом и на плотах, лодках).
  role: swim
  order: 8
  speed: 1.0
  effort: 0.0
  care: 0.0
- id: farming
  title: Земледелие
  description: Грядки тяпкой, посев, полив и урожай. Быстрее работает на грядках, иногда собирает на одну больше.
  role: farm
  order: 9
  yield: 0.6
