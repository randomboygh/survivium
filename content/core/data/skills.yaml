# Навыки (решение 164): растут от полезной работы своего вида (role) и ускоряют её. Очки — секунды
# работы: взмах, который что-то сделал, столько, сколько он длится; вещь из рецепта — его время (тот же
# рецепт подряд даёт всё меньше); где у работы нет своего времени, целая вещь даёт each (добытый зверь,
# пойманная рыба). levels — уровней; first — очков на первый, каждый следующий в growth раз дороже;
# speed — насколько быстрее работа на последнем уровне (доля прибавки темпа: 1 — вдвое быстрее, у плавания —
# вдвое быстрее плывёт; по умолчанию 1); yield — шанс на последнем уровне получить ещё одну штуку того, что даёт
# работа; quality — сколько очков качества (из 100) навык на последнем уровне прибавляет добытому или потолку
# сделанного (по умолчанию 30, у ремесла 50; качество — решение 181); effort — на
# какую долю дешевле по силам взмах на последнем уровне (по умолчанию 0,4); care — шанс на последнем уровне,
# что взмах не изнашивает инструмент (по умолчанию 0,5); might — на какую долю сильнее удар инструмента на
# последнем уровне (только охота: 0,5; у прочих 0 — силу удара решает инструмент). Без first и growth: 120 очков
# на первый уровень, каждый следующий в 1,45 раза дороже (десятый — около трёх часов чистой работы).
# Формулы и таблицы: docs/balance/GAME_BALANCE_DESIGN.md. Порядок полос в окне персонажа — order. Мод добавляет навык записью с новой
# ролью, только когда движок знает эту работу.
