# Навыки (решение 164): растут от полезной работы своего вида (role) и ускоряют её. Очки — секунды
# работы: взмах, который что-то сделал, столько, сколько он длится; вещь из рецепта — его время (тот же
# рецепт подряд даёт всё меньше); где у работы нет своего времени, целая вещь даёт each (добытый зверь,
# пойманная рыба). levels — уровней; first — очков на первый, каждый следующий в growth раз дороже;
# speed — насколько быстрее работа на последнем уровне (доля сэкономленного времени, у плавания — доля
# прибавки скорости в воде). Порядок полос в окне персонажа — order. Мод добавляет навык записью с новой
# ролью, только когда движок знает эту работу.
- id: gathering
  title: Сбор
  description: Ягоды, травы, волокно, плоды и покос. Быстрее собирает.
  role: gather
  order: 0
- id: chopping
  title: Рубка
  description: Деревья и кусты топором. Быстрее рубит.
  role: chop
  order: 1
- id: digging
  title: Копание
  description: Земля, песок, камень и руда. Быстрее копает. Выкопать поставленное своими руками опыта не даёт.
  role: dig
  order: 2
- id: crafting
  title: Ремесло
  description: Вещи на руках, у верстака, печи и горна. Быстрее делает.
  role: craft
  order: 3
- id: building
  title: Стройка
  description: Стены, пол, чертёж и мебель. Быстрее строит.
  role: build
  order: 4
- id: cooking
  title: Готовка
  description: Жарка, похлёбка, хлеб и всё, что готовят на огне. Быстрее готовит.
  role: cook
  order: 5
- id: hunting
  title: Охота
  description: Звери оружием и руками. Быстрее бьёт.
  role: hunt
  order: 6
  each: 30
- id: fishing
  title: Рыбалка
  description: Рыба на удочку.
  role: fish
  order: 7
  each: 20
  speed: 0.0
- id: swimming
  title: Плавание
  description: Растёт, пока плывёшь. Быстрее плывёт (потом и на плотах, лодках).
  role: swim
  order: 8
  speed: 0.4
