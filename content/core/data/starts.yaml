# Старт нового мира: что умеют руки, с чем приходит персонаж и что стоит у точки появления. Движок начинает
# каждый новый мир с записи default, а проверка контента (граф) идёт от неё же, так что игра и проверка
# начинают одинаково. Руки — инструмент без предмета: hand_power — сила (какую твёрдость ячейки берут и урон
# дереву за удар), hand_area — сколько ячеек за взмах, hand_swing — секунд на взмах, hand_reach — на сколько
# ячеек достают, hand_mows — какую траву срезают (none, tall — только высокую, all — и саму траву до земли),
# hand_slow — во сколько раз медленнее взмаха копают мягкий грунт (без поля — по схеме: 1, 1, 0.45, 8, all, 2).
# bag — что лежит в сумке (id предмета: сколько; нет поля — сумка пуста); camp — лагерь:
# вещи, которые ставятся у точки появления (предметы с prop), каждая at: [восток, юг] — на столько
# клеток от неё; вещь занимает 2×2 клетки. Бандл добавляет в лагерь своё патчем:
# `- {id: core:default, patch: true, camp+: [{item: мод:вещь, at: [x, z]}]}` (так сундук).
# Общие поля любой записи: description — текст для игрока, tags — метки для отчётов, provisional —
# какие числа записи предварительные, was — id, которые у неё были раньше.
- id: default
  title: Обычный старт
  description: Пустые руки, пустая сумка и костёр у точки появления.
  hand_power: 1
  hand_area: 1
  hand_swing: 0.45
  hand_reach: 8
  hand_mows: all
  hand_slow: 2.0
  camp:
    - {item: campfire, at: [-4, 4]}
