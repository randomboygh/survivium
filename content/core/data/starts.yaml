# The start of a new world: what the hands can do, what the character arrives with and what stands at the spawn point. The engine starts
# every new world from the record default, and the content check (the graph) starts from it too, so the game and the check
# start the same. Hands are a tool without an item: hand_power — strength (what cell hardness they take and the damage
# to a tree per hit), hand_area — how many cells per swing, hand_swing — seconds per swing, hand_reach — how many
# cells they reach, hand_mows — which grass they cut (none, tall — only tall, all — the grass itself down to the ground),
# hand_slow — how many times slower than a swing they dig soft ground (no field — by the schema: 1, 1, 0.45, 8, all, 2).
# bag — what lies in the bag (item id: how many; no field — the bag is empty); camp — the camp:
# things placed at the spawn point (items with prop), each at: [east, south] — that many
# cells from it; a thing takes 2×2 cells. A bundle adds its own to the camp by a patch:
# `- {id: core:default, patch: true, camp+: [{item: mod:thing, at: [x, z]}]}` (the chest does it this way).
# Common fields of any record: description — text for the player, tags — labels for reports, provisional —
# which numbers of the record are provisional, was — the ids it had before.
- id: default
  title: "[core.starts.default]"
  description: "[core.starts.default.about]"
  hand_power: 1
  hand_area: 1
  hand_swing: 0.45
  hand_reach: 8
  hand_mows: all
  hand_slow: 2.0
  camp:
    - {item: campfire, at: [-4, 4]}
