# Старт нового мира: с чем приходит персонаж и что стоит у точки появления. Движок начинает каждый новый
# мир с записи default, а проверка контента (граф) идёт от неё же, так что игра и проверка начинают
# одинаково. bag — что лежит в сумке (id предмета: сколько; нет поля — сумка пуста); camp — лагерь:
# вещи, которые ставятся у точки появления (предметы с prop), каждая at: [восток, юг] — на столько
# клеток от неё; вещь занимает 2×2 клетки. Бандл добавляет в лагерь своё патчем:
# `- {id: core:default, patch: true, camp+: [{item: мод:вещь, at: [x, z]}]}` (так сундук).
# Общие поля любой записи: description — текст для игрока, tags — метки для отчётов, provisional —
# какие числа записи предварительные, was — id, которые у неё были раньше.
- id: default
  title: Обычный старт
  description: Пустые руки, пустая сумка и костёр у точки появления.
  camp:
    - {item: campfire, at: [-4, 4]}
