# Species of creatures. Who is food or a threat to whom is derived from properties (src/shared/content/ai_rules.gd):
# a predator takes prey up to 0.8 of its own mass, a meat eater 1.25 times heavier is dangerous even without hunting.
# mass — kg; diet — plants and/or meat; speed — cells per second; sight — the range
# of sight in cells; human_wariness — 0..1, from 0.5 a human counts as a threat; fire_wariness —
# 0..1 (1 by default), from 0.5 the animal keeps away from fire and light (an item's scares);
# active — day, night or any; count — how many live around players; sprite — the name
# of the picture: sprites/creatures/<sprite>.png of the mod (or the old drawings in the client code),
# frames — frames in a row in it (for fliers 0 is sitting, the rest are wing beats).
# Optional: flies — flies (moves from place to place, lands on the ground and on
# trees), flight — how far it flies at a time, in cells (28); swims — swims in open water,
# ashore — a swimmer also comes ashore by its water; hops — hops on the ground; after_rain —
# comes out only after rain, while puddles stand; tints — the colours the picture is multiplied by
# (each animal has its own); flock — [from, to] how many stay together (pack, herd); roost — where it sleeps and
# rests: ground or trees; likes — plants (data/plants.yaml of the bundles of "Plants") it is
# drawn to; calls — a voice heard from time to time, alarm — a cry of fear or threat
# (sounds.yaml). human — players. Animals and birds live in the mod content/animals, a bundle per species;
# only the human remains in the core.
# Any record may also have common fields: description — text for the player; tags — labels for
# reports and search (they do not change the game); provisional — which of its numbers are provisional, by the names
# of the fields. A record with the id of another record replaces it only with replaces: true, otherwise it is an error.
- id: human
  title: "[core.creatures.human]"
  mass: 70
  diet: [plants, meat]
  speed: 4.0
  sight: 0.0
  human_wariness: 0.0
  active: day
