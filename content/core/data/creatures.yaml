# Виды существ. Кто кому еда или угроза, выводится из свойств (src/shared/content/ai_rules.gd):
# хищник берёт добычу до 0.8 своей массы, мясоед в 1.25 раза тяжелее опасен и без охоты.
# mass — кг; diet — plants и/или meat; speed — ячеек в секунду; sight — дальность
# зрения в ячейках; human_wariness — 0..1, с 0.5 человек считается угрозой;
# active — day, night или any; count — сколько живёт вокруг игроков; sprite — имя
# картинки: sprites/creatures/<sprite>.png мода (или старые рисунки в коде клиента),
# frames — кадров в ней в ряд (у летающих 0 сидит, остальные взмахи крыльев).
# Необязательные: flies — летает (перелетает с места на место, садится на землю и на
# деревья); flock — [от, до] сколько держится вместе (стая, стадо); roost — где спит и
# отдыхает: ground или trees; likes — растения (core/data/plants.yaml), к которым
# тянется; calls — голос, который слышно время от времени, alarm — крик испуга или угрозы
# (sounds.yaml). human — игроки. Пример вида в своём моде: content/birds.
- id: human
  title: Человек
  mass: 70
  diet: [plants, meat]
  speed: 4.0
  sight: 0.0
  human_wariness: 0.0
  active: day
- id: rabbit
  title: Заяц
  mass: 2
  diet: [plants]
  speed: 5.5
  sight: 9
  human_wariness: 0.9
  active: day
  count: 14
  sprite: rabbit
  alarm: rabbit
- id: squirrel
  title: Белка
  mass: 0.5
  diet: [plants]
  speed: 5.0
  sight: 7
  human_wariness: 0.7
  active: day
  count: 10
  sprite: squirrel
  calls: squirrel
  alarm: squirrel
- id: cat
  title: Дикая кошка
  mass: 4
  diet: [meat]
  speed: 5.5
  sight: 10
  human_wariness: 0.6
  active: any
  count: 4
  sprite: cat
  calls: cat
  alarm: cat
- id: deer
  title: Олень
  mass: 60
  diet: [plants]
  speed: 6.5
  sight: 13
  human_wariness: 0.8
  active: day
  count: 8
  sprite: deer
  calls: deer
  alarm: deer
- id: wolf
  title: Волк
  mass: 40
  diet: [meat]
  speed: 6.0
  sight: 14
  human_wariness: 0.6
  active: night
  count: 4
  sprite: wolf
  calls: wolf_howl
  alarm: wolf_growl
