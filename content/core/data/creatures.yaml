# Виды существ. Кто кому еда или угроза, выводится из свойств (src/shared/content/ai_rules.gd):
# хищник берёт добычу до 0.8 своей массы, мясоед в 1.25 раза тяжелее опасен и без охоты.
# mass — кг; diet — plants и/или meat; speed — ячеек в секунду; sight — дальность
# зрения в ячейках; human_wariness — 0..1, с 0.5 человек считается угрозой;
# active — day, night или any; count — сколько живёт на острове; sprite — имя
# спрайта у клиента. human — игроки.
- id: human
  title: Человек
  mass: 70
  diet: [plants, meat]
  speed: 4.0
  sight: 0.0
  human_wariness: 0.0
  active: day
- id: rabbit
  title: Заяц
  mass: 2
  diet: [plants]
  speed: 5.5
  sight: 9
  human_wariness: 0.9
  active: day
  count: 14
  sprite: rabbit
- id: squirrel
  title: Белка
  mass: 0.5
  diet: [plants]
  speed: 5.0
  sight: 7
  human_wariness: 0.7
  active: day
  count: 10
  sprite: squirrel
- id: cat
