# Породы деревьев: как дерево выглядит (где растёт, решает генератор мира).
# leaves — broad (листья) или needles (хвоя). trunk — [мин, макс] ячеек ствола под
# серединой кроны (листва) или видных под нижним ярусом (хвоя). crown — радиусы
# кроны по x, вверх, по z в точках решётки крон (листва) или [радиус нижнего яруса,
# мин ярусов, макс ярусов] (хвоя). tints — цвета листвы, по одному на дерево.
# bare — доля деревьев, сбрасывающих всю листву зимой. seed — предмет, который кроме брёвен и веток
# остаётся от срубленного дерева (желудь, шишка).
- id: oak
  title: Дуб
  leaves: broad
  trunk: [6, 8]
  crown: [2.2, 1.5, 1.8]
  tints: ["#456e40", "#4c7538", "#406945"]
  bare: 0.6
  seed: acorn
- id: spruce
  title: Ель
  leaves: needles
  trunk: [1, 1]
  crown: [2.3, 5, 7]
  tints: ["#2e5738", "#335c36", "#2b523d"]
  bare: 0.0
  seed: cone
