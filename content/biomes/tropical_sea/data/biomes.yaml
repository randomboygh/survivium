# The biome's fields are as in the others (content/biomes/sea/data/biomes.yaml); tints — the ground and water colours
# of the biome instead of their own: grass, dirt, sand, clay, snow, peat, salt (by the names of the top field) and water.
# Tropical sea: the open sea of the hot zone (where: sea with a warmth window — a variant of the sea, like
# the tropical beach for the beach). Turquoise water over the white sand of the bottom; parrotfish can be caught.
- id: tropical_sea
  title: "[biomes.biomes.tropical_sea]"
  where: sea
  zone: tropic
  warmth: [0.72, 1.0]
  tints: {water: "#44c0c0", sand: "#cac2a8"}
  color: "#2a94a6"
