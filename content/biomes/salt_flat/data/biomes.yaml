# Biome: where — where it lies: climate (by a window of warmth and moisture, 0..1; of the matching ones the
# narrowest is taken, on a tie the one loaded earlier) or a terrain the generator decides: sea, beach,
# rock, plateau, swamp (one record per terrain). top — the ground on top: grass, dirt, stone, sand (the material
# of role beach), clay (role bank), snow, peat, salt (the materials of those roles); stone_below / clay_above — the soil noise threshold (-1..1), below/above
# which stone/clay shows through (instead of clay, the ground of field clay_as); dunes — by how many cells dunes raise the ground (dune noise).
# trees — shares of species on the tree grid (the rest is empty), tree_chance — the chance of a tree at a grid node,
# groves — the chance in groves (where forest noise is high); bushes — shares of bushes, bush_sparsity — one attempt
# of a bush per that many cells (0 — none). spawn — the game can start here; sandstorms — instead of rain
# sandstorms. zone — the climate zone (polar, north, temperate, steppe, hot, tropic, mountain), a label
# for the map and reports. color — the colour on the map. tints — the biome's ground and water colours instead of their own (by
# the names of the top field and water: {sand: "#e6dcbe", water: "#4cc6bc"}). References to species and bushes are soft: without their bundle the share is empty.
# Salt flat: the driest window of steppe and desert (narrower than both, so it wins; land is never drier than 0.2). A white salt crust
# (top: salt, salt is the bundle "Resources: Salt", without it sand), here and there clay; no trees, no bushes.
- id: salt_flat
  title: "[biomes.biomes.salt_flat]"
  zone: steppe
  warmth: [0.64, 0.9]
  moisture: [0.2, 0.36]
  top: salt
  clay_above: 0.55
  color: "#e6e2d3"
