# A kind of cave (where: cave) of the halls of new worlds: tier — upper, or lower (deeper); cave_share — how often
# against the other kinds of its tier; cave_floor, cave_walls — the materials of the floor and of the rock round it;
# flood — how high still water stands (0..1); pools, pools_from — a material in pools where the floor dips deepest
# (the hall's size over that share); crystals, crystal_chance — blocks on the floor and under the ceiling. color — on
# the map. Without any cave bundle all caves are of bare stone.
# A lava cave: the lower tier, in deep rock, with pools of glowing lava where the floor dips deepest.
- id: lava_cave
  title: "[biomes.biomes.lava_cave]"
  where: cave
  tier: lower
  cave_share: 1.0
  cave_walls: resources:deepstone
  pools: resources:lava
  pools_from: 0.65
  color: "#c05028"
