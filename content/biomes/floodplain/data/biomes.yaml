# Биом: where — где лежит: climate (по окну тепла warmth и влаги moisture, 0..1; из подходящих берётся
# самый узкий, при равенстве — загруженный раньше) или рельеф, который решает генератор: sea, beach,
# rock, plateau, swamp (одна запись на рельеф). top — грунт сверху: grass, dirt, stone, sand (материал
# роли beach), clay (роли bank); stone_below / clay_above — порог шума почвы (-1..1), ниже/выше
# которого проступают камень/глина; dunes — на сколько ячеек поднимают землю барханы (шум дюн).
# trees — доли пород на решётке деревьев (остаток — пусто), tree_chance — шанс дерева на узле решётки,
# groves — шанс в рощах (где высок шум леса); bushes — доли кустов, bush_sparsity — одна попытка
# куста на столько ячеек (0 — нет). spawn — здесь можно начать игру; sandstorms — вместо дождя
# песчаные бури. zone — климатическая зона (polar, north, temperate, steppe, hot, tropic, mountain), метка
# для карты и отчётов. color — цвет на карте. Ссылки на породы и кусты мягкие: без их бандла доля пуста.
# Пойма: самое влажное окно умеренной зоны — низкие берега рек и озёр, где влага выше всего. Ивы,
# тополя и черёмуха рощами, смородина; глина проступает сквозь дёрн. Породы и кусты — бандлы
# «Растений», ссылки мягкие.
- id: floodplain
  title: Пойма
  zone: temperate
  warmth: [0.36, 0.64]
  moisture: [0.78, 1.0]
  clay_above: 0.35
  trees: {plants:willow: 0.5, plants:poplar: 0.3, plants:bird_cherry: 0.12, plants:oak: 0.08}
  tree_chance: 0.06
  groves: 0.18
  bushes: {plants:currant: 0.5, plants:shrub: 0.5}
  bush_sparsity: 160
  color: "#6fa86a"
