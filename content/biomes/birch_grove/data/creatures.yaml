# Who lives in the birch grove: patches to the records of "Animals" (biomes+ appends the biome to their list);
# without the animal's bundle the patch is skipped, so the grove requires nothing.
- id: animals:hedgehog
  patch: true
  biomes+: [biomes:birch_grove]
- id: animals:rabbit
  patch: true
  biomes+: [biomes:birch_grove]
- id: animals:fox
  patch: true
  biomes+: [biomes:birch_grove]
- id: animals:deer
  patch: true
  biomes+: [biomes:birch_grove]
- id: animals:owl
  patch: true
  biomes+: [biomes:birch_grove]
