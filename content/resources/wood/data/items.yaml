# Log and branch. Which tree gives them is told by the tree itself (the log and twig fields of the species in
# "Plants"); a bush gives branches through the twig field. Fields are as for the core items
# (content/core/data/items.yaml). fuel - this lights and feeds a campfire, fuel_time - how many seconds
# a campfire burns on one piece (branch 5 minutes, log 20).
- id: branch
  title: "[resources.items.branch]"
  weight: 0.3
  stack: 20
  model: branch
  icon: branch
  fuel: true
  fuel_time: 300
- id: log
  title: "[resources.items.log]"
  weight: 5.0
  stack: 4
  model: log
  icon: log
  fuel: true
  fuel_time: 1200
