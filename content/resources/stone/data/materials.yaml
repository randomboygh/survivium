# Scree: stone rubble on the slopes of high mountains (role: scree), lies in slopes, dug
# with a shovel and gives stone, sometimes flint. Fields are as for the core materials
# (content/core/data/materials.yaml); sounds by name, from the "Sounds" mod.
- id: scree
  title: "[resources.materials.scree]"
  role: scree
  corners: sharp
  slope: true
  priority: 2
  side_fray: 3
  item: stone
  dig: shovel
  toughness: 2
  bonus: flint
  bonus_chance: 0.2
  step: step_stone
  hit: dig
