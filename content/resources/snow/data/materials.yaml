# Snow that lies all year round: the ground of the icy wasteland (role: snow, biomes with top: snow). Dug
# with a shovel and gives snow. Fields are as for the core materials (content/core/data/materials.yaml); sounds
# by name, from the "Sounds" mod. Without the bundle, stone takes its place.
- id: snow
  title: "[resources.materials.snow]"
  role: snow
  corners: round
  slope: true
  priority: 3
  side_fray: 2
  ground: soil
  layers: 3
  item: snow
  dig: shovel
  step: step_snow
  hit: dig
# Ice: blue glacier ice (role: ice) - in the sheer walls of glaciers (biome glacier). Broken with a pickaxe and gives
# ice. Without it, stone takes its place.
- id: ice
  title: "[resources.materials.ice]"
  role: ice
  corners: sharp
  priority: 4
  side_fray: 3
  ground: rock
  drains: true
  item: ice
  dig: pickaxe
  toughness: 2
  step: step_snow
  hit: dig
