# Salt: the white crust of salt flats (role: salt; biomes lay it through top or clay_as: salt). Dug
# with a shovel and gives salt. Fields are as for the core materials (content/core/data/materials.yaml); sounds
# by name, from the "Sounds" mod. Without the bundle, sand takes its place (role beach), and without that - earth.
- id: salt
  title: "[resources.materials.salt]"
  role: salt
  corners: soft
  slope: true
  priority: 3
  ground: sand
  drains: true
  fray: 6
  item: salt
  dig: shovel
  step: step_sand
  hit: dig
