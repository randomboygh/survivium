# Торф: мягкий бурый грунт торфяных болот (role: peat; биомы кладут его через top или clay_as: peat).
# Копается лопатой и даёт торф. Поля — как у материалов основы (content/core/data/materials.yaml);
# звуки по имени, из мода «Звуки». Без бандла на его месте земля.
- id: peat
  title: "[resources.materials.peat]"
  role: peat
  corners: soft
  slope: true
  priority: 2
  ground: soil
  item: peat
  dig: shovel
  toughness: 2
  step: step_dirt
  hit: dig
