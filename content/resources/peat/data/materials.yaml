# Peat: soft brown soil of peat bogs (role: peat; biomes lay it through top or clay_as: peat).
# Dug with a shovel and gives peat. Fields are as for the core materials (content/core/data/materials.yaml);
# sounds by name, from the "Sounds" mod. Without the bundle, earth takes its place.
- id: peat
  title: "[resources.materials.peat]"
  role: peat
  corners: soft
  slope: true
  priority: 2
  ground: soil
  item: peat
  dig: shovel
  toughness: 2
  step: step_dirt
  hit: dig
