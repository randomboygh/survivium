# Песок и глина как ячейки ландшафта. role — где генератор их кладёт: beach — пляжи, русла
# рек, пустыни; bank — берега, болота, глина тундры. Поля — как у материалов основы
# (content/core/data/materials.yaml); звуки по имени, из мода «Звуки». Кремень — бандл
# «Камень»: без него песок даёт только песок.
- id: sand
  title: "[resources.materials.sand]"
  role: beach
  corners: round
  slope: true
  priority: 3
  ground: sand
  drains: true
  layers: 3
  hotbar: 5
  item: sand
  dig: shovel
  bonus: flint
  bonus_chance: 0.12
  step: step_sand
  hit: dig
- id: clay
  title: "[resources.materials.clay]"
  role: bank
  corners: soft
  slope: true
  priority: 2
  hotbar: 6
  item: clay
  dig: shovel
  toughness: 2
  step: step_dirt
  hit: dig
# Грядка — земля, вскопанная тяпкой (role bed); политая или под дождём она сутки мокрая и темнее
# (role bed_wet), и только на мокрой растёт посеянное (src/shared/game/actions_farm.gd). Выкопанная
# лопатой даёт землю, посеянное на ней пропадает.
- id: bed
  title: "[resources.materials.bed]"
  role: bed
  priority: 5
  item: dirt
  dig: shovel
  step: step_dirt
  hit: dig
- id: bed_wet
  title: "[resources.materials.bed_wet]"
  role: bed_wet
  priority: 5
  item: dirt
  dig: shovel
  step: step_dirt
  hit: dig
