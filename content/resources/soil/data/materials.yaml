# Sand and clay as landscape cells. role - where the generator lays them: beach - beaches, river
# beds, deserts; bank - shores, swamps, tundra clay. Fields are as for the core materials
# (content/core/data/materials.yaml); sounds by name, from the "Sounds" mod. Flint is the "Stone"
# bundle: without it sand gives only sand.
- id: sand
  title: "[resources.materials.sand]"
  role: beach
  corners: round
  slope: true
  priority: 3
  ground: sand
  drains: true
  layers: 3
  hotbar: 5
  item: sand
  dig: shovel
  bonus: flint
  bonus_chance: 0.12
  step: step_sand
  hit: dig
- id: clay
  title: "[resources.materials.clay]"
  role: bank
  corners: soft
  slope: true
  priority: 2
  hotbar: 6
  item: clay
  dig: shovel
  toughness: 2
  step: step_dirt
  hit: dig
# A bed is earth tilled with a hoe (role bed); watered or in the rain it is wet for a day and darker
# (role bed_wet), and only on wet earth does what is sown grow (src/shared/game/actions_farm.gd). When dug
# with a shovel it gives earth, and what was sown on it is lost.
- id: bed
  title: "[resources.materials.bed]"
  role: bed
  priority: 5
  item: dirt
  dig: shovel
  step: step_dirt
  hit: dig
- id: bed_wet
  title: "[resources.materials.bed_wet]"
  role: bed_wet
  priority: 5
  item: dirt
  dig: shovel
  step: step_dirt
  hit: dig
