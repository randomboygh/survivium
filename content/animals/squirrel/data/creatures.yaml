# The fields are the same as for all creatures (content/core/data/creatures.yaml): who is food or a threat to whom
# is derived from mass and diet by general rules, not written down. The species' picture —
# sprites/creatures/<sprite>.png of this bundle, drawn by hand by tools/make_sprites.gd (tools/art/squirrel_art.gd):
# rows for the side, the front and the back, in each sitting, the walk (short hops on the big hind legs), the
# idle's other frames (one animation), the run (long bounds), four frames each, and one frame of death (no hurt
# frames: a struck one flashes red); killed, it lies on its death frame till its carcass is taken; biomes — where it lives
# (soft references to "Biomes"; without them — everywhere); voices (calls, alarm) — its sounds.yaml.
- id: squirrel
  title: "[animals.creatures.squirrel]"
  mass: 0.5
  diet: [plants]
  speed: 5.0
  sight: 7
  human_wariness: 0.7
  active: day
  count: 10
  sprite: squirrel
  frames: 13
  walk: 4
  run: 4
  death: 1
  idle_anim: true
  views: 3
  roost: trees
  biomes: [biomes:forest, biomes:taiga, biomes:meadow]
  calls: squirrel
  alarm: squirrel
  health: 3
  carcass: small_carcass
