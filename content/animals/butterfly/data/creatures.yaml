# The fields are the same as for all creatures (content/core/data/creatures.yaml): who is food or a threat to whom
# is derived from mass and diet by general rules, not written down. The species' picture —
# sprites/creatures/<sprite>.png of this bundle, three frames: standing and two steps; voices (calls, alarm) — its sounds.yaml.
# An insect: flies low and not far (flight), looks for flowers; prey for birds and frogs.
# It has no hop frames, so it does not walk on the ground: once landed, it sits in place and slowly
# flaps its wings (the first flap) until it takes off.
# The wings are light, each butterfly has its own color from tints.
- id: butterfly
  title: "[animals.creatures.butterfly]"
  mass: 0.01
  diet: [plants]
  speed: 2.5
  sight: 4
  human_wariness: 0.5
  active: day
  count: 8
  sprite: butterfly
  frames: 3
  flies: true
  flight: 8
  tints: ["#ffffff", "#f6d64a", "#f2984a", "#86a8f4", "#d49ae6"]
  flock: [2, 4]
  likes: [plants:flowers]
