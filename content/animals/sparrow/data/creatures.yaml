# The fields are the same as for the core's species (content/core/data/creatures.yaml). The behavior is derived
# from them: a light sparrow is eaten by cats and wolves, and it flies away from them; it fears the human;
# by day it feeds in a flock in the ear fields, flits and lands on the ground and on trees,
# at night it sleeps in trees. The likes reference is soft: without "Plants" the sparrow lives, it just looks for nothing,
# and without trees (roost: trees) it sleeps on the ground.
- id: sparrow
  title: "[animals.creatures.sparrow]"
  mass: 0.03
  diet: [plants]
  speed: 7.0
  sight: 8
  human_wariness: 0.8
  active: day
  count: 18
  sprite: sparrow
  frames: 9
  walk: 4
  hop: 2
  views: 3
  flies: true
  flock: [4, 8]
  roost: trees
  likes: [plants:ears]
  calls: sparrow
  alarm: sparrow
