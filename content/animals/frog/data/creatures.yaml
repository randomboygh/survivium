# The fields are the same as for all creatures (content/core/data/creatures.yaml): who is food or a threat to whom
# is derived from mass and diet by general rules, not written down. The species' picture —
# sprites/creatures/<sprite>.png of this bundle (drawn by tools/make_frog.py):
# three species, frames: sitting, hop, crouching, blinking, throat swollen; voices (calls, alarm) — its sounds.yaml.
# Swims (swims) and climbs ashore (ashore), hops on the ground (hops); comes out only after
# rain, while puddles stand (after_rain), and the more of them there are, the more of it. Food for the perch, the crow and the owl.
- id: frog
  title: "[animals.creatures.frog]"
  mass: 0.05
  diet: [meat]
  speed: 2.0
  sight: 5
  human_wariness: 0.7
  active: any
  count: 4
  sprite: frog
  frames: 5
  walk: 2
  views: 3
  swims: true
  ashore: true
  hops: true
  after_rain: true
  flock: [1, 2]
  calls: frog
  alarm: frog
