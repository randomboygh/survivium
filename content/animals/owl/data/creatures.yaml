# The fields are the same as for all creatures (content/core/data/creatures.yaml): who is food or a threat to whom
# is derived from mass and diet by general rules, not written down. The species' picture —
# sprites/creatures/<sprite>.png of this bundle (drawn by tools/make_birds.py):
# three species, frames: sitting, wing flap ×4, two rest frames, hop ×2; biomes — where it lives
# (soft references to "Biomes"; without them — everywhere); voices (calls, alarm) — its sounds.yaml.
# A nocturnal hunter: from the air it catches both a sparrow in a crown and a frog in the water; sleeps in a tree by day.
- id: owl
  title: "[animals.creatures.owl]"
  mass: 1.2
  diet: [meat]
  speed: 6.5
  sight: 16
  human_wariness: 0.6
  active: night
  count: 3
  sprite: owl
  biomes: [biomes:forest, biomes:taiga]
  frames: 9
  walk: 4
  hop: 2
  views: 3
  flies: true
  roost: trees
  calls: owl
  health: 3
  carcass: small_carcass
