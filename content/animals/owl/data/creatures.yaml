# The fields are the same as for all creatures (content/core/data/creatures.yaml): who is food or a threat to whom
# is derived from mass and diet by general rules, not written down.
# (soft references to "Biomes"; without them — everywhere); voices (calls, alarm) — its sounds.yaml.
# A nocturnal hunter: from the air it catches both a sparrow in a crown and a frog in the water; sleeps in a tree by day.
# The picture, sprites/creatures/<sprite>.png of this bundle, is drawn by hand by tools/make_sprites.gd
# (tools/art/owl_art.gd): rows for the side, the front and the back, in each sitting, the wing beat (walk:
# the frames a flyer plays in the air), the idle's other frames (one animation), the hop on the ground
# (hop: hops), four frames each, and one frame of death (no hurt frames: a struck one flashes red); killed,
# it lies on its death frame till its carcass is taken.
- id: owl
  title: "[animals.creatures.owl]"
  mass: 1.2
  diet: [meat]
  speed: 6.5
  sight: 16
  human_wariness: 0.6
  active: night
  count: 3
  sprite: owl
  biomes: [biomes:forest, biomes:taiga]
  frames: 13
  walk: 4
  hop: 4
  death: 1
  idle_anim: true
  views: 3
  flies: true
  roost: trees
  calls: owl
  health: 3
  carcass: small_carcass
