# The fields are the same as for all creatures (content/core/data/creatures.yaml): who is food or a threat to whom
# is derived from mass and diet by general rules, not written down. The species' picture —
# sprites/creatures/<sprite>.png of this bundle, drawn from the user's reference by tools/make_sprites.gd
# (tools/art/fox_art.gd): rows for the side, the front and the back, in each standing, the walk, the idle's
# other frames (one animation), the run, the hurt and the death, four frames each; killed, it lies on its last
# frame of death till its carcass is taken. Biomes — where it lives (soft references to "Biomes"; without them —
# everywhere); voices (calls, alarm) — its sounds.yaml.
- id: fox
  title: "[animals.creatures.fox]"
  mass: 4.5
  diet: [meat]
  speed: 6.5
  sight: 13
  human_wariness: 0.7
  active: any
  count: 3
  sprite: fox
  biomes: [biomes:meadow, biomes:forest, biomes:taiga]
  frames: 20
  walk: 4
  run: 4
  hurt: 4
  death: 4
  idle_anim: true
  views: 3
  calls: fox
  alarm: fox
  health: 5
  carcass: small_carcass
