# The fields are the same as for all creatures (content/core/data/creatures.yaml): who is food or a threat to whom
# is derived from mass and diet by general rules, not written down. The species' picture —
# sprites/creatures/<sprite>.png of this bundle, three frames (standing and two steps); biomes — where it lives
# (soft references to "Biomes"; without them — everywhere); voices (calls, alarm) — its sounds.yaml. Taming:
# tame_food — what it is fed by hand with (it does not run from one holding it), tame_feeds — how many times, wool — what
# a tame one gives with a knife once every wool_days days, breed_days — once every how many days a pair of tame ones left
# together and fed within a day brings a leveret, while there are fewer than herd of them there; trapped — which live
# item it is as it sits in a live trap, where it came for bait from tame_food (the "Live trap" bundle).
- id: rabbit
  title: "[animals.creatures.rabbit]"
  mass: 2
  diet: [plants]
  speed: 5.5
  sight: 9
  human_wariness: 0.9
  active: day
  count: 14
  sprite: rabbit
  frames: 7
  walk: 4
  views: 3
  likes: [plants:tuft, plants:flowers, plants:clover]
  biomes: [biomes:meadow, biomes:forest]
  alarm: rabbit
  health: 4
  carcass: small_carcass
  tame_food: [plants:carrot, plants:turnip]
  tame_feeds: 3
  wool: rabbit_fluff
  wool_days: 2
  breed_days: 4
  herd: 8
  trapped: tools:live_rabbit
