# Recipes of the "Game animals" bundle: butchering and frying. A small carcass is butchered by hand, a large one with a knife (tools: the class
# of the tool in the bag, wear — how much it loses); meat is fried on the core's campfire or dried on the drying rack
# of "Tools". Fields — docs/DATA_MODEL.md.
- id: raw_meat_from_small_carcass
  title: "[animals.recipes.raw_meat_from_small_carcass]"
  makes: raw_meat
  needs: {small_carcass: 1}
  also:
    - {item: bone, chance: 0.5}
    - {item: hide, chance: 0.3}
  time: 3
- id: raw_meat_from_carcass
  title: "[animals.recipes.raw_meat_from_carcass]"
  makes: raw_meat
  count: 5
  needs: {carcass: 1}
  also:
    - {item: hide, count: 1}
    - {item: bone, count: 3}
    - {item: fat, count: 2}
  tools: [knife]
  wear: 2
  time: 10
- id: roasted_meat
  title: "[animals.recipes.roasted_meat]"
  makes: roasted_meat
  needs: {raw_meat: 1, resources:branch: 1}
  at: core:campfire
  process: cook
  time: 4
- id: jerky
  title: "[animals.recipes.jerky]"
  makes: jerky
  needs: {raw_meat: 1}
  at: tools:drying_rack
  process: refine
  time: 10
