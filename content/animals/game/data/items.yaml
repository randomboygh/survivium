# Предметы бандла «Добыча»: что остаётся от убитого зверя и что из этого выходит. Тушку мелкого зверя
# разделывают руками, тушу крупного — ножом (класс knife, бандл «Нож» «Инструментов»); у зверя туша
# записана в его creatures.yaml (carcass). Шкура с жиром идёт на кожу («Материалы»), кость — на иглу, клей,
# наконечники стрел и составной лук («Инструменты», «Материалы»), жир — ещё на свечу; мясо жарят или вялят.
