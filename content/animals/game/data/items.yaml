# Items of the "Game animals" bundle: what is left of a killed beast and what comes of it. The carcass of a small beast
# is butchered by hand, the carcass of a large one with a knife (class knife, the "Knife" bundle of "Tools"); a beast's carcass
# is written in its creatures.yaml (carcass). Hide with fat goes into leather ("Materials"), bone — into a needle, glue,
# arrowheads and the composite bow ("Tools", "Materials"), fat — also into a candle; meat is fried or dried.
