# The fields are the same as for all creatures (content/core/data/creatures.yaml): who is food or a threat to whom
# is derived from mass and diet by general rules, not written down. The species' picture —
# sprites/creatures/<sprite>.png of this bundle (drawn by tools/make_fish.py):
# three species, frames: standing, tail ×4, fins; voices (calls, alarm) — its sounds.yaml.
# A fish (swims): lives in the open water of rivers and lakes a little under the surface, in a school; it cannot be reached from the shore,
# from the air — birds reach it. catch — what it turns into in the bag when it is pulled out with a rod (an item of the "Fish" bundle).
- id: perch
  title: "[animals.creatures.perch]"
  mass: 0.6
  diet: [meat]
  speed: 3.0
  sight: 6
  human_wariness: 0.6
  fire_wariness: 0.0
  active: any
  count: 8
  sprite: perch
  frames: 6
  walk: 4
  views: 3
  swims: true
  tints: ["#ffffff", "#ffd860", "#d89a6c", "#a8c8f0"]
  flock: [2, 5]
  catch: perch
