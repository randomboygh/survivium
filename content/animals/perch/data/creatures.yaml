# Поля те же, что у всех существ (content/core/data/creatures.yaml): кто кому еда или угроза,
# выводится из массы и рациона общими правилами, а не записано. Картинка вида —
# sprites/creatures/<sprite>.png этого бандла (рисует tools/make_fish.py):
# пять видов, кадры: стоит, хвост ×4, плавники; голоса (calls, alarm) — его sounds.yaml.
# Рыба (swims): живёт в открытой воде рек и озёр чуть под поверхностью, стайкой; с берега её не достать,
# из воздуха — достают птицы. catch — во что он превращается в сумке, когда его вытащили удочкой (предмет бандла «Рыба»).
- id: perch
  title: Окунь
  mass: 0.6
  diet: [meat]
  speed: 3.0
  sight: 6
  human_wariness: 0.6
  active: any
  count: 8
  sprite: perch
  frames: 6
  walk: 4
  views: 5
  swims: true
  tints: ["#ffffff", "#ffd860", "#d89a6c", "#a8c8f0"]
  flock: [2, 5]
  catch: perch
