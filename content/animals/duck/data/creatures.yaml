# The fields are the same as for all creatures (content/core/data/creatures.yaml): who is food or a threat to whom
# is derived from mass and diet by general rules, not written down.
# Both flies and swims (flies, swims), comes ashore (ashore): swims and wanders by the water, swims away from
# a threat, and takes off only if it is close, and flies low and not far (flight).
# The picture, sprites/creatures/<sprite>.png of this bundle, is drawn by hand by tools/make_sprites.gd
# (tools/art/duck_art.gd): rows for the side, the front and the back, in each sitting, the wing beat (walk:
# the frames a flyer plays in the air), the idle's other frames (one animation), the walk (and the swim) on the ground
# (hop with walks: steps, not hops), four frames each, and one frame of death (no hurt frames: a struck one flashes red); killed,
# it lies on its death frame till its carcass is taken.
- id: duck
  title: "[animals.creatures.duck]"
  mass: 1.2
  diet: [plants]
  speed: 6.0
  sight: 10
  human_wariness: 0.7
  active: day
  count: 6
  sprite: duck
  frames: 13
  walk: 4
  hop: 4
  walks: true
  death: 1
  idle_anim: true
  views: 3
  flies: true
  swims: true
  ashore: true
  flight: 12
  flock: [3, 5]
  calls: duck
  alarm: duck
  health: 3
  carcass: small_carcass
