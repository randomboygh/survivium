  human_wariness: 0.7
  active: day
  count: 6
  sprite: duck
  frames: 3
  flies: true
  swims: true
  ashore: true
  flight: 12
  flock: [3, 5]
  calls: duck
  alarm: duck
  health: 3
  carcass: small_carcass
