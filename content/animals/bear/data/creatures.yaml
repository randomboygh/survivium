# The fields are the same as for all creatures (content/core/data/creatures.yaml): who is food or a threat to whom
# is derived from mass and diet by general rules, not written down. The species' picture —
# sprites/creatures/<sprite>.png of this bundle, drawn from the user's reference by tools/make_sprites.gd
# (tools/art/bear_art.gd): rows for the side, the front and the back, in each standing, the walk, the idle's
# other frames (one animation), the attack, the run, the hurt and the death, four frames each; killed, it lies
# on its last frame of death till its carcass is taken. Biomes — where it lives (soft references to "Biomes";
# without them — everywhere); voices (calls, alarm) — its sounds.yaml.
# The heaviest beast: omnivorous, hunts everything up to 200 kg, does not fear people; likes mushroom places.
# Does not fear people: warns one who comes close with a growl and attacks (bite), fights back when wounded.
- id: bear
  title: "[animals.creatures.bear]"
  mass: 250
  diet: [plants, meat]
  speed: 5.5
  sight: 12
  human_wariness: 0.2
  active: any
  count: 2
  sprite: bear
  biomes: [biomes:forest, biomes:taiga]
  frames: 24
  walk: 4
  attack: 4
  run: 4
  hurt: 4
  death: 4
  idle_anim: true
  views: 3
  likes: [plants:mushrooms]
  calls: bear
  alarm: bear
  health: 50
  carcass: carcass
  bite: 18
