# The fields are the same as for all creatures (content/core/data/creatures.yaml): who is food or a threat to whom
# is derived from mass and diet by general rules, not written down. The species' picture —
# sprites/creatures/<sprite>.png of this bundle, three frames: standing and two steps; biomes — where it lives
# (soft references to "Biomes"; without them — everywhere); voices (calls, alarm) — its sounds.yaml.
# The heaviest beast: omnivorous, hunts everything up to 200 kg, does not fear people; likes mushroom places.
# Does not fear people: warns one who comes close with a growl and attacks (bite), fights back when wounded.
- id: bear
  title: "[animals.creatures.bear]"
  mass: 250
  diet: [plants, meat]
  speed: 5.5
  sight: 12
  human_wariness: 0.2
  active: any
  count: 2
  sprite: bear
  biomes: [biomes:forest, biomes:taiga]
  frames: 10
  walk: 4
  attack: 3
  views: 3
  likes: [plants:mushrooms]
  calls: bear
  alarm: bear
  health: 50
  carcass: carcass
  bite: 18
