# The fields are the same as for all creatures (content/core/data/creatures.yaml): who is food or a threat to whom
# is derived from mass and diet by general rules, not written down. The species' picture —
# sprites/creatures/<sprite>.png of this bundle (drawn by tools/make_birds.py):
# three species, frames: sitting, wing flap ×4, two rest frames, hop ×2; voices (calls, alarm) — its sounds.yaml.
# An omnivorous bird in a flock: eats both small fry (sparrows, frogs, butterflies) and ears; roosts in trees.
- id: crow
  title: "[animals.creatures.crow]"
  mass: 0.5
  diet: [plants, meat]
  speed: 7.0
  sight: 12
  human_wariness: 0.7
  active: day
  count: 7
  sprite: crow
  frames: 9
  walk: 4
  hop: 2
  views: 3
  flies: true
  flock: [3, 6]
  roost: trees
  likes: [plants:ears]
  calls: crow
  alarm: crow
  health: 3
  carcass: small_carcass
