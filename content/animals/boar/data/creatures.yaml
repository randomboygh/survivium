# The fields are the same as for all creatures (content/core/data/creatures.yaml): who is food or a threat to whom
# is derived from mass and diet by general rules, not written down. The species' picture —
# sprites/creatures/<sprite>.png of this bundle, three frames: standing and two steps; biomes — where it lives
# (soft references to "Biomes"; without them — everywhere); voices (calls, alarm) — its sounds.yaml.
# A herd of boars: a leader and the others behind it (flock); hardly fears people.
# Does not fear people: warns one who comes right up and strikes with its tusks (bite), fights back when wounded.
- id: boar
  title: "[animals.creatures.boar]"
  mass: 90
  diet: [plants]
  speed: 5.0
  sight: 10
  human_wariness: 0.4
  active: any
  count: 4
  sprite: boar
  biomes: [biomes:forest, biomes:swamp]
  frames: 10
  walk: 4
  attack: 3
  views: 3
  flock: [2, 4]
  likes: [plants:mushrooms]
  calls: boar
  alarm: boar
  health: 32
  carcass: carcass
  bite: 10
