# An oak sapling (kind sapling): an acorn is planted on open ground — grass, earth or a bed — one
# cell away from other trees (trunks stand on odd cells); a frame two cells wide
# (across: 2). In spring, summer and autumn it grows
# grow_days days, wet or dry, and waits in winter: first a sprout and a shoot (frames sprites/plants/
# oak_sapling.png), from the `young` share of the time — a small tree (a trunk and one cap of leaves;
# it can be chopped down for twigs), and the grown one becomes an oak if there is room above it. Digging or
# mowing the ground under a sapling — losing it. gives is a required plant field: a sapling is not picked.
- id: oak_sapling
  kind: sapling
  title: "[plants.plants.oak_sapling]"
  sprite: oak_sapling
  across: 2
  frames: 2
  grows: field
  grow_days: 14
  young: 0.4
  tree: oak
  gives: {acorn: 1}
