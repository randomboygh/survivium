# Росток дуба (kind sapling): жёлудь сажают на открытую землю — траву, землю или грядку — через
# клетку от других деревьев (стволы стоят на нечётных клетках); кадр шириной в две клетки
# (across: 2). Весной, летом и осенью он растёт
# grow_days дней, мокрый или сухой, зимой ждёт: сначала росток и побег (кадры sprites/plants/
# oak_sapling.png), с доли `young` срока — маленькое деревце (ствол и одна шапка листвы;
# его можно срубить на ветки), а выросший становится дубом, если над ним есть место. Копать или
# косить землю под ростком — потерять его. gives — обязательное поле растения: росток не собирают.
- id: oak_sapling
  kind: sapling
  title: Росток дуба
  sprite: oak_sapling
  across: 2
  frames: 2
  grows: field
  grow_days: 14
  young: 0.4
  tree: oak
  gives: {acorn: 1}
