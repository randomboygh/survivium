# Росток дуба (kind sapling): жёлудь сажают на открытую землю — траву, землю или грядку — через
# клетку от других деревьев (стволы стоят на нечётных клетках); весной, летом и осенью он растёт
# grow_days дней, мокрый или сухой, зимой ждёт; картинка — кадр на стадию (sprites/plants/
# oak_sapling.png: росток, побег, деревце). Выросший становится деревом `tree`, если над ним есть
# место; копать или косить землю под ним — потерять его. gives — обязательное поле растения: росток
# не собирают, и оно ничего не даёт.
- id: oak_sapling
  kind: sapling
  title: Росток дуба
  sprite: oak_sapling
  frames: 3
  grows: field
  grow_days: 6
  tree: oak
  gives: {acorn: 1}
