# Tree species: how a tree looks. Where it grows is up to the biomes (content/biomes: the shares of species
# in each biome's trees), not the tree.
# leaves — broad (leaves) or needles (needles). trunk — [min, max] cells of trunk under
# the middle of the crown (broadleaf) or visible under the lowest tier (conifer). crown — the radii
# of the crown along x, upward, along z in crown-lattice points (broadleaf) or [radius of the lowest tier,
# min tiers, max tiers] (conifer). tints — foliage colors, one per tree.
# bare — the share of trees that shed all their leaves in winter. log — the item that falls from the felled
# trunk (one per two cells), twig — what is broken off the crown by hand, knocked down by wind and dropped by a
# felled crown, seed — what else is left from a felled tree (acorn, cone); no field —
# it gives none (references are soft: without "Resources" the tree falls silently). hits — durability: how much axe strength must be
# gathered by strikes to fell the tree (a stone axe strikes for 2, a steel one for 6: soft species 12, oak 24,
# ceiba 32; docs/balance/GAME_BALANCE_DESIGN.md). twigs — how many twigs can be broken off by hand
# from a standing tree in a year, seeds — how many seeds (seed) can be collected from it by hand in autumn.
# shape — the crown's shape: round (a flattened ball), lobed (several caps around the top of the trunk),
# column (narrow, tapering upward), weeping (the crown's edge hangs like a curtain), umbrella (flat caps
# high on a bare trunk), cone (a cone of tiers); without the field — cone for conifers, round for broadleaf.
# leaf — the foliage pattern: pointed (sharp leaves), soft (soft oval ones), curly (curly balls), scales (large round
# overlapping leaves), needles (needles); without the field — needles for conifers, pointed for broadleaf. blossom — the color of
# spring blossom (no field — it does not blossom; no more than seven species blossom). dead — a dry tree: bare
# branches all year round, no leaves and no shade.
# girth — [min, max] trunk thickness at the ground in pixels (a cell is 8, up to 24 — three cells), each tree has its own;
# taper — by how many pixels the trunk gets thinner with each cell upward; crook — by how many
# pixels the trunk can bend sideways; roots — [min, max] roots at the base.
- id: oak
  title: "[plants.trees.oak]"
  shape: lobed
  leaf: curly
  leaves: broad
  trunk: [3, 4]
  girth: [18, 24]
  taper: 0.45
  crook: 2
  roots: [1, 3]
  crown: [2.4, 1.6, 2.0]
  tints: ["#527d47", "#5a8442", "#4d784e"]
  bare: 0.6
  seed: acorn
  log: resources:log
  twig: resources:branch
  hits: 24
  twigs: 4
  seeds: 3
