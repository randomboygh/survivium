# Clover (kind: custom, fields as for the fern): low trefoils in eight looks (mats of leaves, white heads, red
# clover standing tall), each in three greens, in wide fields on the open
# meadows. Hares and deer come to graze on it (their `likes`).
- id: clover
  kind: custom
  title: "[plants.plants.clover]"
  sprite: clover
  frames: 24
  across: 2
  grows: meadow
  cover: 0.9
  clumps: 0.4
  clump_size: 50
  gives: {resources:fiber: 1}
  chance: 0.3
  winter: false
  biomes: [biomes:meadow, biomes:forest_steppe, biomes:floodplain, biomes:alpine_meadow, biomes:birch_grove, biomes:forest, biomes:maple_wood]
