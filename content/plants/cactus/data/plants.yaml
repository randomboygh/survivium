# Cacti (kind: custom, fields as for the fern): a tall cactus with arms, a prickly pear with its red fruit, a
# round barrel cactus in flower: one of the three on a cell (frames). They grow on the bare sand and stone of the
# dry hot land (grows: bare — open ground other than grass), alone, far apart; cut, a cactus gives a fibre and now
# and then a fruit (finds).
- id: cactus
  kind: custom
  title: "[plants.plants.cactus]"
  sprite: cactus
  across: 2
  frames: 3
  # Too stiff to sway in the wind.
  sway: 0
  grows: bare
  cover: 0.012
  gives: {resources:fiber: 1}
  finds: {cactus_fruit: 0.4}
  winter: false
  biomes: [biomes:desert, biomes:rocky_desert, biomes:red_rocks, biomes:oasis]
