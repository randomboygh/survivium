# Peas — a crop (kind crop, grows field): twines on a wet bed in spring, summer and autumn
# grow_days days, one frame per stage (sprites/plants/peas.png: sprout, vines, flowers, pods);
# it is picked by hand or with a sickle. Peas are sometimes found when cutting flowers (the `finds` patch).
- id: peas
  kind: crop
  title: "[plants.plants.peas]"
  sprite: peas
  frames: 4
  grows: field
  grow_days: 3
  gives: {peas: 6}
- id: flowers
  patch: true
  finds+: {peas: 0.04}
