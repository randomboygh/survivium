# Mangrove: a tropical swamp tree — a short crooked trunk on stilt roots that arch
# into the silt, and a dense rounded crown (fields as for the oak, content/plants/oak/data/trees.yaml; stilts — by
# how many pixels the roots rise above the ground). Does not shed its leaves.
- id: mangrove
  title: "[plants.trees.mangrove]"
  shape: round
  leaf: soft
  leaves: broad
  trunk: [3, 4]
  girth: [8, 12]
  taper: 0.4
  crook: 3
  roots: [4, 6]
  stilts: 7
  crown: [1.9, 1.0, 1.6]
  tints: ["#4b7a3c", "#537f37", "#46733f"]
  bare: 0.0
  log: resources:log
  twig: resources:branch
  hits: 16
  twigs: 4
