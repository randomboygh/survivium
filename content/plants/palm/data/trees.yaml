# Palm: a tree of the tropical shore and jungle — a tall thin curved trunk with no branches and on
# its top a tuft of long feathery leaves, a flat round tier, as on a pine (fields as for the oak,
# content/plants/oak/data/trees.yaml; for the palm shape crown — [leaf length in crown points, the fewest and
# the most leaves]). Does not shed its leaves; when felled it drops coconuts, which are picked by hand in autumn.
- id: palm
  title: "[plants.trees.palm]"
  shape: palm
  leaf: pointed
  leaves: broad
  trunk: [7, 10]
  girth: [6, 8]
  taper: 0.12
  crook: 4
  roots: [0, 1]
  crown: [2, 6, 8]
  tints: ["#6e9a3a", "#78a242", "#679236"]
  bare: 0.0
  seed: coconut
  log: resources:log
  twig: resources:branch
  hits: 16
  twigs: 2
  seeds: 3
