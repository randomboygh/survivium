# Виды кустов: куст стоит в одной ячейке воздуха на траве, клиент рисует его
# пучками листвы. Где он растёт, говорят биомы (content/biomes: доли кустов в bushes каждого
# биома), не куст. tint — цвет листвы; berries — цвет спелых ягод (нет поля — без
# ягод); berry_cards — доля пучков с ягодами; cards — пучков на куст; rise — высота
# их середины над землёй в единицах мира; spread — разброс по x, вверх и по z;
# small — мелкие пучки (низкий мелколистный куст); fruit — предмет-ягоды, которые
# собирают летом и осенью, fruit_count — сколько их с куста (от и до); twigs — сколько
# веток (twig — какой предмет; нет поля — куст веток не даёт) можно наломать с куста за год; item — предмет, который даёт куст, выкопанный
# лопатой (его можно посадить снова).
- id: raspberry
  title: Малина
  tint: "#3b5c26"
  berries: "#c72133"
  berry_cards: 0.5
  cards: 9
  rise: 0.38
  spread: [0.26, 0.4, 0.16]
  fruit: raspberry
  fruit_count: [2, 4]
  twigs: 2
  twig: resources:branch
  item: raspberry_bush
