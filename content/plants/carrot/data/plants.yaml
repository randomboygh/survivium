# Carrot — a crop (kind crop, grows field): grows on a wet bed in spring, summer and autumn
# grow_days days, one frame per stage (sprites/plants/carrot.png: sprout, feathery leaves, tops,
# ripe with an orange head); it is picked by hand or with a sickle. Carrot seeds are sometimes found
# when cutting grasses (the `finds` patch).
- id: carrot
  kind: crop
  title: "[plants.plants.carrot]"
  sprite: carrot
  frames: 4
  grows: field
  grow_days: 4
  gives: {carrot: 3, carrot_seeds: 2}
- id: herbs
  patch: true
  finds+: {carrot_seeds: 0.04}
