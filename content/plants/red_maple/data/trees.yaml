# Red maple: the same maple, but its crown is crimson and russet all year round — it makes
# a maple wood visible from afar.
- id: red_maple
  title: "[plants.trees.red_maple]"
  shape: lobed
  leaf: scales
  leaves: broad
  trunk: [3, 4]
  girth: [14, 20]
  taper: 0.4
  crook: 2
  roots: [1, 2]
  crown: [2.2, 1.6, 1.9]
  tints: ["#b8432a", "#cf6a2c", "#a83a26"]
  bare: 1.0
  log: resources:log
  twig: resources:branch
  hits: 20
  twigs: 4
