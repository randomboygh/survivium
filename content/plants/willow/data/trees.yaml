# Tree species: how it looks (fields as for the oak, content/plants/oak/data/trees.yaml). bark is its own
# bark texture in the bundle's textures/ (48×16, as for a material: end, bark, bottom); without the field the trunk
# is drawn as a log of "Timber". Where the species grows is up to the biomes (content/biomes), not the tree.
- id: willow
  title: "[plants.trees.willow]"
  shape: weeping
  leaf: pointed
  leaves: broad
  trunk: [2, 3]
  girth: [14, 20]
  taper: 0.5
  crook: 4
  roots: [2, 4]
  crown: [2.3, 1.3, 2.1]
  tints: ["#6c8c48", "#76964f", "#668644"]
  bare: 0.8
  bark: willow_bark
  log: resources:log
  twig: resources:branch
  hits: 20
  twigs: 6
