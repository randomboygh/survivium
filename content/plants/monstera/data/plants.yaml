# A plant with its own picture (kind: custom), fields as for the fern (content/plants/fern/data/plants.yaml);
# biomes — only in these biomes (no field — everywhere that grows allows).
# Monstera: wide cut leaves of the jungle and mangrove understory, thick in the shade of the crowns; gives fiber.
- id: monstera
  kind: custom
  title: "[plants.plants.monstera]"
  sprite: monstera
  frames: 2
  grows: shade
  cover: 0.55
  gives: {resources:fiber: 1}
  chance: 0.8
  winter: false
  biomes: [biomes:jungle, biomes:mangrove]
