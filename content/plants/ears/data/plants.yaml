# Plants on grass and what they give when cut by hand, with a sword or a scythe. First
# the tall ones are cut (tall grass, flowers, herbs, ears, reeds), and the cell stays grass;
# then the low grass (tuft) together with the material's `mow_gives`, and the earth is left. kind — the plant's role in the world,
# which the grass rules and the drawing know: tuft (low grass), tall_grass (tall-grass meadows),
# flowers and herbs (patches), ears (fields on the plain), reeds (by the water), moss, mushrooms and
# glow_mushrooms (in the shade of the crowns); a role with no entry does not grow in the world. gives — the items and how many
# per plant; chance — how often the plant gives them (0–1); pick — it is picked
# by hand, not cut (so the hint says); winter: false — it is absent in winter.
- id: ears
  kind: ears
  title: "[plants.plants.ears]"
  gives: {grain: 2}
# Wheat — a crop (kind crop, grows field): grows only where grain has been sown on a bed, and
# only on wet ground, in spring, summer and autumn; grow_days — how many days of growth until ripe (pictures
# sprites/plants/wheat.png, one frame per stage: sprout, shoots, green ear, ripe); it dies
# in winter. mown — the ripe crop can be mown with a scythe, not only picked by hand or with a sickle.
- id: wheat
  kind: crop
  title: "[plants.plants.wheat]"
  sprite: wheat
  frames: 4
  grows: field
  grow_days: 4
  mown: true
  gives: {grain: 4}
