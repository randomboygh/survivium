# Cell materials of the "Plants" mod: what trees are made of. The engine asks for them by role: trunk —
# the trunk, crown — the crown; without them trees do not grow. Fields as for the core's materials
# (content/core/data/materials.yaml); the log as an item is an entry of "Resources" (resources:log), this bundle
# adds to it what it places (items.yaml). Sounds — by name, from the "Sounds" mod.
- id: log
  title: "[plants.materials.log]"
  role: trunk
  roof: false
  hotbar: 7
  item: resources:log
  dig: axe
  toughness: 4
  step: step_wood
  hit: chop
- id: leaves
  title: "[plants.materials.leaves]"
  role: crown
  roof: false
  dig: hand
  step: step_grass
  hit: rustle
