# Turnip — a crop (kind crop, grows field, like the wheat of "Ears"): grows on a wet bed
# in spring, summer and autumn grow_days days, one frame per stage (sprites/plants/turnip.png: sprout,
# leaves, tops, ripe with a root); it is picked by hand or with a sickle. Turnip seeds are sometimes
# found when cutting tall grass (the `finds` patch — the item and the chance of one per plant).
- id: turnip
  kind: crop
  title: "[plants.plants.turnip]"
  sprite: turnip
  frames: 4
  grows: field
  grow_days: 5
  gives: {turnip: 2, turnip_seeds: 2}
- id: tall_grass
  patch: true
  finds+: {turnip_seeds: 0.03}
