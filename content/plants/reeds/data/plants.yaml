# Растения на траве и что они дают, когда их срезают руками, мечом или косой. Сначала
# срезаются высокие (высокая трава, цветы, травы, колоски, тростник), и клетка остаётся травой;
# потом низкая трава (tuft) вместе с `mow_gives` материала, и остаётся земля. kind — роль растения в мире,
# которую знают правила травы и рисунок: tuft (низкая трава), tall_grass (луга высокой травы),
# flowers и herbs (пятна), ears (поля на равнине), reeds (у воды), moss, mushrooms и
# glow_mushrooms (в тени крон); роль без записи в мире не растёт. gives — предметы и сколько
# их за одно растение; chance — как часто растение их даёт (0–1); pick — его собирают
# руками, а не срезают (так и пишет подсказка); winter: false — зимой его нет.
- id: reeds
  kind: reeds
  title: Тростник
  gives: {core:fiber: 2}
