# A plant with its own picture (kind: custom): sprite — a row of 8×24 frames (frames) in the bundle's sprites/plants/;
# grows — where it grows: meadow (open grass), shade (shade of the crowns), bank (by the water); cover — what share of such
# ground it takes up (0–1); clumps — the noise threshold (−1..1) above which it grows: in patches, not everywhere
# (no field — everywhere). gives, chance, pick, winter — as for the other plants.
- id: nettle
  kind: custom
  title: "[plants.plants.nettle]"
  sprite: nettle
  frames: 2
  grows: meadow
  cover: 0.5
  clumps: 0.45
  gives: {resources:fiber: 2}
  winter: false
