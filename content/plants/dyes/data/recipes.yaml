# Each dye is boiled of three portions of its source with a full waterskin in a clay pot ("Tools", the potter's
# wheel; it stays in the bag) on the core's campfire: two portions of dye, and the waterskin back empty.
- id: dye_black
  title: "[plants.recipes.dye_black]"
  makes: dye_black
  count: 2
  needs: {materials:charcoal: 3, tools:waterskin_full: 1}
  keeps: {tools:pot: 1}
  also: [{item: tools:waterskin, count: 1}]
  at: core:campfire
  process: cook
  time: 6
