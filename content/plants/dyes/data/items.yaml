# Dyes (the user's plan, decision of 2026-11-21): a dye is an item with `dye` — its three shades, light, middle
# and dark — that a thing with `cloth` (clothes and jewellery of cloth, linen, wool, fiber, straw, leather, beads) is
# dyed with: picked in the craft window as the thing is made, one portion a thing (Workshop.start). Twelve colours,
# not mixed. Their sources: charcoal, evening primrose, cranberries or raspberries, blueberries, acorns, ash (below),
# nettle leaves (the nettle bundle), madder root (madder), woad leaves (woad), and chalk, ochre and murex snails (finds
# of the materials mod).
