# Породы деревьев: как дерево выглядит и на какой земле растёт. land — где генератор его
# сажает: lowland (низинные леса и болота) или highland (высокая холодная земля; чем выше, тем
# больше их доля); нет пород на одной из земель — там растут породы другой.
# leaves — broad (листья) или needles (хвоя). trunk — [мин, макс] ячеек ствола под
# серединой кроны (листва) или видных под нижним ярусом (хвоя). crown — радиусы
# кроны по x, вверх, по z в точках решётки крон (листва) или [радиус нижнего яруса,
# мин ярусов, макс ярусов] (хвоя). tints — цвета листвы, по одному на дерево.
# bare — доля деревьев, сбрасывающих всю листву зимой. seed — предмет, который кроме брёвен и веток
# остаётся от срубленного дерева (желудь, шишка). hits — сколько урона топором нужно,
# чтобы срубить дерево (каменный топор бьёт на 2). twigs — сколько веток можно наломать руками
# со стоящего дерева за год, seeds — сколько семян (seed) собрать с него руками осенью.
# girth — [мин, макс] толщины ствола у земли в пикселях (в ячейке 8), у каждого дерева своя;
# taper — на сколько пикселей ствол тоньше с каждой ячейкой вверх; crook — на сколько
# пикселей ствол может изгибаться в сторону; roots — [мин, макс] корней у комля.
- id: oak
  title: Дуб
  leaves: broad
  land: lowland
  trunk: [6, 8]
  girth: [9, 14]
  taper: 0.45
  crook: 2
  roots: [1, 3]
  crown: [2.2, 1.5, 1.8]
  tints: ["#456e40", "#4c7538", "#406945"]
  bare: 0.6
  seed: acorn
  hits: 6
  twigs: 4
  seeds: 3
- id: spruce
  title: Ель
  leaves: needles
  land: highland
  trunk: [1, 1]
  girth: [7, 10]
  taper: 0.2
  crook: 0
  roots: [0, 2]
  crown: [2.3, 5, 7]
  tints: ["#2e5738", "#335c36", "#2b523d"]
  bare: 0.0
  seed: cone
  hits: 4
  twigs: 3
  seeds: 2
