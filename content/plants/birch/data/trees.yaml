  crown: [1.5, 2.2, 1.3]
  tints: ["#6fa04a", "#7aa852", "#659a46"]
  bare: 1.0
  bark: birch_bark
  log: resources:log
  twig: resources:branch
  hits: 4
  twigs: 4
