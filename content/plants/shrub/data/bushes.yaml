# Bush species: a bush stands in one cell of air on grass, the client draws it
# as tufts of foliage. Where it grows is up to the biomes (content/biomes: the shares of bushes in each
# biome's bushes), not the bush. tint — the foliage color; berries — the color of ripe berries (no field — no
# berries); berry_cards — the share of tufts with berries; cards — tufts per bush; rise — the height
# of their middle above the ground in world units; spread — the spread along x, upward and along z;
# small — small tufts (a low, small-leaved bush); fruit — the berry item that is
# picked in summer and autumn, fruit_count — how many per bush (from and to); twigs — how many
# twigs (twig — which item; no field — the bush gives no twigs) can be broken off a bush in a year; item — the item a bush gives when dug up
# with a shovel (it can be planted again).
- id: shrub
  title: "[plants.bushes.shrub]"
  tint: "#33542b"
  cards: 6
  rise: 0.3
  spread: [0.22, 0.15, 0.15]
  twigs: 3
  twig: resources:branch
  item: shrub_bush
