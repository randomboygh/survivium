# Виды кустов: куст стоит в одной ячейке воздуха на траве, клиент рисует его
# пучками листвы. under — где генератор его сажает и с какой долей: под деревьями
# highland (ели) или lowland (дубы), open (без дерева рядом) или any (куст по умолчанию
# всюду, где не выпал другой). tint — цвет листвы; berries — цвет спелых ягод (нет поля — без
# ягод); berry_cards — доля пучков с ягодами; cards — пучков на куст; rise — высота
# их середины над землёй в единицах мира; spread — разброс по x, вверх и по z;
# small — мелкие пучки (низкий мелколистный куст); fruit — предмет-ягоды, которые
# собирают летом и осенью, fruit_count — сколько их с куста (от и до); twigs — сколько
# веток можно наломать с куста за год; item — предмет, который даёт куст, выкопанный
# лопатой (его можно посадить снова).
- id: blueberry
  title: Черника
  tint: "#305436"
  under: {highland: 0.7}
  berries: "#333d85"
  berry_cards: 0.6
  cards: 8
  rise: 0.16
  spread: [0.28, 0.08, 0.2]
  small: true
  fruit: blueberry
  fruit_count: [2, 3]
  twigs: 1
  item: blueberry_bush
