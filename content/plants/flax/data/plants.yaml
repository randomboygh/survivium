# Дикий лён (kind: custom, поля — как у крапивы; biomes — только в этих биомах): тонкие стебли с голубыми
# цветами, льняными полянами на лугах, в пойме и лесостепи; его срезают руками, мечом или косой и получают
# стебли льна, из которых прядут нить, а иногда и семена (`finds`: предмет и вероятность одного за растение).
- id: flax
  kind: custom
  title: "[plants.plants.flax]"
  sprite: flax
  frames: 2
  grows: meadow
  cover: 0.6
  clumps: 0.45
  gives: {flax_stalks: 2}
  finds: {flax_seeds: 0.3}
  winter: false
  biomes: [biomes:meadow, biomes:floodplain, biomes:forest_steppe]
# Посевной лён — посев (kind crop, grows field): растёт из семян на мокрой грядке весной, летом и
# осенью grow_days дней, кадр на стадию (sprites/plants/sown_flax.png: росток, стебли, голубые
# цветы, спелые золотые коробочки); mown — спелый косят и косой.
- id: sown_flax
  kind: crop
  title: "[plants.plants.sown_flax]"
  sprite: sown_flax
  frames: 4
  grows: field
  grow_days: 4
  mown: true
  gives: {flax_stalks: 3, flax_seeds: 2}
