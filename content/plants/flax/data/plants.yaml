# Wild flax (kind: custom, fields as for the nettle; biomes — only in these biomes): thin stalks with blue
# flowers, in flax glades in meadows, floodplains and forest steppe; it is cut by hand, with a sword or a scythe, giving
# flax stalks, from which thread is spun, and sometimes seeds (`finds`: the item and the chance of one per plant).
- id: flax
  kind: custom
  title: "[plants.plants.flax]"
  sprite: flax
  frames: 2
  grows: meadow
  cover: 0.6
  clumps: 0.45
  gives: {flax_stalks: 2}
  finds: {flax_seeds: 0.3}
  winter: false
  biomes: [biomes:meadow, biomes:floodplain, biomes:forest_steppe]
# Sown flax — a crop (kind crop, grows field): grows from seeds on a wet bed in spring, summer and
# autumn grow_days days, one frame per stage (sprites/plants/sown_flax.png: sprout, stalks, blue
# flowers, ripe golden pods); mown — the ripe crop is also mown with a scythe.
- id: sown_flax
  kind: crop
  title: "[plants.plants.sown_flax]"
  sprite: sown_flax
  frames: 4
  grows: field
  grow_days: 4
  mown: true
  gives: {flax_stalks: 3, flax_seeds: 2}
