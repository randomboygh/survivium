# A server to play on from a phone, for a playtest (stage 1, item 8): run by hand from
# Actions → «Playtest server» → Run workflow. It runs the game's headless server here, on
# GitHub's machine, behind a Cloudflare quick tunnel (src/server/tunnel.gd), for the
# minutes asked, with bots as extra players (src/client/input/bot.gd: they walk about the
# spawn, talk, make gestures, throw things out, set signs and campfires, fell trees and
# hunt; more are added and taken away in the game, PlaytestHost), so the server runs with
# "Free items" (free_items).
# The link to open on the phone (the web build with `?server=wss://…`) is ready about two
# minutes after the start: while the server runs it is in the log of the job's step «Link
# for the phone: open this step» and the commit status «playtest-link» (GitHub shows the
# notice and the summary on the run's page only when the job is over); the game's "Testing" → "Join the test
# server" reads it there (src/client/net/playtest.gd). The world is not saved.
name: Playtest server

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes the server runs (at most 300)
        default: "120"
      seed:
        description: World seed (-1 for the test world, empty for a new one)
        default: "-1"
      bots:
        description: Bots playing about the spawn (0..3)
        default: "3"

permissions:
  contents: read
  # tools/build_info.py reads the merged pull requests for the version.
  pull-requests: read
  # The link as a commit status.
  statuses: write

concurrency:
  group: playtest
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1
  CLOUDFLARED_VERSION: 2026.10.7

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/godot
        with:
          templates: false
      # The version the clients check on joining (Protocol.build_version): the same as the
      # web build of main, else the server says «dev» and nobody can join.
      - name: Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 tools/build_info.py build_info.json
      - name: Download cloudflared
        run: |
          curl -fsSL --retry 3 -o ~/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          chmod +x ~/cloudflared && ~/cloudflared --version
      # The server (and the bots it starts) run on in the background after this step, which ends once
      # the link is there: its log, the notice and the summary show the link during the play.
      - name: Start the server
        env:
          MINUTES: ${{ inputs.minutes }}
          SEED: ${{ inputs.seed }}
          BOTS: ${{ inputs.bots }}
        run: |
          minutes=$(( ${MINUTES//[^0-9]/} + 0 )); [ "$minutes" -ge 1 ] || minutes=60; [ "$minutes" -le 300 ] || minutes=300
          bots=$(( ${BOTS//[^0-9]/} + 0 )); [ "$bots" -le 3 ] || bots=3
          seed_args=()
          if [[ "$SEED" =~ ^-?[0-9]+$ ]]; then seed_args=(--seed "$SEED"); fi
          mkdir -p logs link
          # The bots get what they work with by the recipes, for nothing (bots may also be
          # added in the game, «/test bot+»).
          printf '[rules]\nfree_items=true\n' > logs/playtest.cfg
          nohup ~/godot/godot --headless --path . -- --server --port 7777 --no-save "${seed_args[@]}" --config "$PWD/logs/playtest.cfg" \
            --playtest --minutes "$minutes" --bots "$bots" --bot-logs "$PWD/logs" --tunnel --cloudflared ~/cloudflared </dev/null > logs/server.log 2>&1 &
          server=$!
          link=""
          for _ in $(seq 240); do
            link=$(grep -o 'link for friends: .*' logs/server.log | head -1 | sed 's/^link for friends: //')
            [ -n "$link" ] && break
            kill -0 $server 2>/dev/null || break
            sleep 1
          done
          cat logs/server.log
          if [ -z "$link" ]; then echo "::error::the server gave no link"; exit 1; fi
          echo "::notice title=Link for the phone::$link"
          {
            echo "### Playtest server, $minutes min"
            echo
            echo "Open on the phone: $link"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$link" > link/link.txt
          echo "$server" > logs/server.pid
      # The link as a commit status of the run's commit too («playtest-link»): the API gives
      # it while the run goes on, the job logs only after.
      - name: "Link for the phone: open this step"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          link=$(cat link/link.txt)
          echo
          echo "Open on the phone:"
          echo
          echo "$link"
          echo
          jq -n --arg url "$link" '{state: "success", context: "playtest-link", target_url: $url, description: "Link for the phone"}' \
            | curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @- >/dev/null
      # The server ends itself when its minutes are over (PlaytestHost; «/test hour» in the
      # game gives it more, «/test stop» stops it) and takes its bots with it.
      - name: Play
        run: |
          server=$(cat logs/server.pid)
          while kill -0 "$server" 2>/dev/null; do sleep 15; done
          pkill -f -- '--join ws://localhost:7777' || true
          cat logs/server.log
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-playtest
          path: logs
          if-no-files-found: ignore
