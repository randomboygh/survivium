name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot and web export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz 'templates/web_*' 'templates/version.txt' && rm templates.tpz

      - name: Install export templates
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest" && cp ~/godot/templates/* "$dest/"

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Validate content
        run: ~/godot/godot --headless --path . --script res://tools/validate.gd

      - name: Run tests
        run: ~/godot/godot --headless --path . --script res://tests/run_tests.gd

      - name: Save the game and start it again
        run: timeout 300 ~/godot/godot --headless --path . --script res://tests/save_test.gd

      - name: Play without a screen and check frame times
        run: timeout 600 ~/godot/godot --headless --path . --script res://tests/frame_test.gd

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web

      - name: Smoke test in a browser
        run: |
          python3 -m http.server 8060 --directory build/web >/dev/null 2>&1 &
          npm install --no-save --no-package-lock --silent playwright-core@1.48.2
          node tests/browser_smoke.mjs

      - name: Upload web build (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: survivium-web
          path: build/web

      - name: Upload web build for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
