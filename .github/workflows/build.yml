name: Test and build

# Jobs run side by side: the docs check and the headless tests, the frame test (alone, it
# measures frame times), the web export, then the browser smoke test as a desktop and as a
# phone, each on a machine of its own. On a pull request the smoke test runs only when the PR
# touches what the browser shows differently (see `changes`) or carries the label `smoke`; on
# main it always runs, and the build is published only when everything passed.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.5.1

jobs:
  # Whether the browser smoke test is needed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.check.outputs.smoke }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'smoke') }}
        run: |
          # The client, its shaders, scenes and pictures, the web save store, the export, the
          # smoke test and CI itself. Rules, data and tests are covered by the headless tests.
          web='^(src/client/|src/shared/world/world_store\.gd|shaders/|scenes/|assets/|content/[^/]+/(sprites|models|icons|textures)/|project\.godot|export_presets\.cfg|icon\.png|tests/browser_smoke\.mjs|tools/web_patch\.py|\.github/)'
          if [ -z "$PR" ] || [ "$LABELED" = true ]; then
            smoke=true
          else
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            echo "$files"
            if grep -Eq "$web" <<<"$files"; then smoke=true; else smoke=false; fi
          fi
          echo "smoke test: $smoke"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The docs name only files that exist and the code index is fresh (tools/doc_index.py).
      - name: Docs
        run: python3 tools/doc_index.py --check
      - uses: ./.github/actions/godot
      # The content reports in docs/generated are fresh (tools/content_report.gd, `report`).
      - name: Content, its reports, unit tests, save and the way to every recipe
        run: GODOT=~/godot/godot tests/run_all.sh validate report run_tests save_test progress_test

  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
      - name: Play without a screen and check frame times
        run: GODOT=~/godot/godot tests/run_all.sh frame_test

  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot

      - name: Version and recent changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/build_info.py build_info.json

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          # The engine's audio position worklet posted a message per 128 sound frames of
          # every sound playing, the phone's garbage collector stalled on them.
          python3 tools/web_patch.py build/web
          # The link preview, and the home screen icon drawn at its size rather than the
          # export's smoothed one (tools/make_icon.py).
          cp assets/web/og.png build/web/
          cp assets/web/apple-touch-icon.png build/web/index.apple-touch-icon.png
          ls -la build/web

      - name: Upload web build (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: survivium-web
          path: build/web

      - name: Upload web build for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  smoke:
    needs: [changes, export]
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone]
    name: smoke (${{ matrix.device }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: survivium-web
          path: build/web
      - name: Smoke test in a browser
        run: |
          python3 -m http.server 8060 --directory build/web >/dev/null 2>&1 &
          npm install --no-save --no-package-lock --silent playwright-core@1.48.2
          node tests/browser_smoke.mjs ${{ matrix.device }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [tests, frames, export, smoke]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
