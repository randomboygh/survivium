name: Test and build

# Every job runs side by side on a machine of its own, fastest first to fail: `lint` (no
# Godot, seconds), `checks` (every script compiles, the mods' data, the content reports),
# `tests` (unit tests, save, server), `progress` (the way to every recipe, in two halves on
# two machines), `frames` (alone, it measures frame times), the web export and the Windows
# and Linux exports, then the browser smoke test as a desktop, as a phone and as a phone
# held upright. On a pull request the smoke test runs only when the PR touches what the
# browser shows differently (see `changes`) or carries the label `smoke`; on main and on a
# run by hand (Actions → Test and build → Run workflow) everything runs, and on main the
# builds are published only when every job passed: the web one to Pages, the PC ones to the
# rolling release `pc-latest`. Each test job keeps its logs as an artifact `logs-<job>` and
# writes a table of its checks to the run's summary. docs/testing/CI_PIPELINE.md tells more.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Only reading by default; the two publishing jobs ask for what they write.
permissions:
  contents: read

# A newer push to a pull request cancels its older run; on main every merge's run goes
# to the end, so a merge that broke something is never hidden behind the next one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.5.1

jobs:
  # Whether the browser smoke test is needed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      smoke: ${{ steps.check.outputs.smoke }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'smoke') }}
        run: |
          # The client, its shaders, scenes and pictures, the web save store, the export, the
          # smoke test and CI itself. Rules, data and tests are covered by the headless tests.
          web='^(src/client/|src/shared/world/world_store\.gd|shaders/|scenes/|assets/|content/[^/]+/(sprites|models|icons|textures)/|project\.godot|export_presets\.cfg|icon\.png|tests/browser_smoke\.mjs|tools/web_patch\.py|tools/web_cache\.py|\.github/)'
          if [ -z "$PR" ] || [ "$LABELED" = true ]; then
            smoke=true
          else
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            echo "$files"
            if grep -Eq "$web" <<<"$files"; then smoke=true; else smoke=false; fi
          fi
          echo "smoke test: $smoke"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"

  # Seconds, no Godot: the project's rules for scripts, text files, the Python, shell and
  # browser test scripts, the workflows (tools/lint.py); the docs name only files that
  # exist and the code index is fresh (tools/doc_index.py).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Lint
        run: python3 tools/lint.py
      - name: Docs
        run: python3 tools/doc_index.py --check

  # A minute: every script compiles (tools/parse_check.gd), the mods' data with every
  # bundle by itself (tools/validate.gd) and the content reports in docs/generated are
  # fresh (tools/content_report.gd --check).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/godot
        with:
          templates: false
      - name: Scripts, content and its reports
        run: GODOT=~/godot/godot LOGS=logs tests/run_all.sh parse validate report
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-checks
          path: logs
          if-no-files-found: ignore

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/godot
        with:
          templates: false
      - name: Unit tests, save and the server
        run: GODOT=~/godot/godot LOGS=logs tests/run_all.sh run_tests save_test server_test
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-tests
          path: logs
          if-no-files-found: ignore

  # The way from bare hands to every recipe (tests/progress_test.gd), its two halves on
  # two machines: the recipes that need what a beast gives, and the rest.
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [hunting, other]
    name: progress (${{ matrix.part }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/godot
        with:
          templates: false
      - name: The way to every recipe
        run: GODOT=~/godot/godot LOGS=logs tests/run_all.sh progress_${{ matrix.part }}
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-progress-${{ matrix.part }}
          path: logs
          if-no-files-found: ignore

  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/godot
        with:
          templates: false
      - name: Play without a screen and check frame times
        run: GODOT=~/godot/godot LOGS=logs tests/run_all.sh frame_test
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-frames
          path: logs
          if-no-files-found: ignore

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # tools/build_info.py reads the merged pull requests for «Что нового».
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/godot

      - name: Version and recent changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/build_info.py build_info.json

      - name: The mods' YAML parsed for the game's start (tools/content_cache.gd)
        run: ~/godot/godot --headless --path . --script res://tools/content_cache.gd

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          # The engine's audio position worklet posted a message per 128 sound frames of
          # every sound playing, the phone's garbage collector stalled on them.
          python3 tools/web_patch.py build/web
          # The engine's files named by their content and kept on the device by a service
          # worker: a deploy no longer makes the phone download the 9 MB engine again.
          python3 tools/web_cache.py build/web
          # The link preview, and the home screen icon drawn at its size rather than the
          # export's smoothed one (tools/make_icon.py).
          cp assets/web/og.png build/web/
          cp assets/web/apple-touch-icon.png build/web/index.apple-touch-icon.png
          ls -la build/web

      - name: Upload web build (download from the run page)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: survivium-web
          path: build/web

      - name: Upload web build for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/web

  # The game for Windows (with the console wrapper, which shows the log of a server run from
  # the terminal) and Linux; the same files run the server with `--headless -- --server`.
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # tools/build_info.py reads the merged pull requests for «Что нового».
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/godot

      - name: Version and recent changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/build_info.py build_info.json

      - name: The mods' YAML parsed for the game's start (tools/content_cache.gd)
        run: ~/godot/godot --headless --path . --script res://tools/content_cache.gd

      - name: Export the Windows and Linux builds
        run: |
          mkdir -p build/windows build/linux
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/Survivium.exe
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/Survivium.x86_64
          ls -la build/windows build/linux
          (cd build/windows && zip -qr ../survivium-windows.zip .)
          tar czf build/survivium-linux.tar.gz -C build/linux .

      - name: Upload the Windows build (download from the run page)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: survivium-windows
          path: build/survivium-windows.zip

      - name: Upload the Linux build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: survivium-linux
          path: build/survivium-linux.tar.gz

  smoke:
    needs: [changes, export]
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone, upright]
    name: smoke (${{ matrix.device }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: survivium-web
          path: build/web
      - name: Smoke test in a browser
        run: |
          python3 -m http.server 8060 --directory build/web >/dev/null 2>&1 &
          npm install --no-save --no-package-lock --silent playwright-core@1.48.2
          node tests/browser_smoke.mjs ${{ matrix.device }}

  # The PC builds of main go to the release `pc-latest`, the same files every time.
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [lint, checks, tests, progress, frames, pc, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: survivium-windows
          path: build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: survivium-linux
          path: build
      - name: Put the builds on the release pc-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 tools/build_info.py build_info.json
          version=$(python3 -c 'import json; print(json.load(open("build_info.json"))["version"])')
          notes="Сборки игры для ПК из main, версия $version (обновляются с каждым слиянием). Windows: распакуйте и запустите Survivium.exe; сервер из терминала — Survivium.console.exe --headless -- --server. Linux: ./Survivium.x86_64 (сервер: --headless -- --server)."
          if gh release view pc-latest >/dev/null 2>&1; then
            gh release edit pc-latest --prerelease --title "Сборки для ПК ($version)" --notes "$notes"
          else
            gh release create pc-latest --prerelease --title "Сборки для ПК ($version)" --notes "$notes"
          fi
          gh release upload pc-latest build/survivium-windows.zip build/survivium-linux.tar.gz --clobber

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [lint, checks, tests, progress, frames, export, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
