name: Test and build

# Every job runs side by side on a machine of its own, fastest first to fail: `lint` (no
# Godot, seconds), `checks` (every script compiles, the mods' data, the content reports),
# `tests` (unit tests, save, server), `progress` (the way to every recipe, in two halves on
# two machines), `frames` (alone, it measures frame times), the web export and the Windows
# and Linux exports, then the browser smoke test as a desktop, as a phone and as a phone
# held upright. On a pull request the smoke test runs only when the PR touches what the
# browser shows differently or carries the label `smoke`, and the way to every recipe only
# when the PR touches the content or crafting (see `changes`; the label `full` runs
# everything); on main and on a
# run by hand (Actions → Test and build → Run workflow) everything runs, and on main the
# builds are published only when every job passed: the web one to Pages, the APK and the PC ones
# to a release v<stage>.<PR> with the changes as its notes (and the rolling `android-latest`,
# `pc-latest`). Each test job keeps its logs as an artifact `logs-<job>` and writes a table of its checks to the run's summary. docs/testing/CI_PIPELINE.md tells more.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# Only reading by default; the publishing jobs ask for what they write.
permissions:
  contents: read

# A newer push to a pull request cancels its older run; on main every merge's run goes
# to the end, so a merge that broke something is never hidden behind the next one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.5.1

jobs:
  # What a pull request needs beyond the checks every run makes: the browser smoke test and
  # the way to every recipe. On main and on a run by hand everything runs (main is the
  # safety net: two PRs green apart can break it together); the label `full` turns
  # everything on for a PR, the label `smoke` the smoke test.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      smoke: ${{ steps.check.outputs.smoke }}
      progress: ${{ steps.check.outputs.progress }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full') }}
          SMOKE: ${{ contains(github.event.pull_request.labels.*.name, 'smoke') }}
        run: |
          # The smoke test: the client, its shaders, scenes and pictures, the web save store,
          # the export, the smoke test and CI itself. Rules, data and tests are covered by the
          # headless tests.
          web='^(src/client/|src/shared/world/world_store\.gd|shaders/|scenes/|assets/|content/[^/]+/(sprites|models|icons|textures)/|project\.godot|export_presets\.cfg|icon\.png|tests/browser_smoke\.mjs|tools/web_patch\.py|tools/web_cache\.py|\.github/)'
          # The way to every recipe: only when the PR touches the content or crafting — the
          # mods' data and bundle lists, the content registries, the hands' actions, stations,
          # the craft queue, the bag, felling, fishing, craft quality — the test itself or CI.
          # A rule elsewhere that cuts the way is caught by main's run after the merge
          # (main runs everything and is never cancelled, so the first red run names the merge).
          recipes='^(content/[^/]+/([^/]+/)?(data/|(bundle|mod)\.yaml$)|src/shared/content/|src/shared/game/(actions_[a-z_]+|world_actions|workshop|placed|craft_queue|inventory|felling|fishing|quality)\.gd$|tests/progress_test\.gd$|tests/run_all\.sh$|\.github/)'
          if [ -z "$PR" ] || [ "$FULL" = true ]; then
            smoke=true
            progress=true
          else
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            echo "$files"
            if [ "$SMOKE" = true ] || grep -Eq "$web" <<<"$files"; then smoke=true; else smoke=false; fi
            if grep -Eq "$recipes" <<<"$files"; then progress=true; else progress=false; fi
          fi
          echo "smoke test: $smoke, the way to every recipe: $progress"
          echo "smoke=$smoke" >> "$GITHUB_OUTPUT"
          echo "progress=$progress" >> "$GITHUB_OUTPUT"

  # Seconds, no Godot: the project's rules for scripts, text files, the Python, shell and
  # browser test scripts, the workflows (tools/lint.py); the docs name only files that
  # exist and the code index is fresh (tools/doc_index.py).
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        run: python3 tools/lint.py
      - name: Docs
        run: python3 tools/doc_index.py --check
      - name: English
        run: python3 tools/lang_check.py --strict en,ru

  # A minute: every script compiles (tools/parse_check.gd), the mods' data with every
  # bundle by itself (tools/validate.gd), the content reports in docs/generated and the
  # balance tables in docs/balance are fresh (tools/content_report.gd, balance_report.gd --check).
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/godot
        with:
          templates: false
      - name: Scripts, content and its reports
        run: GODOT=~/godot/godot LOGS=logs tests/run_all.sh parse validate report balance
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-checks
          path: logs
          if-no-files-found: ignore

  tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/godot
        with:
          templates: false
      - name: Unit tests, save and the server
        run: GODOT=~/godot/godot LOGS=logs tests/run_all.sh run_tests save_test server_test
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-tests
          path: logs
          if-no-files-found: ignore

  # The way from bare hands to every recipe (tests/progress_test.gd), its two halves on
  # two machines: the recipes that need what a beast gives, and the rest. On a pull request
  # that cannot reach it (see `changes`) the job passes at once with its steps skipped, so
  # the required checks `progress (hunting)` and `progress (other)` still report.
  progress:
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [hunting, other]
    name: progress (${{ matrix.part }})
    steps:
      - name: Not needed for this pull request
        if: needs.changes.outputs.progress != 'true'
        run: echo "The PR changes nothing the way to every recipe plays; main runs it after the merge (label full runs it here)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.progress == 'true'
      - uses: ./.github/actions/godot
        if: needs.changes.outputs.progress == 'true'
        with:
          templates: false
      - name: The way to every recipe
        if: needs.changes.outputs.progress == 'true'
        run: GODOT=~/godot/godot LOGS=logs tests/run_all.sh progress_${{ matrix.part }}
      - name: Keep the logs
        if: always() && needs.changes.outputs.progress == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-progress-${{ matrix.part }}
          path: logs
          if-no-files-found: ignore

  frames:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/godot
        with:
          templates: false
      - name: Play without a screen and check frame times
        run: GODOT=~/godot/godot LOGS=logs tests/run_all.sh frame_test
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-frames
          path: logs
          if-no-files-found: ignore

  export:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # tools/build_info.py reads the merged pull requests for «Что нового».
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/godot

      - name: Version and recent changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/build_info.py build_info.json

      - name: The mods' YAML parsed for the game's start (tools/content_cache.gd)
        run: ~/godot/godot --headless --path . --script res://tools/content_cache.gd

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          # The engine's audio position worklet posted a message per 128 sound frames of
          # every sound playing, the phone's garbage collector stalled on them.
          python3 tools/web_patch.py build/web
          # The engine's files named by their content and kept on the device by a service
          # worker: a deploy no longer makes the phone download the 9 MB engine again.
          python3 tools/web_cache.py build/web
          # The link preview, the phone keyboard test page (assets/web/keyboard.html), and the
          # home screen icon drawn at its size rather than the export's smoothed one (tools/make_icon.py).
          cp assets/web/og.png assets/web/keyboard.html build/web/
          cp assets/web/apple-touch-icon.png build/web/index.apple-touch-icon.png
          ls -la build/web

      - name: Upload web build (download from the run page)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: survivium-web
          path: build/web

      - name: Upload web build for GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

  # The game for Windows (with the console wrapper, which shows the log of a server run from
  # the terminal) and Linux; the same files run the server with `--headless -- --server`.
  pc:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # tools/build_info.py reads the merged pull requests for «Что нового».
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/godot

      - name: Version and recent changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/build_info.py build_info.json

      - name: The mods' YAML parsed for the game's start (tools/content_cache.gd)
        run: ~/godot/godot --headless --path . --script res://tools/content_cache.gd

      - name: Export the Windows and Linux builds
        run: |
          # The game's name is project.godot's config/name (docs/RENAMING.md).
          name=$(sed -n 's/^config\/name="\(.*\)"$/\1/p' project.godot)
          file=$(echo "$name" | tr 'A-Z ' 'a-z-')
          mkdir -p build/windows build/linux
          ~/godot/godot --headless --path . --export-release "Windows Desktop" "build/windows/$name.exe"
          ~/godot/godot --headless --path . --export-release "Linux" "build/linux/$name.x86_64"
          # The mods as plain files beside the program (decision 186, Content.find_root):
          # the game reads them there, one's own mods go beside them, an update replaces
          # only these; without the folder the copy built in is read.
          for d in build/windows build/linux; do
            rsync -a --exclude='*.import' content/ "$d/content/"
          done
          ls -la build/windows build/linux
          (cd build/windows && zip -qr "../$file-windows.zip" .)
          tar czf "build/$file-linux.tar.gz" -C build/linux .

      - name: Upload the Windows build (download from the run page)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: survivium-windows
          path: build/*-windows.zip

      - name: Upload the Linux build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: survivium-linux
          path: build/*-linux.tar.gz

  # The Android APK (arm64). A build of main is signed by the release key kept in the repository's
  # secrets ANDROID_KEYSTORE (the keystore in base64, alias `survivium`) and
  # ANDROID_KEYSTORE_PASSWORD; a pull request's, or one without them, by a key made for this run,
  # which a phone will not install over the last APK (docs/systems/android.md).
  android:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    # tools/build_info.py reads the merged pull requests for «Что нового».
    permissions:
      contents: read
      pull-requests: read
    outputs:
      key: ${{ steps.apk.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/godot

      - name: Version and recent changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/build_info.py build_info.json

      - name: The mods' YAML parsed for the game's start (tools/content_cache.gd)
        run: ~/godot/godot --headless --path . --script res://tools/content_cache.gd

      - name: Export the APK
        id: apk
        env:
          # The release key only for a build of main: a pull request's run, and a run by hand of
          # another branch, sign with a key made for the run, so a branch's code never sees the key.
          KEYSTORE: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE || '' }}
          KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          # The build tools the export signs the APK with and that verify it.
          BUILD_TOOLS: 35.0.0
        run: |
          # The runner's Android SDK and Java 17 for the export's apksigner.
          settings=~/.config/godot/editor_settings-4.5.tres
          sed -i '/^export\/android\/\(android_sdk_path\|java_sdk_path\) = /d' "$settings"
          printf 'export/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME_17_X64" >> "$settings"
          # The export signs with build-tools 35.0.0 (Godot 4.5's), put in place if the runner lacks them.
          signer="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          if [ ! -x "$signer" ]; then
            echo "build-tools $BUILD_TOOLS are not on the runner: installing them"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BUILD_TOOLS" >/dev/null
          fi
          mkdir -p build/key
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE" | base64 -d > build/key/release.keystore
            pass="$KEYSTORE_PASSWORD"
            echo "key=release" >> "$GITHUB_OUTPUT"
          else
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "::warning::no ANDROID_KEYSTORE secret: the APK is signed by a key made for this run"
            else
              echo "Not a build of main: the APK is signed by a key made for this run (it does not install over a release)."
            fi
            pass=$(openssl rand -hex 16)
            keytool -genkeypair -keystore build/key/release.keystore -alias survivium -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass "$pass" -keypass "$pass" -dname "CN=Survivium"
            echo "key=temporary" >> "$GITHUB_OUTPUT"
          fi
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$PWD/build/key/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=survivium
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$pass"
          # A phone installs an APK over another only with a greater version code: the run's
          # number grows with every run of this workflow.
          version=$(python3 -c 'import json; print(json.load(open("build_info.json"))["version"])')
          sed -i "s/^version\/code=.*/version\/code=$GITHUB_RUN_NUMBER/; s/^version\/name=.*/version\/name=\"$version\"/" export_presets.cfg
          name=$(sed -n 's/^config\/name="\(.*\)"$/\1/p' project.godot)
          file=$(echo "$name" | tr 'A-Z ' 'a-z-')
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-release "Android" "build/android/$file-android.apk"
          rm -rf build/key
          test -s "build/android/$file-android.apk"
          ls -la build/android
          "$signer" verify --print-certs "build/android/$file-android.apk" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK (download from the run page)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: survivium-android
          path: build/android/*.apk

  smoke:
    needs: [changes, export]
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, phone, upright]
    name: smoke (${{ matrix.device }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: survivium-web
          path: build/web
      - name: Smoke test in a browser
        run: |
          python3 -m http.server 8060 --directory build/web >/dev/null 2>&1 &
          npm install --no-save --no-package-lock --silent playwright-core@1.64.1
          # The runner's Chrome is not pinned: its version in the log tells a browser update from a regression.
          "${CHROME_PATH:-/usr/bin/google-chrome}" --version
          node tests/browser_smoke.mjs ${{ matrix.device }}

  # Every build of main that passed every job is a GitHub release: the tag v<stage>.<PR> (the version
  # the game shows) on the merged commit, the notes the «What's new» lines of the PRs merged since the
  # last release (tools/release_notes.py), the APK and the PC builds as its files. The newest one is
  # "Latest", so releases/latest/download/<file> always gives the newest build. The rolling prereleases
  # `android-latest` and `pc-latest` (older links point at them) get the same files.
  release:
    if: github.ref == 'refs/heads/main'
    needs: [lint, checks, tests, progress, frames, export, pc, android, smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags: the notes go from the last release's tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: survivium-windows
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: survivium-linux
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: survivium-android
          path: build

      - name: The release notes
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/release_notes.py build/notes.md | tee -a "$GITHUB_OUTPUT"
          cat build/notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: The release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.notes.outputs.tag }}
          VERSION: ${{ steps.notes.outputs.version }}
          LATEST: ${{ steps.notes.outputs.latest }}
          KEY: ${{ needs.android.outputs.key }}
        run: |
          name=$(sed -n 's/^config\/name="\(.*\)"$/\1/p' project.godot)
          if [ "$KEY" != release ]; then
            printf '\n> The APK is signed with a temporary key: to install the next one this one has to be removed (with its saves).\n' >> build/notes.md
          fi
          files="build/*-android.apk build/*-windows.zip build/*-linux.tar.gz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun of the same build: the notes and the files again.
            gh release edit "$TAG" --title "$name $VERSION" --notes-file build/notes.md --latest="$LATEST"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$name $VERSION" \
              --notes-file build/notes.md --latest="$LATEST"
          fi
          gh release upload "$TAG" $files --clobber

      - name: The rolling prereleases android-latest and pc-latest
        # Only the newest build: an older run finishing late leaves them alone.
        if: steps.notes.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.notes.outputs.tag }}
          VERSION: ${{ steps.notes.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          name=$(sed -n 's/^config\/name="\(.*\)"$/\1/p' project.godot)
          for rolling in android-latest pc-latest; do
            case $rolling in
              android-latest) title="$name for Android ($VERSION)"; files="build/*-android.apk";;
              pc-latest) title="$name for PC ($VERSION)"; files="build/*-windows.zip build/*-linux.tar.gz";;
            esac
            notes="The newest build of main, $VERSION, the same files as the release $TAG (https://github.com/$REPO/releases/tag/$TAG, where its changes are). This prerelease is kept for older links; the newest release is always https://github.com/$REPO/releases/latest."
            # The tag follows the build, so the prerelease names the commit its files are of.
            gh api -X PATCH "repos/$REPO/git/refs/tags/$rolling" -f sha="$GITHUB_SHA" -F force=true >/dev/null \
              || gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$rolling" -f sha="$GITHUB_SHA" >/dev/null
            if gh release view "$rolling" >/dev/null 2>&1; then
              gh release edit "$rolling" --prerelease --latest=false --title "$title" --notes "$notes"
            else
              gh release create "$rolling" --prerelease --latest=false --title "$title" --notes "$notes"
            fi
            gh release upload "$rolling" $files --clobber
          done

  # The web build of main to Pages, one deploy at a time, and only the build of main's newest commit:
  # an older run finishing late (main's runs are never cancelled) or rerun leaves Pages alone.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [lint, checks, tests, progress, frames, export, smoke]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Is this main's newest commit
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "newest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at $head now, not $GITHUB_SHA: its own run deploys, this older build stays off Pages"
          fi
      - id: deployment
        if: steps.head.outputs.newest == 'true'
