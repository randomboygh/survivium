html/head_include="<script>(function(){var t=0;function kick(){clearTimeout(t);t=setTimeout(function(){window.dispatchEvent(new Event('resize'));},100);}if(window.visualViewport){window.visualViewport.addEventListener('resize',kick);}window.addEventListener('orientationchange',function(){kick();setTimeout(kick,500);});})();</script><style>#status{background:linear-gradient(#22384a 0.0% 8.9%,#2c4a5a 8.9% 17.7%,#3a5d68 17.7% 26.6%,#4f7273 26.6% 35.4%,#6c857a 35.4% 44.3%,#93977f 44.3% 53.1%,#b8a383 53.1% 62.0%,#b8a383 62% 67%,#35503f 67% 79%,#263b2f 79%)!important}#status-splash{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(160vw,1400px)!important;height:auto!important;max-width:none!important;max-height:none!important;margin:0!important;object-fit:contain!important;image-rendering:pixelated}#status-progress{-webkit-appearance:none;appearance:none;width:min(60vw,360px)!important;height:16px;top:66%;bottom:auto!important;border:3px solid #0f0a06;border-radius:0;background:#1c140d}#status-progress::-webkit-progress-bar{background:#1c140d}#status-progress::-webkit-progress-value{background:#e9b44c}#status-progress::-moz-progress-bar{background:#e9b44c}#status-notice{font-family:monospace;color:#f3e7cc;background:#1c140d;border:3px solid #0f0a06}</style>"
